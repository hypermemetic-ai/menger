[workspace]
# MFE-9: `tickets-api` is the ticket vocabulary both halves of menger share
# (the server here, the browser app in frontend/). A workspace member so
# `cargo test --workspace` covers its wire-casing guards; `frontend/` stays
# out of it — its empty [workspace] table detaches it, so `cargo build` here
# still never needs the wasm toolchain.
members = [".", "tickets-api"]

[package]
name = "menger"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "A plan is a program whose leaves are prose — ticketing on Plexus RPC"

[lib]
name = "menger"
path = "src/lib.rs"

[[bin]]
name = "menger"
path = "src/main.rs"

[dependencies]
# MFE-9: the ticket vocabulary, shared with the browser app (frontend/)
# so a renamed field is a wasm compile error, not a blank cell. Default
# features: the types only — the `client` feature (the generated Plexus
# client, plexus 0.6) is the frontend's, and stays out of this graph.
menger-tickets-api = { path = "tickets-api" }

plexus-core = "0.5"
plexus-macros = "0.5"
# Slim: default features off drops the rmcp/MCP stack; http-gateway enables
# the REST + SSE bridge (MNG-8). Note rmcp still arrives via plexus-core —
# out of scope here, see plans/MNG/artifacts/MNG-8-result.md.
plexus-transport = { version = "0.2", default-features = false, features = ["http-gateway"] }

tokio = { version = "1", features = ["full"] }
async-stream = "0.3"
futures = "0.3"

# Brought in transitively by the plexus_macros::activation expansion.
async-trait = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
jsonrpsee = { version = "0.26", features = ["server", "macros"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.1", features = ["derive"] }

# Day-one web shell (static page over the Plexus WebSocket). MFE-2 adds
# the /app static serving and the same-origin /rest reverse proxy (the
# REST port emits no CORS headers, so the browser app must stay
# same-origin); hyper/hyper-util are the proxy's streaming HTTP client.
axum = "0.8"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"

clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
chrono = "0.4"

# MNG-2: embedded system of record behind the cache (in-process, no server),
# and the per-user default data directory (ecosystem precedent: hyperforge).
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# Wire-level tests speak the same protocol as web/index.html.
jsonrpsee = { version = "0.26", features = ["server", "macros", "ws-client"] }
# Hermetic tests: every server gets its own isolated database location.
tempfile = "3"
# REST-level tests (tests/rest.rs, tests/app.rs) speak plain HTTP/SSE to
# the spawned binary via hyper/hyper-util/http-body-util — all moved to
# [dependencies] with MFE-2 (the shell's /rest proxy client).

# MNG-8: the REST bridge shipped broken in every published plexus-transport
# (0.2.2 http-gateway never compiled; 0.3.0 is byte-identical — see
# plans/MNG/artifacts/MNG-8-result.md). The repaired 0.2.3 is tagged on the
# public repo but not published to crates.io, so the 0.2 requirement above
# is satisfied from the git tag instead.
[patch.crates-io]
plexus-transport = { git = "https://github.com/hypermemetic-ai/plexus-transport.git", tag = "plexus-transport-v0.2.3" }
