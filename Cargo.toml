[workspace]
# MFE-9: `tickets-api` is the ticket vocabulary both halves of menger share
# (the server here, the browser app in frontend/). A workspace member so
# `cargo test --workspace` covers its wire-casing guards; `frontend/` stays
# out of it — its empty [workspace] table detaches it, so `cargo build` here
# still never needs the wasm toolchain.
#
# FRAME-4: the shell (`plexus-webapp`, SCAFFOLD-5, published) and the login
# (`plexus-login`, SCAFFOLD-9; published, V2-47) are
# repositories of their own, taken below — not members here.
# FRAME-5: the ui service (UI-3's activation and its own file, `ui.db`) is
# plexus-ui's `plexus-ui-service`, by published version below (V2-47).
# FRAME-3: the component compiler and the engine (UI-5, UI-6) are
# plexus-ui's (`plexus-ui-compiler`, `plexus-ui-engine`): the compiler a
# dev-dependency below at the service's version, the engine built into the
# bundle by plexus-ui's tool (FRAME-8) from that version's tag,
# plexus-ui-v<version> (scripts/plexus-ui-src). scripts/plexus-ui-release
# publishes plexus-ui and moves both lines in one step.
# V2-24: `media/` is the media service — menger-media, a service of v2's own
# beside `tickets` and `ui`, its images in a file of its own (`media.db`).
# V2-29: `docs/` is the docs service — menger-docs, documents on their own
# API and file (`docs.db`), the editor's surface writing to it.

# V2-31: `quota/` is the quota service — menger-quota, allowances per
# principal and source, its ledger in a file of its own (`quota.db`).
members = [".", "tickets-api", "media", "docs", "quota"]
# TETHER-7: `tether/` is a workspace of its own — substrate's sqlx and this
# workspace's rusqlite link two libsqlite3-sys, which one resolve refuses.
exclude = ["tether"]

[package]
name = "menger"
# SCAFFOLD-9: 0.6 — the login moved to plexus-login; `menger::sessions`,
# `menger::login`, … are its re-exports, and their signatures changed
# (`Sessions::new(ttl, &names)`, `LoginAuth::new(…, app)`).
version = "0.7.1"
edition = "2021"
license = "MIT"
description = "A plan is a program whose leaves are prose — ticketing on Plexus RPC"
repository = "https://github.com/hypermemetic-ai/menger"
readme = "README.md"
keywords = ["ticketing", "planning", "plexus", "rpc"]
categories = ["web-programming::http-server", "development-tools"]
# DIST-3: what the published crate carries — the server's sources. v2: the
# frontend (web/, frontend/, the embedding build script) is deleted; tag
# v0.0.1 holds it. The tests, deploy/ and perf/ stay in the repository.
include = [
    "/src/**",
    # DIST-19: the UI the binary carries — build.rs includes embed/ui.tar
    # when scripts/embed-ui has put it there (never committed).
    "/build.rs",
    "/embed/**",
    "/README.md",
    "/LICENSE",
]

# DIST-22: where `cargo binstall menger` finds a built binary — the archive
# scripts/package writes, an asset of the GitHub release tagged v<version>.
# These are binstall's own defaults, written out so the names are held by a
# test (scripts/tests/package) rather than by a guess.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lib]
name = "menger"
path = "src/lib.rs"

[[bin]]
name = "menger"
path = "src/main.rs"

# PERF-24: the scale harness — a dataset of 10³ … 10⁹ tickets written into a
# store file, then the server started on it and measured over the wire.
# Measurement only: `cargo build --release --features scale --bin menger-scale`.
[[bin]]
name = "menger-scale"
path = "scripts/scale/menger-scale.rs"
required-features = ["scale"]

[features]
scale = ["menger-tickets-api/scale"]

[dependencies]
# MFE-9/MFE-11: the tickets activation — vocabulary, store, the activation
# and its generated client, from one declaration — shared with the browser
# app (frontend/), which takes it with `default-features = false`. Default
# features here: `server`, the real thing.
menger-tickets-api = { path = "tickets-api", version = "0.7.1" }
# V2-24: the media service — `media.put` and `media.get`, its own file, the
# ticket's permit asked of `tickets` through the seam; the shell's
# `/media/<hash>` is its client too (menger_media::fetch).
menger-media = { path = "media", version = "0.7.1" }
# V2-29: the docs service — documents on their own API and file (`docs.db`),
# every write a revision, the organization's roles held by the gate.
menger-docs = { path = "docs", version = "0.7.1" }
# V2-31: the quota service — allowances per principal and source, `quota.*`,
# its own file (`quota.db`); the meter the tickets service's writes reserve
# through; the write-rate bucket the call layer keeps.
menger-quota = { path = "quota", version = "0.7.1" }
# UI-3, FRAME-5: the ui service — the framework's (plexus-ui's `service/`):
# its activation registered beside `tickets`, its routes mounted on the
# shell, serving `/`, `/app/` and `/app/<hash>/…` from its store.
# V2-47: by published version; scripts/plexus-ui-release moves it.
plexus-ui-service = "0.2.3"

# SCAFFOLD-5: the shell (the app's build as a table, stamped and served) and
# the local server (`menger::local`'s serving) — plexus-webapp, a repository
# of its own (FRAME-4), published as the plexus line is (PLEXUS-16).
plexus-webapp = "0.3.1"

# V2-58: the plexus 0.8 line — plexus-core 0.8.0, plexus-macros 0.8.0
# (the `client` / `server_cfg` activation flags, MACRO-4), plexus-client
# 0.8.0, plexus-auth-core 0.3.0 and plexus-transport 0.7.0 (MFE-10 took
# the 0.7 line). PLEXUS-16: every one by its published version from crates.io,
# never by path outside this repository, so the graph resolves exactly one
# of each — plexus-login and plexus-ui's crates too (V2-47), so a clone of
# menger alone builds.
# PLEXUS-44: plexus-core, plexus-transport and plexus-auth-core through the
# plexus-rpc umbrella, with the features each had:
# POLYGLOT-5 (V2-44): `clap` — plexus-core's ChildArgs, `--child` and its
# flags spelled as every service spells them.
# The transport slim: `http-gateway` enables the REST + SSE bridge (MNG-8);
# TRANSPORT-15 (V2-43): `mcp` mounts the MCP bridge (plexus-transport-mcp)
# behind the login — menger's /mcp.
# IDENTITY-14: `auth-adapters` — login at the boundary, the provider adapters
# (IDENTITY-13) turn each provider's credential into Plexus types at the
# WebSocket upgrade. Used only when an --auth-provider is given.
plexus-rpc = { version = "0.8.0", features = ["clap", "http-gateway", "mcp", "auth-adapters"] }
# SCAFFOLD-3/SCAFFOLD-9: the login — providers, the page, sessions, the
# gate, the auth backend, the wiring — its own crate and repository
# (FRAME-4), by published version (V2-47); menger implements its `LoginAccess` over
# `Access` (src/login_access.rs) and `main` runs on its `Wiring`.
plexus-login = "0.3.1"
# IDENTITY-19: the login page — the shell asks the provider itself (discovery,
# token endpoint), keeps sessions keyed by a random id (hashed), and runs the
# code flow with PKCE. All already in the lock through plexus-auth-core.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
rand = "0.8"
sha2 = "0.10"
# DIST-14: the local admin key's public half (`first_run`).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
# IDENTITY-35: the dev sign-in registers accounts at plexus-idp over its
# Plexus socket (identity.register); already in the lock (plexus-transport).
# DIST-3: `server` for the WebSocket's stop handle (menger::local).
jsonrpsee = { version = "0.26", features = ["ws-client", "server"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Day-one web shell (static page over the Plexus WebSocket). MFE-2 adds
# the /app serving; ACCESS-33 removed its /rest reverse proxy, and with it
# the proxy's HTTP client (hyper, hyper-util, http-body-util — the tests'
# own now, below).
axum = "0.8"

clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"

# The per-user default data directory (ecosystem precedent: hyperforge);
# the store itself (rusqlite behind the cache, MNG-2) lives in tickets-api.
dirs = "6"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }


[dev-dependencies]
# TRANSPORT-15 (V2-43): tests/mcp.rs drives menger's /mcp with an rmcp 3.x
# client over streamable HTTP. rmcp's HTTP client is reqwest 0.13; menger's
# own is 0.12 (plexus-login's), so the test names the newer one `reqwest13`.
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest13 = { package = "reqwest", version = "0.13", default-features = false }
# Wire-level tests speak the same protocol as web/index.html.
jsonrpsee = { version = "0.26", features = ["server", "macros", "ws-client"] }
serde_json = "1"
# MFE-11: tests/wire_client.rs drives the generated TicketsClient over the
# native WebSocket transport against the in-process server; V2-4:
# tests/seam.rs declares a probe activation of its own, beside `tickets` in a
# test service — plexus-client's ws-native and the macros, through the
# umbrella (PLEXUS-44).
plexus-rpc = { version = "0.8.0", features = ["client-ws"] }
schemars = { version = "1.1", features = ["derive"] }
async-stream = "0.3"
# tests/durability.rs inspects the database file directly.
rusqlite = { version = "0.37", features = ["bundled"] }
# Hermetic tests: every server gets its own isolated database location.
tempfile = "3"
# IDENTITY-14: tests/login.rs mints provider tokens and NIP-98 events the
# way a provider and a nostr client would.
jsonwebtoken = "9"
nostr = { version = "0.45", default-features = false, features = ["std", "os-rng"] }
base64 = "0.22"
# IDENTITY-42: tests/agent_login.rs holds agents' Ed25519 keys.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# REST-level tests (tests/rest.rs, tests/app.rs) speak plain HTTP/SSE to
# the spawned binary (ACCESS-33: back here from [dependencies], where the
# shell's /rest proxy needed them).
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
# UI-3: tests/wire_ui.rs and tests/ui_serve.rs build a bundle (a small tar)
# and sign its sha256.
tar = { version = "0.4", default-features = false }
# UI-7: tests/wire_ui_compile.rs knows a source's tree from the compiler
# natively (the same bytes as the module, UI-5), and registers a reduced
# `tickets` — a probe activation (plexus-macros, schemars, async-stream:
# V2-4's, above) — to show the lint reads the running service.
# FRAME-3, V2-47: by published version, the service's; scripts/plexus-ui-release moves it.
plexus-ui-compiler = "0.2.3"
# UI-7: the in-process tests' stub compiler modules, written as text.
wat = "1"
# V2-29: tests/wire_docs.rs types into a document as two browsers would — two
# Yjs copies of its CRDT (yrs, the docs service's own).
yrs = "0.28.0"

# MNG-8's `[patch.crates-io]` on the plexus-transport-v0.2.3 tag went with
# MFE-10: the REST bridge fixes it carried are on plexus-transport `main`
# (0.5.0), published since.

# UI-7: the compiler module is compiled by cranelift when the server starts
# with --ui-compiler; unoptimised (a dev or test build) that takes ~15 s for
# UI-5's 1.2 MB module, optimised well under a second. The release build is
# optimised whole; these keep the tests' servers starting promptly.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-native]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime-internal-core]
opt-level = 3

# PERF-6 (PLEXUS/PERF-6): the one build perf runs and releases use, PERF-1's
# `profiles` fork built to its recommendation. Release, with LTO across every
# crate and one codegen unit, and line tables kept for flamegraphs; `panic` is
# release's (menger's tests rely on unwinding). Dev, test and release are
# unchanged. `cargo build --profile perf`; plexus-bench measures with it.
[profile.perf]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# DIST-22: the build people download (scripts/package). Release, thin LTO,
# and nothing but the program in the file: no symbols, no line tables — the
# perf build's 260 MB is mostly those. Never a release the pipeline deploys.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = false
strip = true

# CI-9 (owner, 2026-11-05: "sub 5 minutes into test … ideally sub 30 seconds"): test's quick
# build, `deploy/pipeline build --fast`. Release's optimisation without the perf profile's fat LTO
# and single codegen unit (7½ of the 11 minutes into test), compiled incrementally in the build
# checkout's warm target. Never a prod candidate: `remote prod` refuses a fast release, and its
# suite runs no bench — prod takes the perf build, the one plexus-bench holds to its goldens.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

# CI-9: the tests' code optimised a little — tickets-api's (680 of the suite's 1600
# test-seconds unoptimised: seeded-store scans, bodies read at the cap) and every dependency's
# (SQLite, serde, the servers' stacks; built once, then sccache's). tickets-api's own tests: 72 s
# → 25 s on 12 cores, 513 → 161 CPU-seconds; its build after a change the same. In the test
# profile alone, so `cargo build`'s dev builds stay as they were; debug assertions and overflow
# checks stay on.
[profile.test.package.menger-tickets-api]
opt-level = 1
[profile.test.package."*"]
opt-level = 1
