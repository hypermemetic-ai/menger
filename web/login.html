<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="same-origin">
<title>Sign in · {{TITLE}}</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- IDENTITY-19: menger's login page. Self-contained (no app, no fonts, no
     scripts but the one below), so it can be handed to an IdP as its hosted
     login page later. The shell fills the {{…}} placeholders, escaped. -->
<script>try{var t=localStorage.getItem("menger.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
  /* menger's palette (frontend/index.html :root), the tokens this page uses. */
  :root {
    color-scheme: light;
    --bg: #fbfbf9; --panel: #f4f3ee; --card: #fff; --ink: #1f2328; --muted: #8a8f98;
    --line: #e3e1d8; --accent: #0066cc; --accent-ink: #fff; --hover: #ecebe4;
    --err-bg: #fdecec; --err-fg: #a23; --err-line: #f3c5c5; --shadow: rgba(31, 35, 40, .08);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #101014; --panel: #17171d; --card: #1e1e26; --ink: #d8d8e0; --muted: #7a7a88;
      --line: #26262e; --accent: #8ab4f8; --accent-ink: #101014; --hover: #1f1f28;
      --err-bg: #2b1517; --err-fg: #e89393; --err-line: #5a2626; --shadow: rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #101014; --panel: #17171d; --card: #1e1e26; --ink: #d8d8e0; --muted: #7a7a88;
    --line: #26262e; --accent: #8ab4f8; --accent-ink: #101014; --hover: #1f1f28;
    --err-bg: #2b1517; --err-fg: #e89393; --err-line: #5a2626; --shadow: rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font: 600 20px var(--mono); letter-spacing: -.01em; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 7px; background: var(--ink); color: var(--bg);
    display: grid; place-items: center; font: 700 17px var(--mono);
  }
  .card {
    width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 28px 28px 24px; box-shadow: 0 1px 2px var(--shadow), 0 8px 24px var(--shadow);
  }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
  .error {
    background: var(--err-bg); color: var(--err-fg); border: 1px solid var(--err-line);
    border-radius: 8px; padding: 9px 12px; font-size: 13.5px; margin: 0 0 16px;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .row a { font-size: 13px; }
  input[type=text], input[type=password], input[type=email] {
    width: 100%; font: inherit; padding: 9px 11px; margin: 0 0 14px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button {
    width: 100%; font: inherit; font-weight: 600; padding: 10px 12px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); margin-top: 4px; }
  button.primary:hover { filter: brightness(1.05); }
  button.link { background: none; border: 0; color: var(--accent); font-size: 13px; padding: 10px 0 0; height: auto; width: 100%; cursor: pointer; }
  button.link:hover { text-decoration: underline; }
  button.alt { background: var(--card); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  button.alt:hover { background: var(--hover); }
  button:disabled { opacity: .55; cursor: default; }
  .or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12.5px; margin: 20px 0 16px; }
  .caption { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  .or::before, .or::after { content: ""; height: 1px; background: var(--line); flex: 1; }
  .alts { display: grid; gap: 10px; }
  .alts svg { width: 18px; height: 18px; flex: none; }
  .sso { display: none; margin-top: 2px; }
  .sso.open { display: block; }
  .sso input { margin-bottom: 10px; }
  .foot { margin-top: 18px; color: var(--muted); font-size: 12.5px; text-align: center; }
  .foot a { color: var(--muted); }
  .note { color: var(--muted); font-size: 12.5px; margin: 14px 0 0; text-align: center; }
  /* IDENTITY-35: the dev sign-in (test only). */
  .dev-toggle {
    display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 13px; margin: 0 0 18px;
    padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; background: var(--panel); cursor: pointer;
  }
  .dev-toggle span { margin-left: auto; color: var(--muted); font-size: 11.5px; font-weight: 400; }
  .dev-toggle input { margin: 0; }
  button.who { justify-content: space-between; padding: 8px 12px; }
  button.who span { color: var(--muted); font-size: 12.5px; font-weight: 400; text-align: right; }
  .roster { gap: 6px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  select {
    width: 100%; font: inherit; padding: 9px 11px; margin: 0 0 14px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="brand"><span class="mark">m</span>{{TITLE}}</div>
  <main class="card">
    <h1>Sign in</h1>
    <p class="sub">to continue to {{TITLE}}</p>
    {{DEV}}
    {{ERROR}}
    {{PASSWORD}}
    {{OR}}
    <div class="alts">
      {{BUTTONS}}
      {{NOSTR}}
    </div>
    <p class="note">Don't have access? Sign in, then send an admin the id you are shown.</p>
  </main>
  <p class="foot">{{TITLE}} v{{VERSION}}</p>
  <script>
    // IDENTITY-35: the dev sign-in's checkbox — this browser's sign-in to
    // plexus-idp, or back to the ordinary page.
    const dev = document.getElementById("dev-login");
    if (dev) dev.addEventListener("change", () => {
      document.cookie = "menger_dev_login=" + (dev.checked ? "1; Max-Age=2592000" : "; Max-Age=0") + "; Path=/; SameSite=Lax";
      location.reload();
    });
    // SSO asks for a work email first; nostr signs one NIP-98 event with the
    // browser's NIP-07 extension. Everything else is a plain form or link.
    for (const b of document.querySelectorAll("[data-sso]")) {
      b.addEventListener("click", () => {
        const f = document.getElementById(b.dataset.sso);
        f.classList.add("open");
        f.querySelector("input[type=email]").focus();
      });
    }
    const n = document.getElementById("nostr");
    if (n) {
      // IDENTITY-30: say what is happening — an extension may take its time
      // (a hardware wallet asks its owner), and a refusal says why.
      const say = (text, bad) => {
        let p = document.getElementById("nostr-status");
        if (!p) { p = document.createElement("p"); p.id = "nostr-status"; p.setAttribute("role", "status"); n.after(p); }
        p.className = bad ? "error" : "note";
        p.textContent = text;
      };
      // Each step to the server's log too: what the extension did never
      // reaches /login/nostr otherwise.
      const trace = (stage, detail) => {
        try {
          const ext = window.nostr ? Object.keys(window.nostr).sort().join(",") : "none";
          fetch("/login/nostr/trace", { method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ stage, detail: (detail || "") + " · window.nostr: " + ext + " · " + navigator.userAgent.slice(-60) }) });
        } catch (e) {}
      };
      if (!window.nostr) n.title = "needs a nostr extension (NIP-07) in this browser";
      n.addEventListener("click", async () => {
        if (!window.nostr) { say("No nostr extension (NIP-07) answers in this browser.", true); trace("no extension"); return; }
        const url = location.origin + "/login/nostr";
        n.disabled = true;
        say("Waiting for your nostr extension to sign…");
        trace("asked the extension to sign");
        const t0 = Date.now();
        const slow = setTimeout(() => { say("Still waiting for your nostr extension. Approve the request there (and on your signing device, if it uses one); a signature has to arrive within a minute."); trace("still waiting", "15 s"); }, 15000);
        let ev;
        try {
          ev = await window.nostr.signEvent({ kind: 27235, created_at: Math.floor(Date.now() / 1000),
            content: "", tags: [["u", url], ["method", "POST"]] });
        } catch (e) {
          clearTimeout(slow); n.disabled = false;
          say("Your nostr extension did not sign" + (e && e.message ? ": " + e.message : "."), true);
          trace("the extension refused", (e && e.message) || String(e));
          return;
        }
        clearTimeout(slow);
        if (!ev || !ev.sig) { n.disabled = false; say("Your nostr extension answered without a signature.", true); trace("answered without a signature", typeof ev + " " + JSON.stringify(ev).slice(0, 120)); return; }
        trace("the extension signed", Math.round((Date.now() - t0) / 1000) + " s");
        say("Signed. Signing in…");
        try {
          const r = await fetch(url + "?next=" + encodeURIComponent(n.dataset.next), {
            method: "POST", headers: { authorization: "Nostr " + btoa(JSON.stringify(ev)), accept: "application/json" } });
          const body = await r.json().catch(() => ({}));
          if (r.ok && body.next) { location.href = body.next; return; }
          n.disabled = false;
          say(body.error || "menger did not accept the signature (" + r.status + ").", true);
        } catch (e) {
          n.disabled = false;
          say("menger could not be reached: " + (e && e.message ? e.message : e), true);
        }
      });
    }
  </script>
</body>
</html>
