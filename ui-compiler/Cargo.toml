# UI-5: the compiler — a component's source (src/<name>.svelte, the subset
# UI-4 pins) to the contract's view tree (components/<name>.json) and its
# Rhai handlers (components/<name>.rhai). A pure function: no OS, no clock,
# no randomness, the same bytes natively and as a wasm module that imports
# nothing (`--features wasm`, scripts/ui-compiler-wasm.sh →
# dist/ui-compiler.wasm), which push (UI-7) runs in wasmtime under fuel.
[package]
name = "menger-ui-compiler"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "menger's ui compiler — a component's source to the contract's view tree and Rhai handlers, natively and in wasm"
publish = false

[lib]
name = "menger_ui_compiler"
path = "src/lib.rs"

[[bin]]
name = "ui-compiler"
path = "src/main.rs"

[features]
# The C ABI the wasm module exports: `compile(ptr, len) -> (ptr << 32 | len)`,
# `alloc(len) -> ptr`, `free(ptr, len)`, over JSON `{ ok } | { err }`.
wasm = []

[dependencies]
# The script is parsed, never run: no eval, no time, no modules.
rhai = { version = "1.26", default-features = false, features = ["std", "no_time", "no_module", "no_custom_syntax", "internals"] }
serde = { version = "1", features = ["derive"] }
# The tree's keys are sorted by the compiler itself (BTreeMap), never by
# serde_json's Map — a workspace build may unify `preserve_order` on.
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
# tests/wasm.rs and tests/golden.rs run the module the way push will: no
# WASI, no imports, under fuel.
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std", "anyhow"] }
