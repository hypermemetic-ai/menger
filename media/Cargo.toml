# V2-24: menger's media service — the images a ticket's body shows, kept by
# their sha256 in a file of their own (`media.db`), as a service of v2's own
# beside `tickets` and `ui` (V2-1: services that coexist, each reaching the
# others as a client through the seam). The ticket's editor permit is asked
# of the tickets service through plexus-core's `HubTransport::as_(service,
# caller)` — never read from its store. v1's `media` activation (tag v0.0.1,
# tickets-api/src/media_activation.rs there) is its ancestor: the same two
# methods, the same events.
[package]
name = "menger-media"
version = "0.6.2"
edition = "2021"
license = "MIT"
description = "menger's media service — images for tickets, kept by sha256 in a file of their own, the ticket's permit asked of the tickets service through the client seam"
repository = "https://github.com/hypermemetic-ai/menger"

[dependencies]
# The tickets service's client and vocabulary: `TicketsClient::may` is the
# permit question, `TicketRef` names the ticket, `Role` the role asked.
menger-tickets-api = { path = "../tickets-api", version = "0.6.2" }
# V2-29: the docs service's client — `docs.may` is the permit question for an
# image put for a document, asked through the seam as the caller.
menger-docs = { path = "../docs", version = "0.6.2" }
# The 0.7 line, by published version (PLEXUS-16), as the server takes it.
plexus-core = "0.7.0"
plexus-macros = "0.7.0"
plexus-client = { version = "0.7.0", default-features = false }
# The gate's types: where a caller holds a grant (`held_on`).
plexus-auth-core = "0.2.2"
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
# What the activation macro's server half emits paths into.
uuid = { version = "1.6", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
# EDITOR-10: links read by the server (unfurl, fetch) — every SSRF rule in
# `remote.rs`, the connection pinned to the addresses checked.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
# An image is named by its SHA-256 and travels as base64.
sha2 = "0.10"
base64 = "0.22"
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
