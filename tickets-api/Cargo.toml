# menger's tickets activation, once, for both halves of menger (MFE-9, MFE-11).
#
# One crate, two builds:
#
#   menger (server)     default features (`server`) -> types + store + the
#                       activation (Activation impl, dispatch, schema, real
#                       bodies) + the generated client
#   menger-app (wasm)   default-features = false    -> types + the generated
#                       `TicketsClient<T>`, and nothing that will not build
#                       for wasm32 (no plexus-core, tokio, jsonrpsee, rusqlite)
#
# `plexus-macros` and `plexus-client` are NOT optional: a proc-macro crate is
# compiled for the host, so the macro can run — and emit the client — in a
# build with no server dependencies at all, and the client links against
# plexus-client (four wasm-safe deps). Everything server-only is optional
# behind `server`, and the activation's `server_cfg` gates the macro's server
# half on the same predicate.
[package]
name = "menger-tickets-api"
# SCAFFOLD-9: 0.6 — `SessionCheck::key` (the session table names its own
# metadata key) replaced `access::SESSION_KEY`.
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "menger's ticket vocabulary, activation and Plexus RPC client — one declaration, shared by the server and the browser"
repository = "https://github.com/hypermemetic-ai/menger"
# DIST-3: published, so a host can take menger from crates.io as a library.
# The package is this crate's own sources: the wave3 example (below) lives
# in ../spike, outside the crate, and cargo leaves it out of the package
# (a target whose file is not packaged is dropped from the published
# manifest) — in a checkout it builds as before.

[features]
default = ["server"]
# The server half: the store (rusqlite behind the service-wide cache) and
# the activation's real bodies. The menger binary is the only consumer that
# enables it; the browser app turns it off.
server = [
    "dep:plexus-core",
    "dep:plexus-auth-core",
    "dep:async-trait",
    "dep:jsonrpsee",
    "dep:tokio",
    "dep:uuid",
    "dep:serde_json",
    "dep:async-stream",
    "dep:rusqlite",
    "dep:chrono",
    "dep:anyhow",
    "dep:tracing",
    "dep:roaring",
]
# WAVE-3, measurement only: a build of the store without WAVE-6's
# re-placement pass and its startup placement — the "without" half of the
# spike's comparison (spike/WAVE-2/). Never enabled by anything that serves.
wave3-no-replace = []

# WAVE-3: the spike's program (spike/WAVE-2/) — an example, so it builds
# against the store as it is; `spike/WAVE-2/run.sh` runs it.
[[example]]
name = "wave3"
path = "../spike/WAVE-2/wave3.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
schemars = { version = "1.1", features = ["derive"] }
futures = "0.3"

# The 0.6 line, by sibling path (MFE-10; the same checkouts the server
# uses) and, DIST-3, by version too: a checkout builds the siblings, the
# published crate takes the line from crates.io. `plexus-client` is
# `default-features = false` here — the browser app adds the `ws-web`
# backend itself, the server's tests `ws-native`.
plexus-macros = { path = "../../plexus-macros", version = "0.6.0" }
plexus-client = { path = "../../plexus-macros/plexus-client", version = "0.6.0", default-features = false }
# COMP-3: the component registry reads a body as the app renders it — the
# app's own markdown parser (frontend/src/md.rs, MFE-7), so a fence, a code
# span and raw HTML are what the renderer will say they are. Already in the
# lock (`diagrams` takes it the same way); no renderer, no default features.
# ART-5: not server-only — `fields` (a body's fields, read the same way) is
# wasm-safe, like `component_docs`, and pulldown-cmark builds for wasm32 (the
# app renders with it).
pulldown-cmark = { version = "0.13", default-features = false }

# Server-only. None of these builds for wasm32-unknown-unknown.
plexus-core = { path = "../../plexus-core", version = "0.6", optional = true }
# IDENTITY-21: a grant names a Plexus principal, checked as the identity
# layer parses one. Server-only, like plexus-core.
plexus-auth-core = { path = "../../plexus-auth-core", version = "0.2", optional = true }
async-trait = { version = "0.1", optional = true }
jsonrpsee = { version = "0.26", features = ["server", "macros"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
uuid = { version = "1.6", features = ["v4", "serde"], optional = true }
serde_json = { version = "1", optional = true }
async-stream = { version = "0.3", optional = true }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
chrono = { version = "0.4", optional = true }
anyhow = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
# FILTER-4: the cells' bitmaps (FILTER-3 §6.1) — pure Rust, and the server's
# only: the wasm build (default-features = false) never pulls it in.
roaring = { version = "0.10", optional = true }

[dev-dependencies]
# The wire-casing tests assert what serde writes; the store's tests open
# throwaway database files.
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
