# TETHER-7: menger tether — a Plexus RPC tool of its own (`synapse tether …`)
# with substrate imported as a crate and called in memory (LOCAL-6's
# HubTransport). Its own workspace, out of menger's: menger's rusqlite 0.37
# pulls libsqlite3-sys 0.35 and substrate's sqlx 0.8 pulls libsqlite3-sys
# 0.30, both `links = "sqlite3"`, and one resolve refuses two (TETHER-7).
[workspace]

[package]
name = "menger-tether"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "menger tether: the local side of menger — agent sessions through an imported substrate, over Plexus RPC"
publish = false

[lib]
name = "tether"
path = "src/lib.rs"

[[bin]]
name = "tether"
path = "src/main.rs"

[dependencies]
# substrate, imported: its service is built inside tether and called over the
# in-memory service transport. PLEXUS-33: from its public repository, and
# tether does not build until that `main` takes the plexus 0.7 line (README,
# "Its own workspace"). The rest of the line from crates.io.
plexus-substrate = { git = "https://github.com/hypermemetic-ai/plexus-substrate", branch = "main", default-features = false }
plexus-core = "0.7.0"
plexus-macros = "0.7.0"
# TETHER-9: the remote menger is reached as a client — WsTransport over a
# native socket, signed in with a key proof on the upgrade (as synapse does).
plexus-client = { version = "0.7.0", features = ["ws-native"] }
# wss:// to a remote behind TLS (app.menger.sh): the socket plexus-client's
# ws-native opens, with rustls and the webpki roots.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# menger's vocabulary and its emitted clients (TicketsClient, CommentsClient,
# ChatsClient) — the client half, no store, no rusqlite (TETHER-7's finding).
menger-tickets-api = { path = "../tickets-api", default-features = false }
plexus-transport = "0.6.0"
plexus-auth-core = { version = "0.2.2", features = ["adapters"] }
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# plexus-login from this repository. Two sources of one crate are two crates
# to cargo: when substrate takes the 0.7 line, this names the plexus-login it names.
plexus-login = { path = "../plexus-login", version = "0.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.1", features = ["derive", "uuid1"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# What #[plexus_macros::activation]'s expansion names.
async-trait = "0.1"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
async-stream = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.6", features = ["v4"] }
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"
jsonrpsee = { version = "0.26", features = ["client", "ws-client", "server", "macros"] }
rqrr = { version = "0.11", default-features = false }
