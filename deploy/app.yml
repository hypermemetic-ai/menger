# menger — what hypermemetic-infra's Plexus app role needs to run it behind
# the Linode's edge (RUN-11; plexus-starter's layer host contract,
# SCAFFOLD-12/-19). A description, not a procedure: infra reads it and does
# the deploying — `bin/infra app.yml -e app_dir=<menger> -e env=test -e
# sha=<release>`, or `deploy/pipeline remote test --image …` (RUN-25); prod
# only through `bin/infra promote.yml` (`deploy/pipeline remote prod`).
# Nothing here is a secret. deploy/README.md "On the Linode" has the rest.
app: menger

image:
  name: ghcr.io/hypermemetic-ai/menger
  # deploy/pipeline image (RUN-10) builds a TESTED release's own bytes and,
  # with IMAGE_STORE=ghcr, pushes :<release> (+ :latest). The tag infra
  # deploys (its `-e sha=`) is the release's name, e.g.
  # 20261017T081530Z-5773250 — never a build from a checkout.
  tag: release
  user: menger         # uid 10001, non-root (deploy/image/Dockerfile)
  stop_signal: SIGTERM # tini hands it to menger, which stops at once

# Two environments. test runs a release first; prod is promoted to exactly
# the image (same image id) test ran and passed the health checks on.
# app.menger.sh: AuthKit on WorkOS production (RUN-11), prod's data moved
# there (RUN-13).
environments:
  prod:
    host: app.menger.sh
    env_file: deploy/env/app-prod.env
  test:
    host: app-test.menger.sh
    env_file: deploy/env/app-test.env
# Secrets never enter the repository: each environment may have a secret env
# file kept on the box only, read after env_file. AuthKit (RUN-11's
# `sign-in`, recommended) needs none.
secret_env_file: secret.env

# IDENTITY-45: secret files the box holds, placed by infra's secret.yml from a
# pipe (`deploy/pipeline remote-secret test|prod`), never from here. infra
# mounts /opt/apps/<project>/secrets read-only at `mount` (0500, owned by
# `owner`, the image's uid) and, for each file the box holds, sets `env` to
# its path inside. The WorkOS key makes the GitHub button complete through
# WorkOS's API on menger's own page (email verification, Radar); a box
# without it runs the PKCE path, unchanged.
secrets:
  mount: /run/secrets
  owner: 10001
  files:
    - name: workos-api-key
      env: MENGER_WORKOS_API_KEY_FILE

# Inside the container (published on no host port; the edge reaches it as
# menger-<env> on its `edge` network). The image sets MENGER_BIND=0.0.0.0,
# these ports, MENGER_NO_REST=1 and MENGER_DB_PATH=/data/tickets.db.
ports:
  websocket: 8080
  shell: 8081

# The edge's site for each host, first match wins: the page dials
# wss://<host>/ws (ACCESS-30); RFC 9728's document is the shell's (RUN-9).
routes:
  - match: { path: /ws }
    to: websocket
  - match: { header: { Upgrade: websocket } }   # an upgrade at any other path (a client that dials /)
    to: websocket
  - match: default
    to: shell
    encode: [zstd, gzip]

# The database: one volume per environment, each its own tracker.
data:
  mount: /data
  per_environment: true

# UI-15: one component store for both environments — the ui service's file
# (MENGER_UI_DB_PATH=/shared/ui.db in each deploy/env/app-*.env) on one
# volume every environment's container mounts read-write: infra's Docker
# volume <app>-shared (menger-shared), its directory owned by the image's
# uid; promote.yml and rollback.yml keep it. Each environment serves its own
# live pointer in it (MENGER_UI_CHANNEL: test, prod); a release to prod is
# `ui promote --to prod --from test`, no second push.
shared:
  mount: /shared
  owner: 10001

# RUN-13: prod's data (local prod peaks near 600 MB with ~975 tickets) on a
# 3.9 GB box holding both environments; a limit, not a reservation.
resources:
  memory: 1g

# Healthy means all of these, over https through the edge (infra's probe:
# one GET, redirects not followed, or one WebSocket upgrade).
health:
  - get: http://{host}/
    status: 308
    header: location
    header_contains: https://{host}/
  - get: https://{host}/
    status: 303
    header: location
    header_contains: /login
  - get: https://{host}/
    status: 303
    header: strict-transport-security
    header_contains: max-age=31536000
  - get: https://{host}/login
    status: 200
    title_contains: Sign in
    header: strict-transport-security
    header_contains: max-age=31536000
  - websocket_upgrade: wss://{host}/ws
    origin: https://{host}
    status: 101
  - websocket_upgrade: wss://{host}/ws
    origin: https://evil.example
    status: 403
