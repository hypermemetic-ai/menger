  #tmenu .sub { border-top-color: var(--line); }
  .fmenu .fhead {
    font-family: var(--mono); font-size: calc(10px * var(--text-scale)); font-weight: var(--weight-medium);
    letter-spacing: .12em; padding: 5px 9px 3px;
  }
  .fmenu .fpane { padding: 5px; }
  .fmenu .fmain { background: var(--panel); }
  .fmenu .fsub { border-left-color: var(--line); }
  .fmenu input.fsearch { background: var(--card); }
  .fmenu .box { border-color: var(--tree-line); background: var(--card); }
  .fmenu .box[data-state="on"], .fmenu .box[data-state="mixed"] { background: var(--accent); border-color: var(--accent); }
  .fmenu .frow .tag, #tmenu .sub .st, #tmenu .flat .st, #tmenu .h .tag, #tagmenu .h .tag, #tmenu .pick .tag { border-radius: var(--radius-sm); }
  /* Dialogs: the overlay's scrim, then a card — 8px corners, the deep
     shadow; the title in the display face; the buttons on a panel foot. */
  .overlay { background: var(--scrim); }
  .dialog { background: var(--card); border-color: var(--tree-line); box-shadow: 0 18px 50px var(--shadow); }
  #delete, #save-as, #leave { padding: 22px 26px 0; gap: 10px; font-family: var(--sans); }
  #delete h2, #save-as h2, #leave h2 {
    font-family: var(--font-display); font-size: calc(21px * var(--text-scale)); font-weight: var(--weight-strong);
    letter-spacing: -.015em; line-height: 1.25;
  }
  #delete p, #save-as p, #leave p { color: var(--muted); font-size: calc(13.5px * var(--text-scale)); }
  #delete .sacts, #save-as .sacts, #leave .sacts {
    justify-content: flex-start; margin: 8px -26px 0; padding: 12px 26px;
    border-top: var(--border) solid var(--line); background: var(--panel);
  }
  /* The button: mono, upper case, an ink hairline; the one that acts filled. */
  #delete .sacts button, #save-as .sacts button, #leave .sacts button, #toast button, #ftoast button {
    font-family: var(--mono); font-size: calc(11px * var(--text-scale)); letter-spacing: .08em; text-transform: uppercase;
    padding: 6px 12px; background: transparent; color: var(--ink); border: var(--border) solid var(--ink); border-radius: var(--radius);
    transition: transform var(--motion-fast) var(--ease);
  }
  #delete .sacts button:hover, #save-as .sacts button:hover, #leave .sacts button:hover { transform: translateY(-1px); color: var(--ink); border-color: var(--ink); }
  #save-as .sacts button.primary, #leave .sacts button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  #save-as .sacts button.primary:hover, #leave .sacts button.primary:hover { color: var(--bg); border-color: var(--accent); }
  #delete .sacts button.danger, #delete .sacts button.danger:hover { background: var(--err-fg); border-color: var(--err-fg); color: var(--bg); }
  #save-as .sname input, #save-as .sname input:focus { background: var(--bg); border-color: var(--tree-line); border-radius: var(--radius-md); }
  #save-as .sname input:focus { border-color: var(--accent); }
  #save-as .sname { font-family: var(--mono); font-size: calc(10px * var(--text-scale)); letter-spacing: .12em; text-transform: uppercase; }
  #save-as .sname input { text-transform: none; letter-spacing: 0; font-family: var(--sans); font-size: calc(13.5px * var(--text-scale)); }
  /* Toasts: ink, the page's colour for their words, its buttons ruled in it. */
  #toast, #ftoast {
    background: var(--ink); color: var(--bg); border: 0; border-radius: var(--radius-lg);
    box-shadow: 0 18px 50px var(--shadow); padding: 12px 10px 12px 16px; align-items: center; gap: 12px;
    font-family: var(--sans); font-size: calc(14px * var(--text-scale));
  }
  #toast.manual { box-shadow: inset 4px 0 var(--err-fg), 0 18px 50px var(--shadow); }
  #toast .code, #ftoast .code { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
  #toast button, #ftoast button {
    color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); padding: 5px 10px; font-weight: var(--weight-strong);
  }
  #toast button:hover, #ftoast button:hover { background: var(--bg); color: var(--ink); border-color: var(--bg); }
  @keyframes menger-toast-in { from { transform: translateY(140%); opacity: 0; } }
  #toast, #ftoast { animation: menger-toast-in .5s cubic-bezier(.2, .9, .25, 1.15) both; }
  /* At a phone's width the nav sits over the content, not beside it: the
     tree a band under its bar, the page below, both scrolling in their own
     box (the nav hides as ever with ‹). */
  /* The board in a narrow column: the id, the title and the status — the
     kind, severity and blockers are the ticket's page's (and the nav's
     glyph says the kind). */
  @container (max-width: 40rem) {
    table.board :is(th.c-kind, th.c-sev, th.c-blk) { display: none; }
    tbody#board tr[data-ticket-id] td:is(:nth-child(3), :nth-child(5), :nth-child(6)) { display: none; }
    table.board th.c-id { width: 7.5rem; }
    table.board th.c-status { width: calc(86px * var(--text-scale) + 24px); }
    tbody#board td, table.board th { padding-left: 10px; padding-right: 10px; }
  }
  @media (max-width: 640px) {
    #app:not(.nonav) { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 38vh) minmax(0, 1fr); }
    #app:not(.nonav) #nav { height: 38vh; grid-row: 1; border-right: 0; border-bottom: var(--border) solid var(--tree-line); }
    #app:not(.nonav) .content, #app:not(.nonav) #qtray { grid-row: 2; height: auto; }
    header { padding: 8px 16px; gap: 4px 14px; }
    main { padding: calc(14px * var(--space)) calc(16px * var(--space)) calc(32px * var(--space)); }
  }
  /* ── DESIGN-39: the chrome in motion (DESIGN-35's moves, as DESIGN-34's
     first screen plays them; src/motion.rs). How much moves is the Motion
     setting, stamped on <html> as data-motion="full|calm|none" (absent:
     full) — the contract the house components key on too. ── */
  /* The boot: a sheet over the app as the socket connects — the carpet's
     cells light in the lifecycle's colours while the count runs up, then the
     sheet wipes upward and is removed. Never in the way of a click. */
  #boot {
    position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center;
    background: var(--bg); pointer-events: none;
  }
  #boot .boot-in { display: grid; justify-items: center; gap: 18px; }
  #boot .carpet.boot-mark { width: 54px; height: 54px; }
  #boot .boot-mark rect { transition: fill .18s var(--ease); }
  #boot .boot-mark rect:not(.on) { fill: var(--line); }
  #boot .boot-count {
    margin: 0; font-family: var(--mono); font-size: calc(12px * var(--text-scale));
    letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  #boot .boot-count b { color: var(--ink); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }
  #boot.done { animation: menger-wipe .6s cubic-bezier(.7, 0, .2, 1) forwards; }
  @keyframes menger-wipe { to { clip-path: inset(0 0 100% 0); } }
  /* Counters keep their width while they run. */
  .count-up { font-variant-numeric: tabular-nums; }
  /* A change: the status cell sweeps (a translucent bar of its own colour
     across it), the row flashes from the selection tint back to its own. */
  #nav .tag.swap { position: relative; overflow: hidden; }
  #nav .tag.swap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: currentColor; opacity: .3; transform: translateX(-100%);
    animation: menger-sweep .6s ease-out;
  }
  @keyframes menger-sweep { to { transform: translateX(100%); } }
  /* The board's cell is a <select>, which draws no ::after: the same bar
     is a background layer swept across it. */
  tbody#board .status.swap {
    background-image: linear-gradient(90deg, transparent, color-mix(in srgb, currentColor 32%, transparent) 35% 65%, transparent);
    background-size: 60% 100%; background-repeat: no-repeat;
    animation: menger-sweep-bg .6s ease-out;
  }
  @keyframes menger-sweep-bg { from { background-position: -150% 0; } to { background-position: 250% 0; } }
  tbody#board tr.flash td, #nav .row.flash { animation: menger-flash 1.6s ease-out; }
  @keyframes menger-flash { from { background-color: var(--row-sel); } }
  /* A header count that moves ticks. */
  header .hlink .hbadge.tick { display: inline-block; animation: menger-tick .5s cubic-bezier(.2, .8, .2, 1); }
  @keyframes menger-tick { 30% { transform: translateY(-4px) scale(1.15); } }
  /* A ticket opening: the id comes from its row (a FLIP, inline from
     motion.rs), the title rises out of its line, the body develops. */
  #ticket-page article.ticket.opening > h2 .t { animation: menger-rise .5s cubic-bezier(.2, .8, .2, 1) backwards; }
  @keyframes menger-rise { from { transform: translateY(110%); clip-path: inset(0 0 100% 0); } to { transform: none; clip-path: inset(0 0 0 0); } }
  #ticket-page article.ticket.opening > .mscope-frame { animation: menger-develop .5s ease-out .08s backwards; }
  @keyframes menger-develop { from { filter: blur(8px); opacity: 0; } to { filter: none; opacity: 1; } }
  /* The pip: its cells the lifecycle's mix among what the nav shows. */
  #nav .carpet.pip rect { transition: fill .6s var(--ease); }
  .carpet rect.s-pending { fill: var(--st-pending-fg); }
  .carpet rect.s-ready { fill: var(--st-ready-fg); }
  .carpet rect.s-coding { fill: var(--st-coding-fg); }
  .carpet rect.s-in-review { fill: var(--st-in-review-fg); }
  .carpet rect.s-complete { fill: var(--st-complete-fg); }
  /* Settings → Motion: one choice a line, its name then what it does. */
  #settings-motion .motion-choices { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  #settings-motion label.radio { display: flex; align-items: baseline; gap: 8px; width: auto; font-weight: normal; }
  #settings-motion label.radio b { min-width: 4.5em; font-family: var(--mono); font-weight: var(--weight-medium); }
  /* DESIGN-43: Typed text, under Motion's choices, ruled off from them. */
  #settings-motion .typing { margin-top: 14px; padding-top: 12px; border-top: var(--border) solid var(--line); }
  /* ── MENGER-39: the tray — the owner's queue as tabs along the main
     column's bottom edge (MENGER-40, variant C; src/queue.rs). A grid item
     over the content's cell, so it spans the main column whether or not the
     nav shows; only its tabs and its sheet take the pointer. ── */
  #qtray {
    grid-column: -2 / -1; grid-row: 1; align-self: end; z-index: 900; min-width: 0;
    display: flex; flex-direction: column; margin-right: 14px; position: relative;
    padding: 0 calc(20px * var(--space)); pointer-events: none;
  }
  #qtray.empty { display: none; }
  #app .content { grid-row: 1; grid-column: -2 / -1; }
  #app:has(#qtray:not(.empty)) .content { padding-bottom: 56px; }
  #qtray .qtabs, #qtray .qsheet { pointer-events: auto; }
  #qtray .qtabs {
    display: flex; gap: 3px; align-items: flex-end; padding-top: 10px;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  }
  #qtray .qtab {
    background: var(--panel); color: var(--ink); font-family: var(--mono); font-size: calc(11.5px * var(--text-scale));
    border: var(--border) solid var(--tree-line); border-bottom: 0; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 7px 12px 8px; display: flex; align-items: center; gap: 8px; flex: 0 1 auto; min-width: 0; max-width: 290px;
    cursor: pointer; box-shadow: 0 -2px 6px var(--shadow);
    animation: menger-tab-in .45s cubic-bezier(.2, .9, .25, 1.2) both;
    transition: transform .2s var(--ease), background-color var(--motion-fast) var(--ease);
  }
  #qtray .qtab:hover { transform: translateY(-3px); }
  #qtray .qtab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #qtray .qtab .id { color: var(--accent); font-weight: var(--weight-medium); white-space: nowrap; }
  #qtray .qtab .t {
    font-family: var(--sans); font-size: calc(12.5px * var(--text-scale));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  #qtray .qtab .u {
    font-size: calc(9.5px * var(--text-scale)); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap;
    padding: 1px 5px; border-radius: var(--radius-sm); background: var(--st-doc-bg); color: var(--st-doc-fg);
  }
  #qtray .qtab.today .u { background: var(--st-coding-bg); color: var(--st-coding-fg); }
  /* Now and blocking: taller, red, and nudging until opened. */
  #qtray .qtab.loud {
    background: var(--urgent-bg); border-color: var(--urgent); padding-bottom: 12px;
    animation: menger-tab-in .45s cubic-bezier(.2, .9, .25, 1.2) both, menger-nudge 4s ease-in-out 1s infinite;
  }
  #qtray .qtab.loud.seen { animation: menger-tab-in .45s cubic-bezier(.2, .9, .25, 1.2) both; }
  #qtray .qtab.loud .u { background: var(--urgent); color: var(--urgent-ink); }
  #qtray .qtab.open { background: var(--card); }
  @keyframes menger-tab-in { from { transform: translateY(100%); } }
  @keyframes menger-nudge {
    0%, 86%, 100% { transform: none; }
    89% { transform: translateY(-5px) rotate(-1.2deg); }
    93% { transform: translateY(-5px) rotate(1.2deg); }
    96% { transform: translateY(-2px); }
  }
  /* MENGER-45: an arrival (MENGER-40's C′). A tab that shows up while the
     page is visible blinks in its urgency's colour (--flash) — whenever
     once, today three times, now and blocking four times faster and then
     nudges — a line sweeps the tray's bottom edge, a label fades in and out
     above the tabs, and a dot stays before its id until it is opened. */
  #qtray .qtab, #qtray .qedge { --flash: var(--st-doc-fg); }
  #qtray .qtab.today, #qtray .qedge.today { --flash: var(--st-coding-fg); }
  #qtray .qtab.loud, #qtray .qedge.now, #qtray .qedge.blocking { --flash: var(--urgent); }
  #qtray .qtab.fresh { animation: menger-tab-in .45s cubic-bezier(.2, .9, .25, 1.2) both, menger-arrive .7s ease-in-out .5s 1; }
  #qtray .qtab.fresh.today { animation: menger-tab-in .45s cubic-bezier(.2, .9, .25, 1.2) both, menger-arrive .6s ease-in-out .5s 3; }
  #qtray .qtab.fresh.loud {
    animation: menger-tab-in .45s cubic-bezier(.2, .9, .25, 1.2) both, menger-arrive .42s ease-in-out .5s 4,
      menger-nudge 4s ease-in-out 2.4s infinite;
  }
  #qtray .qtab.fresh.loud.seen { animation: menger-tab-in .45s cubic-bezier(.2, .9, .25, 1.2) both, menger-arrive .42s ease-in-out .5s 4; }
  @keyframes menger-arrive {
    50% {
      background: color-mix(in srgb, var(--flash) 32%, var(--panel)); border-color: var(--flash);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--flash) 28%, transparent), 0 -8px 26px color-mix(in srgb, var(--flash) 40%, transparent);
      transform: translateY(-4px);
    }
  }
  #qtray .qtab.unseen .id::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--flash); margin-right: 6px; vertical-align: 1px;
  }
  #qtray .qedge {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px; z-index: 1; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--flash)); transform-origin: left; transform: scaleX(0);
    animation: menger-edge 1s cubic-bezier(.4, 0, .2, 1) forwards;
  }
  @keyframes menger-edge { 55% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
  #qtray .qarrived {
    position: absolute; left: calc(20px * var(--space)); bottom: 54px; z-index: 1; pointer-events: none;
    font-family: var(--mono); font-size: calc(10.5px * var(--text-scale)); font-weight: var(--weight-medium); letter-spacing: .08em;
    color: var(--muted); background: var(--card); border: var(--border) solid var(--tree-line); border-radius: var(--radius-sm);
    padding: 4px 8px; white-space: nowrap; opacity: 0; animation: menger-hint 3.2s ease .3s forwards;
  }
  @keyframes menger-hint { 10%, 80% { opacity: 1; } 100% { opacity: 0; } }
  /* The sheet: raised above the tabs by the open one; as tall as it says. */
  #qtray .qsheet {
    display: grid; grid-template-rows: 0fr; background: var(--card);
    border: var(--border) solid transparent; border-bottom: 0; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    transition: grid-template-rows .4s cubic-bezier(.7, 0, .2, 1);
  }
  #qtray .qsheet.open { grid-template-rows: 1fr; border-color: var(--tree-line); box-shadow: 0 -12px 40px var(--shadow); }
  #qtray .qsheet.open.loud { border-color: var(--urgent); }
  #qtray .qsheet-clip { overflow: hidden; min-height: 0; }
  #qtray .qsheet-in { padding: 18px 22px; max-height: 60vh; overflow: auto; font-family: var(--sans); }
  #qtray .qhd {
    font-family: var(--mono); font-weight: var(--weight-medium); font-size: calc(10.5px * var(--text-scale));
    letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  #qtray .qhd.now, #qtray .qhd.blocking { color: var(--urgent); }
  #qtray .qhd.today { color: var(--st-coding-fg); }
  #qtray .qsheet h4 { font-size: calc(18px * var(--text-scale)); font-weight: var(--weight-strong); margin: 6px 0; }
  #qtray .qsheet h4 .code { font-family: var(--mono); font-weight: var(--weight-medium); color: var(--accent); background: transparent; border: 0; padding: 0; }
  #qtray .qwhy { color: var(--muted); margin: 0 0 12px; max-width: 760px; }
  #qtray .qq { margin: 0 0 10px; }
  #qtray .qq.muted { color: var(--muted); }
  #qtray .qopts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 260px)); gap: 10px; margin: 0 0 14px; }
  #qtray .qopt {
    position: relative; display: flex; align-items: center; gap: 10px; text-align: left;
    font-family: var(--sans); font-size: calc(13.5px * var(--text-scale)); font-weight: var(--weight-strong);
    padding: 12px 14px; border: var(--border) solid var(--tree-line); border-radius: var(--radius-lg);
    background: var(--card); color: var(--ink); cursor: pointer;
    transition: transform .2s var(--ease), border-color .2s var(--ease);
  }
  #qtray .qopt:hover { transform: translateY(-2px); border-color: var(--accent); }
  #qtray .qopt.rec { background: var(--sel); border-color: var(--accent); }
  #qtray .qopt .r { width: 12px; height: 12px; flex: none; border: var(--border) solid var(--ink); border-radius: var(--radius-pill); }
  #qtray .qopt.rec .r { border-color: var(--accent); }
  /* APP-25: an option is picked, then submitted — the pick is ringed and its
     dot filled (recommended keeps its tint and its label); submit sends it. */
  #qtray .qopt.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  #qtray .qopt.sel .r { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--card); }
  #qtray .qsubmit { margin: -4px 0 14px; }
  #qtray .qopt .rl {
    position: absolute; top: -1px; right: -1px; padding: 2px 7px; border-radius: 0 var(--radius-lg) 0 var(--radius);
    font-family: var(--mono); font-weight: var(--weight-normal); font-size: calc(10px * var(--text-scale));
    letter-spacing: .12em; text-transform: uppercase; background: var(--accent); color: var(--bg);
  }
  #qtray .qopts.multi, #qtray .qopts.text { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  #qtray .qopts.text textarea { flex: 1 1 320px; min-height: 3em; min-height: calc(2lh + 4px + 2 * var(--border)); font-family: var(--sans); }
  #qtray .qtick { display: inline-flex; align-items: center; gap: 6px; }
  #qtray .qdone { color: var(--live); margin: 0 0 12px; }
  #qtray .qacts { display: flex; flex-wrap: wrap; gap: 8px; }
  #qtray .qbtn {
    font-family: var(--mono); font-size: calc(11px * var(--text-scale)); letter-spacing: .08em; text-transform: uppercase;
    padding: 7px 12px; border: var(--border) solid var(--ink); border-radius: var(--radius);
    background: transparent; color: var(--ink); cursor: pointer; text-decoration: none;
    transition: transform var(--motion-fast) var(--ease);
  }
  #qtray .qbtn:hover { transform: translateY(-1px); }
  #qtray .qbtn.fill { background: var(--ink); color: var(--bg); }
  #qtray .qbtn:disabled { opacity: .5; cursor: default; }
  /* APP-23: Request changes — the button beside the answer, then its box. */
  #qtray .qchange { margin: 0 0 14px; }
  #qtray .qchange.open { display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
  #qtray .qchange textarea {
    font: inherit; font-family: var(--sans); color: var(--ink); background: var(--bg); min-height: 4.2em; resize: vertical;
    min-height: calc(3lh + 16px + 2 * var(--border));
    border: var(--border) solid var(--tree-line); border-radius: var(--radius); padding: 8px 10px;
  }
  #qtray .qchange textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #qtray .qchange-acts { display: flex; gap: 8px; }
  #qtray .qproblem { color: var(--err-fg); margin: 10px 0 0; }
  /* APP-25: the question on hover — a card above the hovered tab (placed by
     src/queue.rs: --x from the tab, kept inside the tray), never taking the
     pointer; it fades in, and Motion none (the rule below) keeps it still. */
  #qtray .qcard {
    position: absolute; z-index: 2; pointer-events: none;
    left: clamp(0px, var(--x, 0px), calc(100% - min(400px, 100%))); width: min(400px, 100%);
    background: var(--card); color: var(--ink); border: var(--border) solid var(--tree-line); border-radius: var(--radius-lg);
    box-shadow: 0 -8px 28px var(--shadow); padding: 10px 14px; font-family: var(--sans);
    animation: menger-card-in var(--motion-fast) var(--ease) both;
  }
  #qtray .qcard.now, #qtray .qcard.blocking { border-color: var(--urgent); }
  #qtray .qcard .qcq { margin: 4px 0 0; font-size: calc(13.5px * var(--text-scale)); line-height: 1.4; overflow-wrap: anywhere; }
  @keyframes menger-card-in { from { opacity: 0; transform: translateY(4px); } }
  /* Motion: calm keeps the slide and drops the nudge (none stops both,

  html[data-motion="calm"] #qtray .qtab.loud { animation: menger-tab-in .45s cubic-bezier(.2, .9, .25, 1.2) both; }
  /* MENGER-45: calm keeps an arrival's blinks and drops the edge's sweep

     colour until it is opened, and keeps its dot. */
  html[data-motion="calm"] #qtray .qtab.fresh.loud { animation: menger-tab-in .45s cubic-bezier(.2, .9, .25, 1.2) both, menger-arrive .42s ease-in-out .5s 4; }
  html[data-motion="calm"] #qtray .qedge { display: none; }

  /* Motion: none — nothing the app animates moves; calm — the state
     changes stay, the ambient moves (the breathe, the pulse) go (the boot
     and the counters are the script's to skip). */
  html[data-motion="none"] *, html[data-motion="none"] *::before, html[data-motion="none"] *::after {
    animation: none !important; transition: none !important;
  }
  html[data-motion="none"] #boot { display: none; }
  html[data-motion="calm"] :is(#conn.live .cell, #nav .carpet.pip) { animation: none; }
  /* Before the script has stamped the setting, the system's preference. */
  @media (prefers-reduced-motion: reduce) {
    html:not([data-motion]) :is(#conn.live .cell, #nav .carpet.pip) { animation: none; }
    html:not([data-motion]) :is(tbody#board td, #nav .row) { transition: none; }
    html:not([data-motion]) #qtray .qtab.loud { animation: none; }
    html:not([data-motion]) section.convsec li.cpost.fresh { animation: none; }
    html:not([data-motion]) #qtray .qtab.fresh { animation: none; }
    html:not([data-motion]) #qtray .qtab.fresh.unseen { outline: 2px solid var(--flash); outline-offset: -2px; }
    html:not([data-motion]) #qtray :is(.qedge, .qarrived) { display: none; }
    html:not([data-motion]) #qtray .qcard { animation: none; }
  }
