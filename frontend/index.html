<!-- MFE-9: the app's data plane is the Plexus WebSocket, not the REST
     bridge, and a page served from disk cannot know which port that is.
     menger's shell substitutes the placeholder when it serves this file
     (src/shell.rs), the same way it always has for web/index.html; served
     by anything else, the app falls back to menger's default WS port. -->
<meta name="menger-ws-port" content="{{WS_PORT}}">
<link data-trunk rel="rust" />
<!-- AGS-14: the vendored mermaid bundle rides into dist/vendor/ as a served
     file only. Deliberately NOT a <script> here: src/mermaid.rs injects one
     the first time a rendered body holds a mermaid fence. -->
<link data-trunk rel="copy-file" href="vendor/mermaid/mermaid-11.17.2.min.js" data-target-path="vendor" />
<!-- MENGER-22: the vendored highlighter, the same way: a served file only;
     src/highlight.rs injects a <script> the first time a page holds code. -->
<link data-trunk rel="copy-file" href="vendor/highlight/highlight-11.11.1.min.js" data-target-path="vendor" />
<!-- COMP-4: the SDK shell a framed body runs (src/frame.rs inlines it into
     each frame's srcdoc); served at /app/sdk/ as the app's published copy. -->
<link data-trunk rel="copy-file" href="sdk/menger-sdk.js" data-target-path="sdk" />
<!-- COMP-10: the SDK's types — menger.d.ts and the declarations of the client
     generated into sdk/generated/ (scripts/sdk-codegen.sh), which it imports —
     published beside it for whoever writes a component. -->
<link data-trunk rel="copy-file" href="sdk/menger.d.ts" data-target-path="sdk" />
<link data-trunk rel="copy-dir" href="sdk/generated" data-target-path="sdk/generated" />

     100–900; fonts/OFL.txt), self-hosted at /app/fonts/ — the token
     contract's face defaults name them; nothing is fetched from elsewhere. -->

<!-- AGS-17: stamp a stored theme choice before first paint, so a reload
     never flashes the system theme; src/theme.rs owns the key and
     re-applies it once mounted (a native test pins the two agree). -->
<script>try{var t=localStorage.getItem("menger.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}try{var s=localStorage.getItem("menger.themes.site");if(s)document.documentElement.style.cssText=s}catch(e){}</script>

  /* DESIGN-38: the faces the contract's defaults name (--mono, --font-text:

  /* The status table (pinned, AGS-15): a chip wears its status as colour —
     its pair from the contract's colour.status (`--st-<status>-bg/-fg`), so
     dark needs no second table — plus weight (Blocked is bold) and
     decoration (the struck-through Superseded and Canceled). The single
     paint rule after it is what every host applies wherever a status
     appears (nav tag, board control, ticket page, blockers pills); the word
     stays in the chip. The extra selectors in the paint rule only out-rank
     the hosts' own base rules (`#nav .tag`, `select.status { font: inherit
     }`). `In Review` is the one status with a space; its row is
     `st-in-review` (st_class in src/main.rs hyphenates). */

  .st-ready      { --st-bg: var(--st-ready-bg);      --st-fg: var(--st-ready-fg); }

  .st-in-review  { --st-bg: var(--st-in-review-bg);  --st-fg: var(--st-in-review-fg); }
  .st-blocked    { --st-bg: var(--st-blocked-bg);    --st-fg: var(--st-blocked-fg);    --st-weight: var(--weight-strong); }
  .st-complete   { --st-bg: var(--st-complete-bg);   --st-fg: var(--st-complete-fg); }

  .st-canceled   { --st-bg: var(--st-canceled-bg);   --st-fg: var(--st-canceled-fg);   --st-deco: line-through; }
  .st-doc        { --st-bg: var(--st-doc-bg);        --st-fg: var(--st-doc-fg); }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: var(--text-size)/var(--text-leading) var(--font-text);
  }
  /* MFE-21: the header wraps rather than overflow — a fourth link, and an
     overridden backend's URL in the status, outgrow a narrow column. */
  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem;
    padding: .75rem 1.25rem; border-bottom: var(--border) solid var(--line);
  }
  header h1 { font-size: calc(1rem * var(--text-scale)); margin: 0; font-weight: var(--weight-strong); }
  header .tag { color: var(--muted); font-size: calc(.8rem * var(--text-scale)); }
  #conn { color: var(--muted); font-size: calc(.8rem * var(--text-scale)); margin-left: auto; }
  /* IDENTITY-22: sign-out sits in the header as a button; the no-access
     card and the members page. */
  form.signout { display: inline; margin: 0; }
  header form.signout { margin-left: .5rem; }
  #no-access { max-width: 34rem; margin: 3rem auto; padding: 1.5rem 1.75rem; background: var(--card);
    border: var(--border) solid var(--line); border-radius: var(--radius-2xl); }
  #no-access h2 { margin: 0 0 .75rem; }
  #no-access .id code { font-size: calc(.9rem * var(--text-scale)); overflow-wrap: anywhere; }
  #no-access .hint, #members .hint, #members .lbl { color: var(--muted); }
  #members { max-width: 60rem; }
  #members h3 { font-size: calc(.9rem * var(--text-scale)); margin: 1.5rem 0 .5rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #members .waiting { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; padding: .5rem 0; border-bottom: var(--border) solid var(--line); }
  #members .waiting code, #members td code { font-size: calc(.8rem * var(--text-scale)); overflow-wrap: anywhere; }
  #members input, #members select { font: inherit; padding: .2rem .45rem; background: var(--card); color: var(--ink);
    border: var(--border) solid var(--line); border-radius: var(--radius); }
  #members input.scope, #members #grant-scope { width: 9rem; }
  #members #grant-principal { flex: 1 1 18rem; }
  #members table { border-collapse: collapse; width: 100%; font-size: calc(.85rem * var(--text-scale)); }
  #members th { text-align: left; color: var(--muted); font-weight: var(--weight-medium); padding: .3rem .5rem; border-bottom: var(--border) solid var(--line); }
  #members td { padding: .35rem .5rem; border-bottom: var(--border) solid var(--line); }
  #members td:nth-child(2) code, #members td:nth-child(3) { white-space: nowrap; }
  #members button.primary { border: var(--border) solid var(--accent); color: var(--accent); background: var(--card); border-radius: var(--radius); padding: .2rem .6rem; }
  #members button.link { background: none; border: 0; color: var(--accent); cursor: pointer; }
  #members .line { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  #settings ul.grants { list-style: none; margin: 0; padding: 0; }
  /* IDENTITY-15: who this connection is, just before its state. */
  header #who { margin-left: auto; }
  header #who + #conn { margin-left: .6rem; }
  header #who.signed-in { color: var(--ink); }
  #conn.live { color: var(--live); }
  #conn.reconnecting { color: var(--err-fg); }
  /* AGS-17: the theme toggle — a header control in the nav-reveal's
     idiom; its text names the current choice (system / light / dark). */
  header .theme {
    background: var(--bg); border: var(--border) solid var(--line); color: var(--muted);
    font: inherit; font-size: calc(11px * var(--text-scale)); line-height: 1.3; padding: 0 6px;
    border-radius: var(--radius); cursor: pointer; white-space: nowrap;
  }
  header .theme:hover { color: var(--accent); border-color: var(--accent); }
  /* MFE-21: the app talks to a backend other than this page's server (an
     override from #/settings) — the status names it, highlighted, on every
     page; its color still says the state. */
  #conn.override {
    background: var(--sel); border: var(--border) solid var(--accent); border-radius: var(--radius);
    padding: 0 .45rem; font-weight: var(--weight-strong); overflow-wrap: anywhere;
  }
  /* MFE-21: #/settings — a group per concern (Backend first) in the panel
     idiom: a label column and a control column, one column when the
     content column is narrow (it is the query container). */
  #settings { max-width: 52rem; }
  #settings h2 { font-size: calc(1rem * var(--text-scale)); margin: 0 0 .75rem; }
  #settings fieldset.group {
    background: var(--panel); border: var(--border) solid var(--line); border-radius: var(--radius-xl);
    margin: 0 0 1rem; padding: .5rem 1rem 1rem; min-width: 0;
  }
  #settings legend {
    padding: 0 .4rem; font-family: var(--sans); font-size: calc(11px * var(--text-scale)); font-weight: var(--weight-strong);
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  }
  #settings p.now { margin: .25rem 0 .9rem; color: var(--muted); font-size: calc(.8rem * var(--text-scale)); overflow-wrap: anywhere; }
  #settings p.now code { color: var(--ink); }
  #settings .field { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: .4rem 1rem; align-items: baseline; }
  #settings label { font-size: calc(.85rem * var(--text-scale)); }
  #settings .control { min-width: 0; }
  #settings .line { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
  #settings input#ws-url, #settings input#test-url {
    flex: 1 1 16rem; min-width: 0; font: inherit; padding: .25rem .5rem;
    background: var(--card); color: var(--ink); border: var(--border) solid var(--line); border-radius: var(--radius); outline: none;
  }
  #settings input#ws-url:focus, #settings input#test-url:focus { border-color: var(--accent); }
  #settings input#ws-url[aria-invalid="true"], #settings input#test-url[aria-invalid="true"] { border-color: var(--err-fg); }
  #settings button {
    font: inherit; font-size: calc(.8rem * var(--text-scale)); padding: .1rem .65rem; cursor: pointer;
    background: var(--card); color: var(--ink); border: var(--border) solid var(--line); border-radius: var(--radius);
  }
  #settings button:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  #settings button:disabled { color: var(--muted); cursor: default; opacity: .65; }
  #settings button.primary:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  #settings button.link { background: none; border: 0; padding: 0; color: var(--accent); }
  #settings button.link:disabled { color: var(--muted); }
  #settings button.link:hover:not(:disabled) { text-decoration: underline; }
  #settings p.status { margin: .35rem 0 .6rem; font-size: calc(.8rem * var(--text-scale)); min-height: 1.5em; overflow-wrap: anywhere; }
  #settings .hint, #settings .probe.testing { color: var(--muted); }
  #settings .probe.ok { color: var(--live); }
  #settings .probe.failed, #settings .invalid { color: var(--err-fg); }
  #settings p.invalid { margin: .5rem 0 0; font-size: calc(.8rem * var(--text-scale)); }
  #settings .recent {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .6rem;
    margin-top: .9rem; padding-top: .6rem; border-top: var(--border) solid var(--line); font-size: calc(.8rem * var(--text-scale));
  }
  #settings .recent .lbl { color: var(--muted); }
  #settings .recent ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .25rem .9rem; }
  #settings .recent button.fill {
    background: none; border: 0; padding: 0; font-size: calc(.8rem * var(--text-scale)); color: var(--accent); overflow-wrap: anywhere;
  }
  #settings .recent button.fill:hover { text-decoration: underline; }
  @container (max-width: 36rem) {
    #settings .field { grid-template-columns: minmax(0, 1fr); }
  }
  main { padding: calc(1rem * var(--space)) calc(1.25rem * var(--space)); max-width: 72rem; margin: 0 auto; }
  #health { color: var(--muted); font-size: calc(.8rem * var(--text-scale)); margin-bottom: 1rem; }
  #error {
    display: flex; align-items: baseline; gap: 1rem;
    background: var(--err-bg); color: var(--err-fg); border: var(--border) solid var(--err-line);
    border-left-width: 4px; border-radius: var(--radius-lg);
    padding: .5rem .75rem; margin-bottom: 1rem; font-size: calc(.85rem * var(--text-scale));
  }
  #error button {
    margin-left: auto; background: none; border: var(--border) solid var(--err-line);
    color: inherit; font: inherit; font-size: calc(.8rem * var(--text-scale)); border-radius: var(--radius);
    padding: 0 .5rem; cursor: pointer;
  }
  /* The board's status control is the chip: it wears the row's status
     (class st-<status>, kept in step with the ticket) and lists the
     vocabulary in each option's own colors. */
  select.status {
    background: var(--card); color: var(--ink);
    border: var(--border) solid var(--line); border-radius: var(--radius-lg);
    font: inherit; font-size: calc(.85rem * var(--text-scale)); padding: .1rem .3rem;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: var(--border) solid var(--line); }
  th { color: var(--muted); font-weight: var(--weight-medium); font-size: calc(.8rem * var(--text-scale)); }
  td.id { color: var(--accent); white-space: nowrap; }
  /* MFE-12: the board mounts a window of rows between two spacers sized
     at the row pitch, so every row is exactly one line: fixed columns, and
     a cell that does not fit ends in an ellipsis (the title and blocked-by
     cells carry their whole text as a tooltip). Fixed columns also keep
     the widths still as the window slides — under auto layout they would
     follow whichever rows happen to be mounted. */
  table.board { table-layout: fixed; }
  table.board th.c-id { width: 11rem; }
  table.board th.c-kind { width: 6.5rem; }
  /* DEPLOY-13: the status, then a mark per environment the work runs in. */
  table.board th.c-status { width: 13rem; }
  table.board th.c-sev { width: 6.5rem; }
  table.board th.c-blk { width: 10rem; }
  tbody#board td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tbody#board tr.spacer td { padding: 0; border: 0; }
  /* SCALE-26: rows the window has reached before their page has come — a
     stretch of them is one muted line band at the row pitch, so nothing
     moves when the rows land in its place. */
  tbody#board tr.pending td { padding: 0 .6rem; border: 0; color: var(--muted); vertical-align: top; }
  tbody#board.scaled { overflow-anchor: none; }
  /* The status control is the tallest thing in a row, and its natural
     height follows the face it is set in — Blocked's bold one is 4px
     taller — so its box is pinned: every row the same pitch. */
  tbody#board select.status { height: 1.5rem; }
  /* SDLC-11: a doc has no lifecycle, so its status is no control — a
     neutral chip (the st-doc row) in the control's place, the control's
     box, so the row keeps the board's pitch. */
  span.status.chip {
    display: inline-block; box-sizing: border-box; border: var(--border) solid var(--line);
    border-radius: var(--radius-lg); font-size: calc(.85rem * var(--text-scale)); padding: 0 .4rem;
  }
  tbody#board span.status.chip { height: 1.5rem; line-height: calc(1.5rem - 2px); }
  /* AGS-20: a board row that decomposes says so (no parent column). */
  td.id .haskids {
    margin-left: .35rem; font-size: calc(10.5px * var(--text-scale)); color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  td.status { white-space: nowrap; }

  /* MFE-7: universal click-through + the ticket page. */
  header h1 a { color: inherit; text-decoration: none; }
  tbody#board tr[data-ticket-id] { cursor: pointer; }
  /* MENGER-13: done with — complete, superseded, canceled (a canceled
     subtree with it): the title quieter, the status chip says which. */
  tbody#board tr.done td:nth-child(2) { color: var(--muted); }
  tbody#board tr[data-ticket-id]:hover td { background: var(--hover); }
  /* ACT-3: a selected board row — the nav's tint. */
  tbody#board tr.picked td { background: var(--sel); }
  td.id a { color: inherit; text-decoration: none; }
  td.id a:hover { text-decoration: underline; }
  #ticket-page .crumbs { margin: 0 0 .75rem; }
  #ticket-page .crumbs a { color: var(--muted); text-decoration: none; }
  #ticket-page .crumbs a:hover { color: var(--accent); }
  /* AGS-20: the ancestor chain, root first, after the board crumb. */
  #ticket-page .crumbs .sep { color: var(--muted); }
  #ticket-page .crumbs .crumb { font-family: var(--mono); font-size: calc(12.5px * var(--text-scale)); }
  /* MFE-24 (owner, 2026-10-09: "I want the full screen width to be
     usable"): the ticket page is one column at every width — the form
     AGS-22 gave it under 840px, now the only one. The crumb, the title, the
     properties as a band, then the body and the children, each as wide as
     the content column: no side column, and no cap on the page or the body
     (rules below). The article gives up its box so its title and its body
     can sit either side of the band; every selector into it still matches. */
  #ticket-page { display: flex; flex-direction: column; }
  #ticket-page article.ticket { display: contents; }
  #ticket-page article.ticket > * { order: 3; }
  #ticket-page article.ticket > h2 { order: 1; }
  main:has(#ticket-page) { max-width: none; }
  #ticket-page .md, #ticket-page .mframe { max-width: none; }
  /* The band: label/value pairs in a wrapping row, the stamps on one line,
     the relations side by side; a hairline under it all. */
  #ticket-page aside.props {
    order: 2; min-width: 0; padding: 0 0 .9rem; margin-bottom: 1.25rem;
    border-bottom: var(--border) solid var(--line);
    font-family: var(--sans); font-size: calc(13px * var(--text-scale)); line-height: 1.5;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 2rem;
  }
  #ticket-page aside.props dl.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem 1.5rem; }
  #ticket-page aside.props dl.meta div { display: flex; align-items: baseline; gap: .45rem; min-width: 0; }
  #ticket-page aside.props .stamps {
    flex-direction: row; flex-wrap: wrap; gap: 0 1rem; margin: 0; padding: 0; border: 0;
  }
  #ticket-page aside.props section.dag {
    flex: 1 1 100%; margin: 0; padding-top: .2rem; border-top: var(--border) solid var(--line);
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: column;
    grid-template-rows: auto auto; column-gap: 2rem;
  }
  #ticket-page aside.props section.dag.empty { display: none; }
  #ticket-page aside.props section.dag h3 { margin-top: .5rem; }
  #ticket-page #notfound, #ticket-page .loading { order: 4; }
  /* MENGER-22: highlighted code (src/highlight.rs) — highlight.js's classes
     in the --code-* tokens; diffs in the house's live and error inks. A
     theme or the toggle recolours them with no parse again. A comment's
     fences (src/highlight.rs CommentText) are blocks like a body's. */
  .hljs-keyword, .hljs-selector-tag, .hljs-doctag, .hljs-section { color: var(--code-keyword); }
  .hljs-string, .hljs-regexp, .hljs-symbol, .hljs-char { color: var(--code-string); }
  .hljs-comment, .hljs-quote { color: var(--code-comment); font-style: italic; }
  .hljs-number, .hljs-literal { color: var(--code-number); }
  .hljs-title, .hljs-name { color: var(--code-title); }
  .hljs-type, .hljs-title.class_, .hljs-title.class_.inherited__ { color: var(--code-type); }
  .hljs-meta, .hljs-meta .hljs-keyword, .hljs-meta .hljs-string { color: var(--code-meta); }
  .hljs-built_in { color: var(--code-builtin); }
  .hljs-attr, .hljs-attribute, .hljs-property, .hljs-selector-class, .hljs-selector-id,
  .hljs-selector-attr, .hljs-selector-pseudo { color: var(--code-attr); }
  .hljs-variable, .hljs-template-variable, .hljs-params { color: var(--code-variable); }
  .hljs-addition { color: var(--live); }
  .hljs-deletion { color: var(--err-fg); }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: var(--weight-strong); }
  .ctext pre.ccode {
    font-family: var(--mono); font-size: calc(12.5px * var(--text-scale)); background: var(--panel); border: var(--border) solid var(--line);
    border-radius: var(--radius); padding: .45rem .65rem; margin: .35rem 0; overflow-x: auto; white-space: pre;
  }
  /* THEME-8: a region wearing its own theme (src/scopes.rs) paints its own
     ground and ink; under one theme it is the page's as ever. */
  /* THEME-6: each region says its paper, ink and text again where its own tokens
     are — a face, a size or an ink inherits as a value, resolved on body with the
     site's, so a theme worn by the ticket view or a frame's box alone sets them too */
  #ticket-page, .mscope-frame { background: var(--bg); color: var(--ink); font: var(--text-size)/var(--text-leading) var(--font-text); }
  /* The house code chip (`#nav .code`'s face, rule below) wherever the
     page names an id or a shortcode; the page's chips set their own mono
     face, and a linked one lights up like every other link. */
  #ticket-page .code { font-family: var(--mono); text-decoration: none; }
  #ticket-page a.code:hover { color: var(--accent); border-color: var(--accent); }
  /* The title: the id as the chip, then the title in the sans face. The
     title wraps inside its own slot rather than dropping under the chip. */
  article.ticket h2 {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: .55rem;
    font-family: var(--font-display); font-size: calc(20px * var(--text-scale)); font-weight: var(--weight-strong);
    letter-spacing: -.01em; line-height: 1.3; margin: .1rem 0 1rem;
  }
  #ticket-page article.ticket h2 .code { flex: none; font-size: calc(11.5px * var(--text-scale)); padding: 1px 6px; }
  article.ticket h2 .t { flex: 1 1 14rem; min-width: 0; }
  /* The properties: a label/value grid. `display: contents` on each pair
     lifts its dt/dd into the grid, so the labels form one column. */
  dl.meta {
    display: grid; grid-template-columns: 6.5em minmax(0, 1fr);
    gap: .45rem .5rem; margin: 0; align-items: baseline;
  }
  dl.meta div { display: contents; }
  dl.meta dt { color: var(--muted); }
  dl.meta dd { margin: 0; min-width: 0; }
  /* The status chip: its face is the status table's (AGS-15). */
  dd.status {
    justify-self: start; border: 1px solid transparent; border-radius: var(--radius-lg);
    font-size: calc(11.5px * var(--text-scale)); padding: 0 .5rem;
  }
  dd.kind .glyph { margin-right: .4rem; }
  /* FILTER-22: the kind is a tag — as wide as its words, as the status is. */
  dd.kind { justify-self: start; }
  /* SDLC-9: the commits that finished the ticket — short, mono, in link order. */
  dd#t-commits { display: flex; flex-wrap: wrap; gap: 0 .6rem; }
  dd#t-commits .commit { font-family: var(--mono); font-size: calc(12px * var(--text-scale)); }
  /* The stamps: relative, the exact time (fmt_unix) on hover. */
  aside.props .stamps {
    display: flex; flex-direction: column; margin: .9rem 0 0; padding-top: .7rem;
    border-top: var(--border) solid var(--line); color: var(--muted); font-size: calc(11.5px * var(--text-scale));
  }
  aside.props .stamps span { width: max-content; }
  aside.props .stamps [title] { cursor: help; }
  /* The relations, under a hairline; a doc's (which it never has) not drawn. */
  aside.props section.dag { margin-top: .9rem; padding-top: .1rem; border-top: var(--border) solid var(--line); }
  aside.props section.dag.empty { display: none; }
  /* Section heads: the relations', and the Children header's. */
  aside.props h3, section.kidsec h3 {
    font-family: var(--sans); font-size: calc(11px * var(--text-scale)); font-weight: var(--weight-medium);
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    margin: .9rem 0 .35rem;
  }
  aside.props .none { margin: 0; font-size: calc(12px * var(--text-scale)); }
  /* AGS-20/22: the children, under the body, with the nav's roll-up. */
  section.kidsec { margin-top: 1.75rem; padding-top: .9rem; border-top: var(--border) solid var(--line); }
  section.kidsec h3 { display: flex; align-items: center; gap: .5rem; margin: 0 0 .4rem; }
  section.kidsec .roll {
    font-family: var(--mono); font-size: calc(10px * var(--text-scale)); letter-spacing: 0; text-transform: none;
    font-variant-numeric: tabular-nums; color: var(--chip-fg);
    background: var(--chip-bg); border: var(--border) solid var(--chip-line);
    border-radius: var(--radius-lg); padding: 0 5px;
  }
  section.kidsec .none, section.kidsec .loading { font-family: var(--sans); font-size: calc(13px * var(--text-scale)); margin: 0; }
  /* MENGER-13: the History — each transition a line: when · from → to ·
     who · source · why · caused by; the system's muted; when the log
     began, last, in a quiet line. */
  section.histsec { margin-top: 1.5rem; padding-top: .9rem; border-top: var(--border) solid var(--line); font-family: var(--sans); font-size: calc(13px * var(--text-scale)); }
  section.histsec h3, section.histsec h4 {
    font-family: var(--sans); font-size: calc(11px * var(--text-scale)); font-weight: var(--weight-medium);
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 .4rem;
  }
  section.histsec h4 { margin-top: .8rem; }
  section.histsec ol.transitions { list-style: none; margin: 0; padding: 0; }
  section.histsec li.tr {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: .22rem 0;
    border-bottom: var(--border) dashed var(--line);
  }
  section.histsec li.tr:last-child { border-bottom: 0; }
  section.histsec li.tr .at { color: var(--muted); font-size: calc(12px * var(--text-scale)); min-width: 4.5em; cursor: help; font-variant-numeric: tabular-nums; }
  section.histsec li.tr .move { display: inline-flex; align-items: baseline; gap: 5px; }
  section.histsec li.tr .move .status { font-size: calc(11px * var(--text-scale)); padding: 0 5px; border-radius: var(--radius); }
  section.histsec li.tr .born, section.histsec li.tr .fieldname { color: var(--muted); font-size: calc(12px * var(--text-scale)); font-style: italic; }
  section.histsec li.tr .kindword { font-family: var(--mono); font-size: calc(12px * var(--text-scale)); }
  section.histsec li.tr .arrow { color: var(--muted); }
  section.histsec li.tr .who { font-weight: var(--weight-medium); }
  section.histsec li.tr.system .who { font-weight: var(--weight-normal); color: var(--muted); font-style: italic; }
  section.histsec li.tr .src {
    font-family: var(--mono); font-size: calc(10px * var(--text-scale)); color: var(--chip-fg); background: var(--chip-bg);
    border: var(--border) solid var(--chip-line); border-radius: var(--radius-lg); padding: 0 5px; cursor: help;
  }
  section.histsec li.tr .msg { color: var(--fg, inherit); flex-basis: 100%; padding-left: 4.5em; font-size: calc(12.5px * var(--text-scale)); }
  section.histsec li.tr .cause { color: var(--muted); font-size: calc(12px * var(--text-scale)); }
  section.histsec li.tr a.code { font-family: var(--mono); font-size: calc(12px * var(--text-scale)); }
  section.histsec p.began, section.histsec p.since, section.histsec p.restorable, section.histsec p.none, section.histsec p.loading {
    margin: .6rem 0 0; color: var(--muted); font-size: calc(12px * var(--text-scale));
  }
  section.histsec p.restorable { color: inherit; }
  article.ticket > p.none, article.ticket > p.loading,
  .mscope-frame > p.none, .mscope-frame > p.loading { font-family: var(--sans); font-size: calc(13px * var(--text-scale)); }
  /* Relation and child rows: kind glyph · code chip · title · status chip.
     The title takes the slack and truncates (whole on hover); the chip is
     pinned right at the nav's chip width, so a column of them aligns. */
  #blockers, #unlocks, #children { list-style: none; margin: 0; padding: 0; }
  #blockers li, #unlocks li, #children li {
    display: flex; align-items: baseline; gap: 6px; min-width: 0; padding: .15rem 0;
  }
  ul#children { font-family: var(--sans); font-size: calc(13px * var(--text-scale)); }
  ul#children li { padding: .3rem .5rem; margin: 0 -.5rem; border-radius: var(--radius-lg); }
  ul#children li:hover { background: var(--hover); }
  #blockers .glyph, #unlocks .glyph, #children .glyph { flex: none; width: 1ch; color: var(--muted); }
  #blockers a, #unlocks a, #children a { flex: none; }
  /* FILTER-16: under the global filter — the notice under the title when
     the ticket is outside it (its pills in words, clear), the relations and
     children outside it dimmed, and the line that says what the filter
     hides of the children. */
  .tout {
    display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .5rem; margin: 0 0 .9rem;
    padding: .4rem .6rem; font-family: var(--sans); font-size: calc(12.5px * var(--text-scale)); color: var(--muted);
    background: var(--panel); border: var(--border) dashed var(--line); border-radius: var(--radius-xl);
  }
  .tout strong { color: var(--ink); font-weight: var(--weight-strong); }
  .tout-pills { display: inline-flex; flex-wrap: wrap; gap: .3rem; }
  .tout .pill {
    display: inline-flex; align-items: stretch; font-size: calc(12px * var(--text-scale)); line-height: 1.6;
    background: var(--card); border: var(--border) solid var(--line); border-radius: var(--radius-lg); overflow: hidden;
  }
  .tout .pill > * { padding: .05rem .45rem; border-left: var(--border) solid var(--line); white-space: nowrap; }
  .tout .pill > :first-child { border-left: 0; }
  .tout .pill .p-vals { color: var(--ink); }
  .tout button.tout-clear {
    background: none; border: 0; padding: 0 .2rem; font: inherit; font-size: calc(12px * var(--text-scale)); color: var(--accent); cursor: pointer;
  }
  .tout button.tout-clear:hover { text-decoration: underline; }
  #blockers li.outside, #unlocks li.outside, #children li.outside { opacity: .45; }
  #blockers li.outside:hover, #unlocks li.outside:hover, #children li.outside:hover { opacity: .8; }
  /* SCALE-4: a large parent's children come a page at a time. */
  button.more {
    margin: .35rem 0 0; padding: .1rem .5rem; font: inherit; font-size: calc(.8rem * var(--text-scale));
    color: var(--muted); background: transparent;
    border: var(--border) solid var(--line); border-radius: var(--radius-lg); cursor: pointer;
  }
  button.more:hover { color: var(--accent); border-color: var(--accent); }
  .bstatus {
    flex: none; margin-left: auto; width: 6.5em; text-align: center; box-sizing: border-box;
    font-family: var(--mono); font-size: calc(10px * var(--text-scale)); padding: 0 5px;
    border: 1px solid transparent; border-radius: var(--radius-lg); white-space: nowrap;
  }
  .btitle {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--muted);
  }
  ul#children .btitle { color: var(--ink); }
  .dangling { color: var(--err-fg); }
  .none, .loading { color: var(--muted); }
  #notfound h2 { color: var(--err-fg); font-size: calc(1.05rem * var(--text-scale)); }
  details.frontmatter { margin: 0 0 .75rem; }
  details.frontmatter summary { cursor: pointer; color: var(--muted); font-size: calc(.8rem * var(--text-scale)); }
  details.frontmatter pre {
    background: var(--panel); border: var(--border) solid var(--line); border-radius: var(--radius);
    padding: .6rem .8rem; overflow-x: auto; margin: .35rem 0 0;
  }
  /* Prose is sans, code stays mono — manifest's split. */
  .md { line-height: 1.6; max-width: 56rem; font-family: var(--sans); }
  /* THEME-5: headings in the display face, with room (the frame SDK's base says the same) */
  .md :is(h1, h2, h3, h4) { font-family: var(--font-display); font-weight: var(--weight-strong); line-height: 1.25; letter-spacing: -.005em; margin: 1.6rem 0 .55rem; }
  .md h1 { font-size: calc(1.5rem * var(--text-scale)); }
  .md h2 { font-size: calc(1.25rem * var(--text-scale)); }
  .md h3 { font-size: calc(1.1rem * var(--text-scale)); }
  .md h4 { font-size: calc(1rem * var(--text-scale)); }
  .md code {
    font-family: var(--mono); font-size: calc(.92em * var(--text-scale));
    background: var(--panel); border: var(--border) solid var(--line);
    border-radius: var(--radius-sm); padding: 0 .25rem;
  }
  .md pre {
    font-family: var(--mono);
    background: var(--panel); border: var(--border) solid var(--line); border-radius: var(--radius);
    padding: .6rem .8rem; overflow-x: auto;
  }
  .md pre code { border: 0; padding: 0; background: none; font-size: inherit; }
  .md a { color: var(--accent); }
  .md blockquote {
    border-left: 3px solid var(--line); margin: .5rem 0;
    padding: 0 .8rem; color: var(--muted);
  }
  .md table { width: auto; }
  .md th, .md td { border: var(--border) solid var(--line); padding: .25rem .5rem; }

  /* AGS-12: the persistent left nav — manifest's sidebar pattern. A
     full-height two-column grid: the nav column collapses (and the
     content reflows) when the nav is hidden. */
  #app { display: grid; grid-template-columns: 360px minmax(0, 1fr); height: 100vh; }
  #app.nonav { grid-template-columns: minmax(0, 1fr); }
  #app.nonav #nav { display: none; }
  /* AGS-22: the content column is a query container, so a page's narrow
     form answers to the space it has (hiding the nav widens it by 360px),
     not to the viewport. */
  #app .content { min-width: 0; height: 100vh; overflow: auto; container-type: inline-size; }
  #nav {
    background: var(--panel); border-right: var(--border) solid var(--line);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  #nav .brand {
    display: flex; align-items: baseline; gap: .4rem;
    padding: 12px 14px; font-weight: var(--weight-strong); border-bottom: var(--border) solid var(--line);
  }
  #nav .brand .muted { color: var(--muted); font-weight: var(--weight-normal); }
  #nav .nav-hide, header .nav-reveal {
    background: var(--bg); border: var(--border) solid var(--line); color: var(--muted);
    font: inherit; font-size: calc(11px * var(--text-scale)); line-height: 1.3; padding: 0 6px;
    border-radius: var(--radius); cursor: pointer;
  }
  #nav .nav-hide { margin-left: auto; }
  #nav .nav-hide:hover, header .nav-reveal:hover { color: var(--accent); border-color: var(--accent); }
  /* SCALE-24: no scroll anchoring — a windowed list keeps its spacers at
     the height of what they stand for, so content above the viewport never
     changes height when the window moves, and Chrome's anchor (which a
     keyed <For> can move in the DOM) only mis-compensated. */
  #nav .tree-scroll { flex: 1; overflow: auto; min-height: 0; overflow-anchor: none; }
  #nav .tree { padding: 6px 0; font-family: var(--mono); font-size: calc(12.5px * var(--text-scale)); line-height: 1.55; white-space: nowrap; }
  #nav .row {
    display: flex; align-items: center; gap: 4px; padding: 0 10px;
    cursor: pointer; color: var(--ink); text-decoration: none;
  }
  #nav .row:hover { background: var(--hover); }
  #nav .row.sel { background: var(--row-sel); box-shadow: inset 3px 0 0 var(--accent); border-radius: var(--radius-xs); }
  #nav .row.sel .label { font-weight: var(--weight-strong); }
  #nav .row.sel .code { color: var(--accent); }
  /* ACT-3: the selection — the list-"on" tint; the open row keeps its bar. */
  #nav .row.picked:not(.sel) { background: var(--sel); }
  #nav .nsel {
    flex: none; display: flex; align-items: baseline; gap: .3rem; padding: 6px 12px;
    border-top: var(--border) solid var(--line); font-size: calc(11px * var(--text-scale)); color: var(--muted);
  }
  #nav .nsel-n { color: var(--accent); font-variant-numeric: tabular-nums; }
  #nav .nsel-clear {
    background: none; border: 0; padding: 0; font: inherit; color: var(--muted); cursor: pointer;
    text-decoration: underline dotted; text-underline-offset: 2px;
  }
  #nav .nsel-clear:hover { color: var(--accent); }
  #nav .prefix { color: var(--tree-line); white-space: pre; user-select: none; }
  #nav .toggle { width: 1ch; color: var(--muted); }
  #nav .toggle.clickable { cursor: pointer; }
  #nav .code, #tmenu .code, #tagmenu .code, #toast .code, #ticket-page .code {
    font-size: calc(10.5px * var(--text-scale)); font-weight: var(--weight-strong); letter-spacing: .02em; color: var(--chip-fg);
    background: var(--chip-bg); border: var(--border) solid var(--chip-line); border-radius: var(--radius-md);
    padding: 0 5px; white-space: nowrap;
  }
  #nav .label { flex: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* Chips sit in their own right-hand column: the label absorbs the
     slack, and a fixed chip width keeps every chip's left edge aligned. */
  #nav .tag {
    flex: none; margin-left: auto; width: 6.5em; text-align: center; box-sizing: border-box;
    font-size: calc(10px * var(--text-scale)); padding: 0 5px; border-radius: var(--radius-lg);
    border: var(--border) solid var(--line); color: var(--muted); background: var(--card);
  }
  #nav .tag.roll { font-variant-numeric: tabular-nums; color: var(--chip-fg); background: var(--chip-bg); }
  /* AGS-20: the tree nests. MFE-12: a collapsed node's kids container is
     mounted empty (its children mount when it opens — src/nav.rs); this
     keeps the empty box out of the layout. */
  #nav .node.collapsed > .kids { display: none; }
  /* SCALE-24: past a page of children a node's list is a window — spacers
     stand for the children it has not mounted, at their height, and a
     pending row holds a child's line until its ticket arrives. */
  #nav .kids > .spacer { pointer-events: none; }
  #nav .row.pending { cursor: default; color: var(--muted); }
  #nav .row.pending:hover { background: none; }
  /* AGS-13: kinds. The board spells the word; the nav marks each leaf
     with its kind's glyph, tinted per kind — and AGS-22 gives the ticket
     page the same glyph in the same tint: its Kind row (the word beside it
     in ink) and every relation and child row. A doc's pilcrow, like any
     kind outside the five, keeps the muted default. */
  td.kind { color: var(--muted); }
  #nav .toggle.kind, dd.kind .glyph { color: var(--muted); }
  #nav .leaf[data-kind="scope"] .toggle.kind, #ticket-page [data-kind="scope"] .glyph { color: var(--kind-scope); }
  #nav .leaf[data-kind="build"] .toggle.kind, #ticket-page [data-kind="build"] .glyph { color: var(--kind-build); }
  #nav .leaf[data-kind="execution"] .toggle.kind, #ticket-page [data-kind="execution"] .glyph { color: var(--kind-execution); }
  #nav .leaf[data-kind="gap"] .toggle.kind, #ticket-page [data-kind="gap"] .glyph { color: var(--kind-gap); }
  #nav .leaf[data-kind="spike"] .toggle.kind, #ticket-page [data-kind="spike"] .glyph { color: var(--kind-spike); }
  /* AGS-18: the keyboard layer. Focus is visible wherever it can land —
     a 2px accent ring, deliberately unlike the selected row (which is a
     --row-sel tint with an inset accent bar), so "where I am" and "what
     is open" never read as the same thing. */
  #nav .row:focus, tbody#board tr:focus, #palette-input:focus, #cheats .close:focus {
    outline: 2px solid var(--accent); outline-offset: -2px;
  }
  #nav .row:focus { border-radius: var(--radius-xs); }
  /* FILTER-20: the nav's view — `Tree | Flat` in its header — and the flat
     list: the tree's leaf rows, one line each (the window's arithmetic needs
     every row one pitch tall), and spacers and pending stretches standing for
     the rows not mounted. */
  #nav .nview {
    margin-left: auto; display: inline-flex; flex: none;
    border: var(--border) solid var(--line); border-radius: var(--radius); overflow: hidden;
  }
  #nav .nview-b {
    background: var(--bg); border: 0; color: var(--muted);
    font: inherit; font-size: calc(11px * var(--text-scale)); line-height: 1.3; padding: 0 6px; cursor: pointer;
  }
  #nav .nview-b + .nview-b { border-left: var(--border) solid var(--line); }
  #nav .nview-b:hover { color: var(--accent); }
  #nav .nview-b[aria-pressed="true"] { color: var(--accent); background: var(--chip-bg); font-weight: var(--weight-strong); }
  #nav .nview + .nav-hide { margin-left: 0; }
  #nav .flat > .spacer { pointer-events: none; }
  #nav .flat > .pending { padding: 0 10px; color: var(--muted); overflow: hidden; box-sizing: border-box; }
  /* The two overlays (jump palette, cheat sheet). */
  .overlay {
    position: fixed; inset: 0; z-index: 40; background: var(--scrim);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 12vh 1rem 1rem;
  }
  .dialog {
    background: var(--bg); border: var(--border) solid var(--line); border-radius: var(--radius-xl);
    box-shadow: 0 12px 40px var(--shadow); max-width: 100%; overflow: hidden;
  }
  #palette { width: 44rem; display: flex; flex-direction: column; max-height: 68vh; }
  #palette-input {
    font: inherit; font-size: calc(.9rem * var(--text-scale)); padding: .55rem .8rem;
    background: var(--bg); color: var(--ink);
    border: 0; border-bottom: var(--border) solid var(--line); border-radius: 0;
  }
  #palette-list { list-style: none; margin: 0; padding: .25rem 0; overflow: auto; flex: 1; min-height: 0; }
  #palette-list li {
    display: flex; align-items: center; gap: 6px; padding: .1rem .8rem;
    font-size: calc(12.5px * var(--text-scale)); line-height: 1.55; white-space: nowrap; cursor: pointer;
  }
  #palette-list li:hover { background: var(--hover); }
  #palette-list li.hi { background: var(--row-sel); box-shadow: inset 3px 0 0 var(--accent); }
  #palette-list li .code {
    font-size: calc(10.5px * var(--text-scale)); font-weight: var(--weight-strong); letter-spacing: .02em; color: var(--chip-fg);
    background: var(--chip-bg); border: var(--border) solid var(--chip-line); border-radius: var(--radius-md);
    padding: 0 5px;
  }
  /* Layout only — the status chip's face comes from the status table. */
  #palette-list li .tag {
    flex: none; margin-left: auto; width: 6.5em; text-align: center; box-sizing: border-box;
    font-size: calc(10px * var(--text-scale)); padding: 0 5px; border-radius: var(--radius-lg);
  }
  #palette-list li .label { flex: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* FILTER-16: under the global filter — the rows outside it ("Search
     everything") dimmed and marked; the last row, the other pass. */
  #palette-list li.outside .code, #palette-list li.outside .label { opacity: .55; }
  #palette-list li .pal-out {
    flex: none; font-family: var(--sans); font-size: calc(10px * var(--text-scale)); letter-spacing: .03em; color: var(--muted);
    border: var(--border) dashed var(--line); border-radius: var(--radius-md); padding: 0 4px;
  }
  #palette-list li.pal-wide { border-top: var(--border) solid var(--line); margin-top: .2rem; padding-top: .25rem; color: var(--accent); }
  #palette-list li.pal-wide .label { flex: none; }
  #palette-list li.pal-wide .pal-hint { color: var(--muted); font-size: calc(11px * var(--text-scale)); }
  /* FILTER-22: `filter <shortcode>` — a row per shortcode it offers, above
     the tickets. */
  #palette-list li.pal-cmd .pal-do { color: var(--accent); }
  #palette-list li.pal-cmd .pal-hint { color: var(--muted); font-size: calc(11px * var(--text-scale)); }
  /* SEARCH-3: the hits in bodies — a heading, then a row per hit: its code,
     title and status, and beneath them its passage, the matched words
     marked. */
  #palette-list li.pal-head {
    cursor: default; color: var(--muted); font-size: calc(11px * var(--text-scale)); letter-spacing: .02em;
    border-top: var(--border) solid var(--line); margin-top: .2rem; padding-top: .3rem;
  }
  #palette-list li.pal-head:hover { background: none; }
  #palette-list li.pal-hit { flex-direction: column; align-items: stretch; gap: 0; padding-top: .15rem; padding-bottom: .2rem; }
  #palette-list li.pal-hit .pal-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
  #palette-list li.pal-hit .pal-snip {
    color: var(--muted); font-size: calc(11.5px * var(--text-scale)); line-height: 1.45;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  #palette-list li.outside .pal-snip { opacity: .55; }
  #palette-list mark { background: none; color: var(--accent); font-weight: var(--weight-strong); }
  #palette-list li.empty, #palette .hint { color: var(--muted); font-size: calc(.75rem * var(--text-scale)); }
  #palette-list li.empty { padding: .3rem .8rem; cursor: default; }
  #palette .hint { padding: .35rem .8rem; border-top: var(--border) solid var(--line); }
  #cheats { width: 46rem; max-width: calc(100vw - 2rem); padding: .9rem 1.1rem 1rem; }
  #cheats h2 { font-size: calc(.95rem * var(--text-scale)); margin: 0 0 .7rem; }
  #cheats h2 .cheats-more { margin-left: .3rem; color: var(--muted); font-weight: normal; font-size: calc(.75rem * var(--text-scale)); }
  #cheats .cheats-scroll { max-height: 70vh; overflow: auto; }
  /* AGS-28: the key map — the `?` sheet and Settings → Keyboard draw the
     same table (src/keys.rs's KeyTable). */
  table.keymap { border-collapse: collapse; width: 100%; font-size: calc(.82rem * var(--text-scale)); }
  table.keymap th[scope=rowgroup] {
    text-align: left; vertical-align: top; color: var(--accent); font-weight: var(--weight-strong);
    padding: .45rem .8rem .2rem 0; white-space: nowrap; font-size: calc(.75rem * var(--text-scale));
  }
  table.keymap tbody + tbody tr:first-child > * { border-top: var(--border) solid var(--line); }
  table.keymap td { padding: .2rem .8rem .2rem 0; vertical-align: top; }
  table.keymap tr:first-child td { padding-top: .45rem; }
  table.keymap td.k { width: 12rem; }
  table.keymap td.k kbd { display: inline-block; white-space: nowrap; margin-bottom: .15rem; }
  table.keymap td.does { color: var(--ink); }
  table.keymap td.where { width: 10rem; color: var(--muted); font-size: calc(.75rem * var(--text-scale)); }
  table.keymap kbd, #settings-keyboard p.now kbd {
    font-family: var(--mono); font-size: calc(11px * var(--text-scale)); color: var(--chip-fg);
    background: var(--chip-bg); border: var(--border) solid var(--chip-line);
    border-radius: var(--radius-md); padding: 0 5px; margin-right: .25rem;
  }
  p.keys-none { color: var(--muted); font-size: calc(.8rem * var(--text-scale)); }
  #settings input#keys-search {
    width: 100%; max-width: 26rem; font: inherit; font-size: calc(.85rem * var(--text-scale)); color: var(--ink);
    background: var(--card); border: var(--border) solid var(--line); border-radius: var(--radius); padding: .25rem .5rem;
    margin-bottom: .5rem;
  }
  #settings input#keys-search:focus { border-color: var(--accent); outline: none; }
  #settings-keyboard #keys-table { overflow-x: auto; }
  #cheats .close {
    margin-top: .9rem; font: inherit; font-size: calc(.8rem * var(--text-scale)); cursor: pointer;
    background: var(--panel); border: var(--border) solid var(--line); color: var(--muted);
    border-radius: var(--radius); padding: .1rem .5rem;
  }
  #cheats .close:hover { color: var(--accent); border-color: var(--accent); }

  /* AGS-14: mermaid placeholders → diagrams. The renderer picks its
     theme from body's computed background (light → mermaid `default`). */
  .md .mermaid {
    background: var(--panel); border: var(--border) solid var(--line); border-radius: var(--radius);
    padding: .6rem .8rem; margin: .5rem 0; overflow-x: auto;
  }
  .md .mermaid pre { margin: 0; padding: 0; background: none; border: 0; }
  .md .mermaid[data-state="rendering"] pre { color: var(--muted); }
  .md .mermaid[data-state="done"] svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .md .mermaid[data-state="error"] { border-color: var(--err-fg); }
  .md .mermaid .mermaid-error {
    color: var(--err-fg); margin: 0 0 .6rem; white-space: pre-wrap; font-size: calc(.85rem * var(--text-scale));
  }
  /* AGS-16: the ticket menu — manifest's menu idiom on the palette's
     tokens: a bordered, shadowed card at the cursor; items are real
     links/buttons whose hover and keyboard focus paint the same way. The
     status list opens inline under "Set status"; each row shows the
     status as its chip, the current one marked. FILTER-22: the tag menu
     (Filter · Add · Build a filter from) wears the same face. */
  #tmenu, #tagmenu {
    position: fixed; z-index: 1000; min-width: 230px; max-width: 360px;
    max-height: calc(100vh - 8px); overflow: auto; padding: 4px;
    background: var(--bg); color: var(--ink); border: var(--border) solid var(--line);
    border-radius: var(--radius-xl); box-shadow: 0 10px 30px var(--shadow);
    font: calc(12.5px * var(--text-scale))/1.5 var(--mono); user-select: none; outline: none;
  }
  #tmenu .h, #tagmenu .h {
    display: flex; align-items: baseline; gap: 6px; padding: 4px 10px 6px;
    border-bottom: var(--border) solid var(--line); margin-bottom: 4px; white-space: nowrap;
  }
  #tmenu .h .title, #tagmenu .h .title { overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  #tmenu .h .tag, #tagmenu .h .tag { flex: none; font-size: calc(10px * var(--text-scale)); padding: 0 5px; border-radius: var(--radius-lg); }
  #tmenu .item, #tagmenu .item {
    display: block; width: 100%; text-align: left; padding: 4px 10px;
    border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink);
    cursor: pointer; font: inherit; text-decoration: none; white-space: nowrap;
  }
  #tmenu .item:hover, #tmenu .item:focus, #tagmenu .item:hover, #tagmenu .item:focus {
    background: var(--hover); color: var(--accent); outline: none;
  }
  #tmenu .item .arrow { color: var(--muted); }
  #tmenu .sub { border-top: var(--border) solid var(--line); margin-top: 4px; padding-top: 4px; }
  #tmenu .sub .item { padding-left: 14px; }
  #tmenu .sub .mark { display: inline-block; width: 1.4em; color: var(--live); }
  #tmenu .sub .st { padding: 0 5px; border-radius: var(--radius-lg); font-size: calc(11px * var(--text-scale)); }
  /* ACT-10: a value chip's own chooser, flat and first — a submenu's items
     without its head or its indent. */
  #tmenu .flat .mark { display: inline-block; width: 1.4em; color: var(--live); }
  #tmenu .flat .st { padding: 0 5px; border-radius: var(--radius-lg); font-size: calc(11px * var(--text-scale)); }
  /* ACT-7: the Nav ▸ items' separators. */
  #tmenu .rule, #tagmenu .rule { border-top: var(--border) solid var(--line); margin: 4px 6px; }
  /* ACT-4: the one menu — Delete… in the error colour; a form (a ticket
     picker, Rename…, Link commits…, Add a label…) in the items' place. */
  #tmenu .item.danger { color: var(--err-fg); }
  #tmenu .item.back { color: var(--muted); }
  #tmenu .mform-row { display: flex; gap: 4px; padding: 2px 6px 4px; }
  #tmenu .mfield {
    flex: 1; min-width: 12rem; font: inherit; padding: 2px 6px; color: var(--ink); background: var(--bg);
    border: var(--border) solid var(--line); border-radius: var(--radius-md); outline: none; user-select: text;
  }
  #tmenu .mfield:focus { border-color: var(--accent); }
  #tmenu .mgo {
    font: inherit; padding: 0 8px; cursor: pointer; color: var(--ink); background: transparent;
    border: var(--border) solid var(--line); border-radius: var(--radius-md);
  }

  /* COMMENT-3: the ticket page's count of its open comments. */

  /* APP-22: a ticket page's Conversation — its comments, oldest first, then a box

  /* ── DESIGN-38: the shell in the grammar (DESIGN-34's first screen, the
     landing page's family): a bar with the carpet wordmark and the live
     mark, mono uppercase small labels, the board a ruled table whose
     statuses are cells, rows that invert to ink under the cursor, the nav's
     carpet pip, a faint 48px grid under the content column. Everything
     paints through the contract's tokens (or a color-mix of them), so light,
     dark and every theme follow; these rules restyle, the markup and its
     ids stay. ── */
  /* The carpet (src/carpet.rs): each cell a status of the lifecycle, in
     order, the accent last — the landing page's `.mark`. */
  .carpet { display: block; flex: none; overflow: visible; }
  .carpet .c1 { fill: var(--st-epic-fg); }
  .carpet .c2 { fill: var(--st-pending-fg); }
  .carpet .c3 { fill: var(--st-ready-fg); }
  .carpet .c4 { fill: var(--st-coding-fg); }
  .carpet .c6 { fill: var(--st-in-review-fg); }
  .carpet .c7 { fill: var(--st-complete-fg); }
  .carpet .c8 { fill: var(--st-ready-fg); }
  .carpet .c9 { fill: var(--accent); }
  /* The bar: the panel's ground, one line of 48px, everything centred. */
  header {
    align-items: center; gap: .35rem .9rem; min-height: 48px; padding: .4rem 1rem;
    background: var(--panel);
  }
  header h1 { font-family: var(--font-display); font-size: calc(16px * var(--text-scale)); letter-spacing: -.02em; line-height: 1; }
  header h1 a.wordmark { display: inline-flex; align-items: center; gap: 9px; }
  header .carpet.mark { width: 16px; height: 16px; }
  header .hlink {
    font-family: var(--mono); font-size: calc(11px * var(--text-scale)); line-height: 1.6; white-space: nowrap;
    text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
  }
  header .hlink[aria-current] { color: var(--ink); }
  header .hlink:hover { color: var(--accent); }
  /* A count is a filled chip (the inputs' and Needs you's alike). */
  header .hlink .hbadge {
    margin-left: .45rem; padding: 0 6px; border-radius: var(--radius-sm); letter-spacing: 0;
    font-family: var(--mono); font-size: calc(10.5px * var(--text-scale)); font-variant-numeric: tabular-nums; vertical-align: 0;
  }
  /* The health line is the page's crumb: the version and the count, then
     the page's name in the accent. */
  #health { font-family: var(--mono); font-size: calc(11.5px * var(--text-scale)); font-variant-numeric: tabular-nums; }
  #health .tag { color: var(--accent); }
  #health .tag::before { content: "·"; color: var(--muted); margin: 0 .6em; }  header #who, header .theme, header .hbtn, header .nav-reveal, header button.fbtn {
    font-family: var(--mono); font-size: calc(11px * var(--text-scale));
  }
  /* The right of the bar: the global filter, then who, the live mark and
     the buttons, each group pushed right — so when the column is too narrow
     for one line (the app's bar holds more than the mock's), the second
     line is the right-hand group, flush right. */
  header button.fbtn { margin-left: auto; }
  header #conn, header #who { margin-left: auto; }
  header #who + #conn { margin-left: .2rem; }
  header .hbtn, header .theme, header .nav-reveal { border-radius: var(--radius-sm); padding: 1px 7px; text-transform: lowercase; background: var(--card); }
  /* The live mark: a cell in the connection's colour, pulsing while live. */
  #conn {
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    font-family: var(--mono); font-size: calc(11.5px * var(--text-scale));
  }
  #conn .cell { flex: none; width: 8px; height: 8px; border-radius: var(--radius-xs); background: currentColor; }
  #conn.live .cell { animation: menger-pulse 2.4s ease-in-out infinite; }
  @keyframes menger-pulse { 50% { opacity: .4; } }
  /* The grid: faint 48px rules under the content column, in the ink. */
  #app .content {
    background-image:
      linear-gradient(color-mix(in srgb, var(--ink) 5%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--ink) 5%, transparent) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  /* The board: a ruled table on the card's ground — heads mono uppercase on
     the panel, a hairline under every row, ids in the accent, kinds in their
     colours, the status a cell of one width, tabular numbers throughout. One
     line per row still (MFE-12): the cell's height is pinned. */
  table.board {
    background: var(--card); border: var(--border) solid color-mix(in srgb, var(--muted) 40%, var(--line));
    font-size: calc(12.5px * var(--text-scale)); font-variant-numeric: tabular-nums;
  }

    font-family: var(--mono); font-size: calc(10.5px * var(--text-scale)); font-weight: var(--weight-medium);
    letter-spacing: .12em; text-transform: uppercase; color: var(--muted); background: var(--panel);
    padding: 8px 12px; border-bottom: var(--border) solid color-mix(in srgb, var(--muted) 40%, var(--line));
  }
  tbody#board td { padding: 8px 12px; transition: background-color var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease); }
  tbody#board tr[data-ticket-id] td:nth-child(2) { font-family: var(--sans); font-size: calc(13.5px * var(--text-scale)); }
  tbody#board td.id { font-weight: var(--weight-medium); }

  tbody#board td.kind[data-kind="spike"] { color: var(--kind-spike); }
  tbody#board select.status, tbody#board span.status.chip {

    width: 8.6em; height: 1.25rem; line-height: calc(1.25rem - 2px); padding: 0 6px;
    border: var(--border) solid transparent; border-radius: var(--radius-sm);
    font-family: var(--mono); font-size: calc(10.5px * var(--text-scale)); letter-spacing: .04em; text-transform: uppercase;
    text-align: center; text-align-last: center;

  tbody#board tr.picked td:first-child { box-shadow: inset 2px 0 var(--accent); }

  tbody#board tr[data-ticket-id]:hover td { background: var(--ink); color: var(--bg); }

  /* The nav: its head as tall as the bar, in the bar's small mono voice; the
     carpet pip beside the view switch; the same status cells; rows that
     invert (the open row keeps its tint and bar). */
  #nav .brand {
    align-items: center; min-height: 48px; padding: 0 12px 0 14px;
    font-family: var(--mono); font-size: calc(11px * var(--text-scale)); font-weight: var(--weight-medium);
    letter-spacing: .12em; text-transform: uppercase;
  }
  #nav .carpet.pip { width: 16px; height: 16px; margin-left: auto; transform-origin: 50% 50%; animation: menger-breathe 4s ease-in-out infinite; }
  @keyframes menger-breathe { 50% { transform: scale(1.06); } }
  #nav .pip + .nview { margin-left: 10px; }
  #nav .nview-b { letter-spacing: 0; text-transform: lowercase; }
  #nav .tag {
    width: 7.4em; font-family: var(--mono); letter-spacing: .03em; text-transform: uppercase;
    border-radius: var(--radius-sm); font-variant-numeric: tabular-nums;
  }
  /* A roll-up is a count, not a status: narrow, ruled, quiet. */
  #nav .tag.roll { width: 4.2em; background: transparent; color: var(--muted); border-color: var(--line); }
  /* Ids are the accent's words, as on the board — no chip. */
  #nav .code { background: transparent; border-color: transparent; padding: 0; color: var(--accent); font-weight: var(--weight-medium); letter-spacing: 0; }
  #nav .row { transition: background-color var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease); }
  #nav .row:not(.sel):not(.pending):hover { background: var(--ink); color: var(--bg); }
  #nav .row:not(.sel):not(.pending):hover :is(.toggle, .label, .code, .tag.roll) { color: var(--bg); }
  #nav .row:not(.sel):not(.pending):hover .prefix { color: color-mix(in srgb, var(--bg) 55%, transparent); }
  /* ── LOOK-2: the shell as ARCHIVE-5's mockup draws it (figures 1–3 and 6)
     — the bar's lower-case words, the small bordered tools, the nav's 24px
     rows, the status as a sentence-case cell, menus and dialogs as cards on
     the stronger hairline, the toast and the selection bar in ink. The
     mockup's `--line-2` is the contract's `--tree-line`, its `--accent-ink`
     is `--bg`; everything here is a token or a color-mix of tokens. These
     rules restyle; no id, route or behaviour moves. ── */
  /* The bar: the words lower case, quiet, 18px apart; the page's own word in ink. */
  header { gap: .35rem 18px; }
  header .hlink {
    font-size: calc(12px * var(--text-scale)); text-transform: none; letter-spacing: 0; line-height: 1.5;
  }
  header .hlink:hover { color: var(--ink); }
  header .hlink[aria-current] { color: var(--ink); }
  /* A count: a filled cell in the accent, square-cornered; quiet at 0. */
  header .hlink .hbadge {
    margin-left: 6px; padding: 0 6px; border-radius: var(--radius-sm); line-height: 1.5;
    font-size: calc(11px * var(--text-scale)); font-weight: var(--weight-strong); vertical-align: 0;
    background: var(--accent); color: var(--bg); border: 0;
  }
  header .hlink .hbadge.zero { background: transparent; color: var(--muted); font-weight: var(--weight-normal); box-shadow: inset 0 0 0 var(--border) var(--line); }
  /* The right of the bar: the live mark, then plain words for annotate and

  header .hbtn, header .theme {

    font-size: calc(11.5px * var(--text-scale)); line-height: 1.5; padding: 1px 6px; border-radius: var(--radius-sm); text-transform: lowercase;
  }
  header .hbtn:hover, header .theme:hover { color: var(--ink); border-color: var(--tree-line); }
  header .hbtn.on { color: var(--accent); border-color: var(--accent); background: var(--sel); }
  header .nav-reveal { background: var(--card); border-color: var(--tree-line); color: var(--ink); }
  /* The tools: every Filter and Saved button, the mockup's `.tool` — 11px

  button.fbtn, header button.fbtn {
    font-size: calc(11px * var(--text-scale)); line-height: 1.5; padding: 2px 8px; gap: 5px;
    background: var(--card); color: var(--ink); border: var(--border) solid var(--tree-line); border-radius: var(--radius);
    text-transform: lowercase;

  button.fbtn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); background: var(--sel); }
  button.fbtn .fbadge { border-radius: var(--radius-sm); }
  .fbar .pill, .bempty .pill { font-size: calc(11px * var(--text-scale)); line-height: 1.6; border-color: var(--tree-line); border-radius: var(--radius); }
  .fbar .pill > *, .bempty .pill > * { border-left-color: var(--line); }
  /* The page's crumb and its gutters: 16px over 28px, the content's whole width. */
  main { padding: calc(16px * var(--space)) calc(28px * var(--space)) calc(40px * var(--space)); }
  #health { margin-bottom: 14px; }
  .bbar { margin-bottom: 14px; }
  /* The nav: its head the bar's quiet small words, its rows 24px. */
  #nav .brand {
    font-size: calc(11.5px * var(--text-scale)); text-transform: lowercase; letter-spacing: 0;
    font-weight: var(--weight-medium); color: var(--ink);
  }
  #nav .nview { border-color: var(--tree-line); border-radius: var(--radius); }

  #nav .nview-b[aria-pressed="true"] { background: var(--sel); color: var(--accent); font-weight: var(--weight-normal); }
  #nav .nav-hide { background: var(--card); border-color: var(--tree-line); line-height: 1.5; }
  #nav .nbar { padding: 0 12px 12px; border-bottom: var(--border) solid var(--line); }
  #nav .tree { padding: 6px 0; font-size: calc(12px * var(--text-scale)); line-height: 1.5; }
  #nav .row { height: 24px; gap: 6px; padding: 0 10px 0 8px; }
  #nav .row.sel { box-shadow: inset 2px 0 0 var(--accent); border-radius: 0; }

  /* The status cell: one width, sentence case — the word as the server says it. */
  #nav .tag, tbody#board select.status, tbody#board span.status.chip, #palette-list li .tag {

  #nav .tag { line-height: 1.6; padding: 0 4px; }
  /* A roll-up is a count in a ruled box, as wide as its digits. */
  #nav .tag.roll {

    color: var(--muted); background: transparent; border-color: var(--line); letter-spacing: 0;

  table.board { border-color: var(--tree-line); border-radius: var(--radius); }
  table.board th { border-bottom-color: var(--tree-line); }
  tbody#board td { padding: 7px 12px; }
  tbody#board td.id { font-weight: var(--weight-medium); }
  tbody#board tr.picked td { background: var(--sel); }

  #tmenu, #tagmenu, .fmenu {
