<!-- MFE-9: the app's data plane is the Plexus WebSocket, not the REST
     bridge, and a page served from disk cannot know which port that is.
     menger's shell substitutes the placeholder when it serves this file
     (src/shell.rs), the same way it always has for web/index.html; served
     by anything else, the app falls back to menger's default WS port. -->
<meta name="menger-ws-port" content="{{WS_PORT}}">
<link data-trunk rel="rust" />
<!-- AGS-14: the vendored mermaid bundle rides into dist/vendor/ as a served
     file only. Deliberately NOT a <script> here: src/mermaid.rs injects one
     the first time a rendered body holds a mermaid fence. -->
<link data-trunk rel="copy-file" href="vendor/mermaid/mermaid-11.17.2.min.js" data-target-path="vendor" />
<!-- MENGER-22: the vendored highlighter, the same way: a served file only;
     src/highlight.rs injects a <script> the first time a page holds code. -->
<link data-trunk rel="copy-file" href="vendor/highlight/highlight-11.11.1.min.js" data-target-path="vendor" />
<!-- COMP-4: the SDK shell a framed body runs (src/frame.rs inlines it into
     each frame's srcdoc); served at /app/sdk/ as the app's published copy. -->
<link data-trunk rel="copy-file" href="sdk/menger-sdk.js" data-target-path="sdk" />
<!-- COMP-10: the SDK's types — menger.d.ts and the declarations of the client
     generated into sdk/generated/ (scripts/sdk-codegen.sh), which it imports —
     published beside it for whoever writes a component. -->
<link data-trunk rel="copy-file" href="sdk/menger.d.ts" data-target-path="sdk" />
<link data-trunk rel="copy-dir" href="sdk/generated" data-target-path="sdk/generated" />
<!-- DESIGN-38: menger's faces, Geist and Geist Mono (OFL, latin, variable
     100–900; fonts/OFL.txt), self-hosted at /app/fonts/ — the token
     contract's face defaults name them; nothing is fetched from elsewhere. -->

<!-- AGS-17: stamp a stored theme choice before first paint, so a reload
     never flashes the system theme; src/theme.rs owns the key and
     re-applies it once mounted (a native test pins the two agree). -->
<script>try{var t=localStorage.getItem("menger.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}try{var s=localStorage.getItem("menger.themes.site");if(s)document.documentElement.style.cssText=s}catch(e){}</script>

  /* The status table (pinned, AGS-15): a chip wears its status as colour —
     its pair from the contract's colour.status (`--st-<status>-bg/-fg`), so
     dark needs no second table — plus weight (Blocked is bold) and
     decoration (the struck-through Superseded and Canceled). The single
     paint rule after it is what every host applies wherever a status
     appears (nav tag, board control, ticket page, blockers pills); the word
     stays in the chip. The extra selectors in the paint rule only out-rank
     the hosts' own base rules (`#nav .tag`, `select.status { font: inherit

    display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem;
    padding: .75rem 1.25rem; border-bottom: var(--border) solid var(--line);

  #no-access h2 { margin: 0 0 .75rem; }
  #no-access .id code { font-size: calc(.9rem * var(--text-scale)); overflow-wrap: anywhere; }

  #members .waiting code, #members td code { font-size: calc(.8rem * var(--text-scale)); overflow-wrap: anywhere; }
  #members input, #members select { font: inherit; padding: .2rem .45rem; background: var(--card); color: var(--ink);
    border: var(--border) solid var(--line); border-radius: var(--radius); }
  #members input.scope, #members #grant-scope { width: 9rem; }
  #members #grant-principal { flex: 1 1 18rem; }
  #members table { border-collapse: collapse; width: 100%; font-size: calc(.85rem * var(--text-scale)); }
  #members th { text-align: left; color: var(--muted); font-weight: var(--weight-medium); padding: .3rem .5rem; border-bottom: var(--border) solid var(--line); }
  #members td { padding: .35rem .5rem; border-bottom: var(--border) solid var(--line); }
  #members td:nth-child(2) code, #members td:nth-child(3) { white-space: nowrap; }
  #members button.primary { border: var(--border) solid var(--accent); color: var(--accent); background: var(--card); border-radius: var(--radius); padding: .2rem .6rem; }
  #members button.link { background: none; border: 0; color: var(--accent); cursor: pointer; }
  #members .line { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  #settings ul.grants { list-style: none; margin: 0; padding: 0; }
  /* IDENTITY-15: who this connection is, just before its state. */
  header #who { margin-left: auto; }
  header #who + #conn { margin-left: .6rem; }
  header #who.signed-in { color: var(--ink); }
  #conn.live { color: var(--live); }
  #conn.reconnecting { color: var(--err-fg); }
  /* AGS-17: the theme toggle — a header control in the nav-reveal's
     idiom; its text names the current choice (system / light / dark). */
  header .theme {
    background: var(--bg); border: var(--border) solid var(--line); color: var(--muted);
    font: inherit; font-size: calc(11px * var(--text-scale)); line-height: 1.3; padding: 0 6px;
    border-radius: var(--radius); cursor: pointer; white-space: nowrap;
  }
  header .theme:hover { color: var(--accent); border-color: var(--accent); }
  /* MFE-21: the app talks to a backend other than this page's server (an
     override from #/settings) — the status names it, highlighted, on every
     page; its color still says the state. */
  #conn.override {
    background: var(--sel); border: var(--border) solid var(--accent); border-radius: var(--radius);
    padding: 0 .45rem; font-weight: var(--weight-strong); overflow-wrap: anywhere;
  }
  /* MFE-21: #/settings — a group per concern (Backend first) in the panel
     idiom: a label column and a control column, one column when the
     content column is narrow (it is the query container). */
  #settings { max-width: 52rem; }
  #settings h2 { font-size: calc(1rem * var(--text-scale)); margin: 0 0 .75rem; }
  #settings fieldset.group {
    background: var(--panel); border: var(--border) solid var(--line); border-radius: var(--radius-xl);
    margin: 0 0 1rem; padding: .5rem 1rem 1rem; min-width: 0;
  }
  #settings legend {
    padding: 0 .4rem; font-family: var(--sans); font-size: calc(11px * var(--text-scale)); font-weight: var(--weight-strong);
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  }
  #settings p.now { margin: .25rem 0 .9rem; color: var(--muted); font-size: calc(.8rem * var(--text-scale)); overflow-wrap: anywhere; }
  #settings p.now code { color: var(--ink); }
  #settings .field { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: .4rem 1rem; align-items: baseline; }
  #settings label { font-size: calc(.85rem * var(--text-scale)); }
  #settings .control { min-width: 0; }
  #settings .line { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
  #settings input#ws-url, #settings input#test-url {
    flex: 1 1 16rem; min-width: 0; font: inherit; padding: .25rem .5rem;
    background: var(--card); color: var(--ink); border: var(--border) solid var(--line); border-radius: var(--radius); outline: none;
  }
  #settings input#ws-url:focus, #settings input#test-url:focus { border-color: var(--accent); }
  #settings input#ws-url[aria-invalid="true"], #settings input#test-url[aria-invalid="true"] { border-color: var(--err-fg); }
  #settings button {
    font: inherit; font-size: calc(.8rem * var(--text-scale)); padding: .1rem .65rem; cursor: pointer;
    background: var(--card); color: var(--ink); border: var(--border) solid var(--line); border-radius: var(--radius);
  }
  #settings button:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  #settings button:disabled { color: var(--muted); cursor: default; opacity: .65; }
  #settings button.primary:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  #settings button.link { background: none; border: 0; padding: 0; color: var(--accent); }
  #settings button.link:disabled { color: var(--muted); }
  #settings button.link:hover:not(:disabled) { text-decoration: underline; }
  #settings p.status { margin: .35rem 0 .6rem; font-size: calc(.8rem * var(--text-scale)); min-height: 1.5em; overflow-wrap: anywhere; }
  #settings .hint, #settings .probe.testing { color: var(--muted); }
  #settings .probe.ok { color: var(--live); }
  #settings .probe.failed, #settings .invalid { color: var(--err-fg); }
  #settings p.invalid { margin: .5rem 0 0; font-size: calc(.8rem * var(--text-scale)); }
  #settings .recent {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .6rem;
    margin-top: .9rem; padding-top: .6rem; border-top: var(--border) solid var(--line); font-size: calc(.8rem * var(--text-scale));
  }
  #settings .recent .lbl { color: var(--muted); }
  #settings .recent ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .25rem .9rem; }
  #settings .recent button.fill {
    background: none; border: 0; padding: 0; font-size: calc(.8rem * var(--text-scale)); color: var(--accent); overflow-wrap: anywhere;
  }
  #settings .recent button.fill:hover { text-decoration: underline; }
  @container (max-width: 36rem) {
    #settings .field { grid-template-columns: minmax(0, 1fr); }
  }
  main { padding: calc(1rem * var(--space)) calc(1.25rem * var(--space)); max-width: 72rem; margin: 0 auto; }
  #health { color: var(--muted); font-size: calc(.8rem * var(--text-scale)); margin-bottom: 1rem; }
  #error {
    display: flex; align-items: baseline; gap: 1rem;
    background: var(--err-bg); color: var(--err-fg); border: var(--border) solid var(--err-line);
    border-left-width: 4px; border-radius: var(--radius-lg);
    padding: .5rem .75rem; margin-bottom: 1rem; font-size: calc(.85rem * var(--text-scale));
  }
  #error button {
    margin-left: auto; background: none; border: var(--border) solid var(--err-line);
    color: inherit; font: inherit; font-size: calc(.8rem * var(--text-scale)); border-radius: var(--radius);
    padding: 0 .5rem; cursor: pointer;
  }
  /* The board's status control is the chip: it wears the row's status
     (class st-<status>, kept in step with the ticket) and lists the
     vocabulary in each option's own colors. */
  select.status {
    background: var(--card); color: var(--ink);
    border: var(--border) solid var(--line); border-radius: var(--radius-lg);
    font: inherit; font-size: calc(.85rem * var(--text-scale)); padding: .1rem .3rem;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: var(--border) solid var(--line); }
  th { color: var(--muted); font-weight: var(--weight-medium); font-size: calc(.8rem * var(--text-scale)); }
  td.id { color: var(--accent); white-space: nowrap; }
  /* MFE-12: the board mounts a window of rows between two spacers sized
     at the row pitch, so every row is exactly one line: fixed columns, and
     a cell that does not fit ends in an ellipsis (the title and blocked-by
     cells carry their whole text as a tooltip). Fixed columns also keep
     the widths still as the window slides — under auto layout they would
     follow whichever rows happen to be mounted. */
  table.board { table-layout: fixed; }
  table.board th.c-id { width: 11rem; }
  table.board th.c-kind { width: 6.5rem; }
  /* DEPLOY-13: the status, then a mark per environment the work runs in. */
  table.board th.c-status { width: 13rem; }
  table.board th.c-sev { width: 6.5rem; }
  table.board th.c-blk { width: 10rem; }
  tbody#board td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tbody#board tr.spacer td { padding: 0; border: 0; }
  /* SCALE-26: rows the window has reached before their page has come — a
     stretch of them is one muted line band at the row pitch, so nothing
     moves when the rows land in its place. */
  tbody#board tr.pending td { padding: 0 .6rem; border: 0; color: var(--muted); vertical-align: top; }
  tbody#board.scaled { overflow-anchor: none; }
  /* The status control is the tallest thing in a row, and its natural
     height follows the face it is set in — Blocked's bold one is 4px
     taller — so its box is pinned: every row the same pitch. */
  tbody#board select.status { height: 1.5rem; }
  /* SDLC-11: a doc has no lifecycle, so its status is no control — a
     neutral chip (the st-doc row) in the control's place, the control's
     box, so the row keeps the board's pitch. */
  span.status.chip {
    display: inline-block; box-sizing: border-box; border: var(--border) solid var(--line);
    border-radius: var(--radius-lg); font-size: calc(.85rem * var(--text-scale)); padding: 0 .4rem;
  }
  tbody#board span.status.chip { height: 1.5rem; line-height: calc(1.5rem - 2px); }
  /* AGS-20: a board row that decomposes says so (no parent column). */
  td.id .haskids {
    margin-left: .35rem; font-size: calc(10.5px * var(--text-scale)); color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  td.status { white-space: nowrap; }

  /* MFE-7: universal click-through + the ticket page. */
  header h1 a { color: inherit; text-decoration: none; }
  tbody#board tr[data-ticket-id] { cursor: pointer; }
  /* MENGER-13: done with — complete, superseded, canceled (a canceled
     subtree with it): the title quieter, the status chip says which. */
  tbody#board tr.done td:nth-child(2) { color: var(--muted); }
  tbody#board tr[data-ticket-id]:hover td { background: var(--hover); }
  /* ACT-3: a selected board row — the nav's tint. */
  tbody#board tr.picked td { background: var(--sel); }
  td.id a { color: inherit; text-decoration: none; }
  td.id a:hover { text-decoration: underline; }
  #ticket-page .crumbs { margin: 0 0 .75rem; }
  #ticket-page .crumbs a { color: var(--muted); text-decoration: none; }
  #ticket-page .crumbs a:hover { color: var(--accent); }
  /* AGS-20: the ancestor chain, root first, after the board crumb. */
  #ticket-page .crumbs .sep { color: var(--muted); }
  #ticket-page .crumbs .crumb { font-family: var(--mono); font-size: calc(12.5px * var(--text-scale)); }
  /* MFE-24 (owner, 2026-10-09: "I want the full screen width to be
     usable"): the ticket page is one column at every width — the form
     AGS-22 gave it under 840px, now the only one. The crumb, the title, the
     properties as a band, then the body and the children, each as wide as
     the content column: no side column, and no cap on the page or the body
     (rules below). The article gives up its box so its title and its body
     can sit either side of the band; every selector into it still matches. */
  #ticket-page { display: flex; flex-direction: column; }
  #ticket-page article.ticket { display: contents; }
  #ticket-page article.ticket > * { order: 3; }
  #ticket-page article.ticket > h2 { order: 1; }
  main:has(#ticket-page) { max-width: none; }
  #ticket-page .md, #ticket-page .mframe { max-width: none; }
  /* The band: label/value pairs in a wrapping row, the stamps on one line,
     the relations side by side; a hairline under it all. */
  #ticket-page aside.props {
    order: 2; min-width: 0; padding: 0 0 .9rem; margin-bottom: 1.25rem;
    border-bottom: var(--border) solid var(--line);
    font-family: var(--sans); font-size: calc(13px * var(--text-scale)); line-height: 1.5;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 2rem;
  }
  #ticket-page aside.props dl.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem 1.5rem; }
  #ticket-page aside.props dl.meta div { display: flex; align-items: baseline; gap: .45rem; min-width: 0; }
  #ticket-page aside.props .stamps {
    flex-direction: row; flex-wrap: wrap; gap: 0 1rem; margin: 0; padding: 0; border: 0;
  }
  #ticket-page aside.props section.dag {
    flex: 1 1 100%; margin: 0; padding-top: .2rem; border-top: var(--border) solid var(--line);
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: column;
    grid-template-rows: auto auto; column-gap: 2rem;
  }
  #ticket-page aside.props section.dag.empty { display: none; }
  #ticket-page aside.props section.dag h3 { margin-top: .5rem; }
  #ticket-page #notfound, #ticket-page .loading { order: 4; }
  /* MENGER-22: highlighted code (src/highlight.rs) — highlight.js's classes
     in the --code-* tokens; diffs in the house's live and error inks. A
     theme or the toggle recolours them with no parse again. A comment's
     fences (src/highlight.rs CommentText) are blocks like a body's. */
  .hljs-keyword, .hljs-selector-tag, .hljs-doctag, .hljs-section { color: var(--code-keyword); }
  .hljs-string, .hljs-regexp, .hljs-symbol, .hljs-char { color: var(--code-string); }
  .hljs-comment, .hljs-quote { color: var(--code-comment); font-style: italic; }
  .hljs-number, .hljs-literal { color: var(--code-number); }
  .hljs-title, .hljs-name { color: var(--code-title); }
  .hljs-type, .hljs-title.class_, .hljs-title.class_.inherited__ { color: var(--code-type); }
  .hljs-meta, .hljs-meta .hljs-keyword, .hljs-meta .hljs-string { color: var(--code-meta); }
  .hljs-built_in { color: var(--code-builtin); }
  .hljs-attr, .hljs-attribute, .hljs-property, .hljs-selector-class, .hljs-selector-id,
  .hljs-selector-attr, .hljs-selector-pseudo { color: var(--code-attr); }
  .hljs-variable, .hljs-template-variable, .hljs-params { color: var(--code-variable); }
  .hljs-addition { color: var(--live); }
  .hljs-deletion { color: var(--err-fg); }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: var(--weight-strong); }
  .ctext pre.ccode {
    font-family: var(--mono); font-size: calc(12.5px * var(--text-scale)); background: var(--panel); border: var(--border) solid var(--line);
    border-radius: var(--radius); padding: .45rem .65rem; margin: .35rem 0; overflow-x: auto; white-space: pre;
  }
  /* THEME-8: a region wearing its own theme (src/scopes.rs) paints its own
     ground and ink; under one theme it is the page's as ever. */
  /* THEME-6: each region says its paper, ink and text again where its own tokens
     are — a face, a size or an ink inherits as a value, resolved on body with the
     site's, so a theme worn by the ticket view or a frame's box alone sets them too */
  #ticket-page, .mscope-frame { background: var(--bg); color: var(--ink); font: var(--text-size)/var(--text-leading) var(--font-text); }
  /* The house code chip (`#nav .code`'s face, rule below) wherever the
     page names an id or a shortcode; the page's chips set their own mono
     face, and a linked one lights up like every other link. */
  #ticket-page .code { font-family: var(--mono); text-decoration: none; }
  #ticket-page a.code:hover { color: var(--accent); border-color: var(--accent); }
  /* The title: the id as the chip, then the title in the sans face. The
     title wraps inside its own slot rather than dropping under the chip. */
  article.ticket h2 {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: .55rem;
    font-family: var(--font-display); font-size: calc(20px * var(--text-scale)); font-weight: var(--weight-strong);
    letter-spacing: -.01em; line-height: 1.3; margin: .1rem 0 1rem;
  }
  #ticket-page article.ticket h2 .code { flex: none; font-size: calc(11.5px * var(--text-scale)); padding: 1px 6px; }
  article.ticket h2 .t { flex: 1 1 14rem; min-width: 0; }
  /* The properties: a label/value grid. `display: contents` on each pair
     lifts its dt/dd into the grid, so the labels form one column. */
  dl.meta {
    display: grid; grid-template-columns: 6.5em minmax(0, 1fr);
    gap: .45rem .5rem; margin: 0; align-items: baseline;
  }
  dl.meta div { display: contents; }
  dl.meta dt { color: var(--muted); }
  dl.meta dd { margin: 0; min-width: 0; }
  /* The status chip: its face is the status table's (AGS-15). */
  dd.status {
    justify-self: start; border: 1px solid transparent; border-radius: var(--radius-lg);
    font-size: calc(11.5px * var(--text-scale)); padding: 0 .5rem;
  }
  dd.kind .glyph { margin-right: .4rem; }
  /* FILTER-22: the kind is a tag — as wide as its words, as the status is. */
  dd.kind { justify-self: start; }
  /* SDLC-9: the commits that finished the ticket — short, mono, in link order. */
  dd#t-commits { display: flex; flex-wrap: wrap; gap: 0 .6rem; }
  dd#t-commits .commit { font-family: var(--mono); font-size: calc(12px * var(--text-scale)); }
  /* The stamps: relative, the exact time (fmt_unix) on hover. */
  aside.props .stamps {
    display: flex; flex-direction: column; margin: .9rem 0 0; padding-top: .7rem;
    border-top: var(--border) solid var(--line); color: var(--muted); font-size: calc(11.5px * var(--text-scale));
  }
  aside.props .stamps span { width: max-content; }
  aside.props .stamps [title] { cursor: help; }
  /* The relations, under a hairline; a doc's (which it never has) not drawn. */
  aside.props section.dag { margin-top: .9rem; padding-top: .1rem; border-top: var(--border) solid var(--line); }
  aside.props section.dag.empty { display: none; }
  /* Section heads: the relations', and the Children header's. */
  aside.props h3, section.kidsec h3 {
    font-family: var(--sans); font-size: calc(11px * var(--text-scale)); font-weight: var(--weight-medium);
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    margin: .9rem 0 .35rem;
  }
  aside.props .none { margin: 0; font-size: calc(12px * var(--text-scale)); }
  /* AGS-20/22: the children, under the body, with the nav's roll-up. */
  section.kidsec { margin-top: 1.75rem; padding-top: .9rem; border-top: var(--border) solid var(--line); }
  section.kidsec h3 { display: flex; align-items: center; gap: .5rem; margin: 0 0 .4rem; }
  section.kidsec .roll {
    font-family: var(--mono); font-size: calc(10px * var(--text-scale)); letter-spacing: 0; text-transform: none;
    font-variant-numeric: tabular-nums; color: var(--chip-fg);
    background: var(--chip-bg); border: var(--border) solid var(--chip-line);
    border-radius: var(--radius-lg); padding: 0 5px;
  }
  section.kidsec .none, section.kidsec .loading { font-family: var(--sans); font-size: calc(13px * var(--text-scale)); margin: 0; }
  /* MENGER-13: the History — each transition a line: when · from → to ·
     who · source · why · caused by; the system's muted; when the log
     began, last, in a quiet line. */
  section.histsec { margin-top: 1.5rem; padding-top: .9rem; border-top: var(--border) solid var(--line); font-family: var(--sans); font-size: calc(13px * var(--text-scale)); }
  section.histsec h3, section.histsec h4 {
    font-family: var(--sans); font-size: calc(11px * var(--text-scale)); font-weight: var(--weight-medium);
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 .4rem;
  }
  section.histsec h4 { margin-top: .8rem; }
  section.histsec ol.transitions { list-style: none; margin: 0; padding: 0; }
  section.histsec li.tr {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: .22rem 0;
    border-bottom: var(--border) dashed var(--line);
  }
  section.histsec li.tr:last-child { border-bottom: 0; }
  section.histsec li.tr .at { color: var(--muted); font-size: calc(12px * var(--text-scale)); min-width: 4.5em; cursor: help; font-variant-numeric: tabular-nums; }
  section.histsec li.tr .move { display: inline-flex; align-items: baseline; gap: 5px; }
  section.histsec li.tr .move .status { font-size: calc(11px * var(--text-scale)); padding: 0 5px; border-radius: var(--radius); }
  section.histsec li.tr .born, section.histsec li.tr .fieldname { color: var(--muted); font-size: calc(12px * var(--text-scale)); font-style: italic; }
  section.histsec li.tr .kindword { font-family: var(--mono); font-size: calc(12px * var(--text-scale)); }
  section.histsec li.tr .arrow { color: var(--muted); }
  section.histsec li.tr .who { font-weight: var(--weight-medium); }
  section.histsec li.tr.system .who { font-weight: var(--weight-normal); color: var(--muted); font-style: italic; }
  section.histsec li.tr .src {
    font-family: var(--mono); font-size: calc(10px * var(--text-scale)); color: var(--chip-fg); background: var(--chip-bg);
    border: var(--border) solid var(--chip-line); border-radius: var(--radius-lg); padding: 0 5px; cursor: help;
  }
  section.histsec li.tr .msg { color: var(--fg, inherit); flex-basis: 100%; padding-left: 4.5em; font-size: calc(12.5px * var(--text-scale)); }
  section.histsec li.tr .cause { color: var(--muted); font-size: calc(12px * var(--text-scale)); }
  section.histsec li.tr a.code { font-family: var(--mono); font-size: calc(12px * var(--text-scale)); }
  section.histsec p.began, section.histsec p.since, section.histsec p.restorable, section.histsec p.none, section.histsec p.loading {
    margin: .6rem 0 0; color: var(--muted); font-size: calc(12px * var(--text-scale));
  }
  section.histsec p.restorable { color: inherit; }
  /* TICKETS-7: revisions in the History — a revision row (tick two to
     diff, its number opens it), the diff panel (unified or side by side;
     added on the Complete ground, removed on the failure's, changed words
     stronger), a version's banner, and Restore…'s preview. */
  h2 button.histjump {
    margin-left: auto; font-family: var(--sans); font-size: calc(11px * var(--text-scale)); color: var(--muted); background: var(--card);
    border: var(--border) solid var(--line); border-radius: var(--radius-pill); padding: 1px 9px; cursor: pointer; align-self: center;
  }
  h2 button.histjump:hover { color: var(--accent); border-color: var(--accent); }
  section.histsec li.tr.rev .pick { margin: 0; align-self: center; }
  section.histsec li.tr.rev button.revno {
    font-family: var(--mono); font-size: calc(11px * var(--text-scale)); min-width: 2.6em; color: var(--accent); background: none;
    border: var(--border) solid var(--line); border-radius: var(--radius); padding: 0 5px; cursor: pointer;
  }
  section.histsec li.tr.rev.current button.revno { color: var(--ink); cursor: default; }
  section.histsec li.tr.rev .what { color: var(--ink); }

  .version .revbanner {

  article.ticket > p.none, article.ticket > p.loading,

  /* Relation and child rows: kind glyph · code chip · title · status chip.

  #blockers, #unlocks, #children { list-style: none; margin: 0; padding: 0; }

  /* AGS-12: the persistent left nav — manifest's sidebar pattern. A
     full-height two-column grid: the nav column collapses (and the

  #app { display: grid; grid-template-columns: 360px minmax(0, 1fr); height: 100vh; }

  #app .content { min-width: 0; height: 100vh; overflow: auto; container-type: inline-size; }

    background: var(--panel); border-right: var(--border) solid var(--line);

    border-radius: var(--radius); cursor: pointer;

  #nav .tree { padding: 6px 0; font-family: var(--mono); font-size: calc(12.5px * var(--text-scale)); line-height: 1.55; white-space: nowrap; }

  #nav .toggle.clickable { cursor: pointer; }
  #nav .code, #tmenu .code, #tagmenu .code, #toast .code, #ticket-page .code {
    font-size: calc(10.5px * var(--text-scale)); font-weight: var(--weight-strong); letter-spacing: .02em; color: var(--chip-fg);
    background: var(--chip-bg); border: var(--border) solid var(--chip-line); border-radius: var(--radius-md);
    padding: 0 5px; white-space: nowrap;

  #nav .label { flex: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

    display: flex; align-items: flex-start; justify-content: center;

    box-shadow: 0 12px 40px var(--shadow); max-width: 100%; overflow: hidden;

  #palette { width: 44rem; display: flex; flex-direction: column; max-height: 68vh; }

  }

  #palette-list li .code {
    font-size: calc(10.5px * var(--text-scale)); font-weight: var(--weight-strong); letter-spacing: .02em; color: var(--chip-fg);
    background: var(--chip-bg); border: var(--border) solid var(--chip-line); border-radius: var(--radius-md);
    padding: 0 5px;
  }
  /* Layout only — the status chip's face comes from the status table. */
  #palette-list li .tag {
    flex: none; margin-left: auto; width: 6.5em; text-align: center; box-sizing: border-box;
    font-size: calc(10px * var(--text-scale)); padding: 0 5px; border-radius: var(--radius-lg);
  }
  #palette-list li .label { flex: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* FILTER-16: under the global filter — the rows outside it ("Search

  #palette-list li.outside .code, #palette-list li.outside .label { opacity: .55; }
  #palette-list li .pal-out {
    flex: none; font-family: var(--sans); font-size: calc(10px * var(--text-scale)); letter-spacing: .03em; color: var(--muted);
    border: var(--border) dashed var(--line); border-radius: var(--radius-md); padding: 0 4px;
  }

    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  #palette-list li.outside .pal-snip { opacity: .55; }
  #palette-list mark { background: none; color: var(--accent); font-weight: var(--weight-strong); }
  #palette-list li.empty, #palette .hint { color: var(--muted); font-size: calc(.75rem * var(--text-scale)); }
  #palette-list li.empty { padding: .3rem .8rem; cursor: default; }
  #palette .hint { padding: .35rem .8rem; border-top: var(--border) solid var(--line); }
  #cheats { width: 46rem; max-width: calc(100vw - 2rem); padding: .9rem 1.1rem 1rem; }
  #cheats h2 { font-size: calc(.95rem * var(--text-scale)); margin: 0 0 .7rem; }
  #cheats h2 .cheats-more { margin-left: .3rem; color: var(--muted); font-weight: normal; font-size: calc(.75rem * var(--text-scale)); }
  #cheats .cheats-scroll { max-height: 70vh; overflow: auto; }
  /* AGS-28: the key map — the `?` sheet and Settings → Keyboard draw the
     same table (src/keys.rs's KeyTable). */
  table.keymap { border-collapse: collapse; width: 100%; font-size: calc(.82rem * var(--text-scale)); }
  table.keymap th[scope=rowgroup] {
    text-align: left; vertical-align: top; color: var(--accent); font-weight: var(--weight-strong);
    padding: .45rem .8rem .2rem 0; white-space: nowrap; font-size: calc(.75rem * var(--text-scale));
  }
  table.keymap tbody + tbody tr:first-child > * { border-top: var(--border) solid var(--line); }
  table.keymap td { padding: .2rem .8rem .2rem 0; vertical-align: top; }
  table.keymap tr:first-child td { padding-top: .45rem; }
  table.keymap td.k { width: 12rem; }
  table.keymap td.k kbd { display: inline-block; white-space: nowrap; margin-bottom: .15rem; }
  table.keymap td.does { color: var(--ink); }
  table.keymap td.where { width: 10rem; color: var(--muted); font-size: calc(.75rem * var(--text-scale)); }
  table.keymap kbd, #settings-keyboard p.now kbd {
    font-family: var(--mono); font-size: calc(11px * var(--text-scale)); color: var(--chip-fg);
    background: var(--chip-bg); border: var(--border) solid var(--chip-line);
    border-radius: var(--radius-md); padding: 0 5px; margin-right: .25rem;
  }
  p.keys-none { color: var(--muted); font-size: calc(.8rem * var(--text-scale)); }
  #settings input#keys-search {
    width: 100%; max-width: 26rem; font: inherit; font-size: calc(.85rem * var(--text-scale)); color: var(--ink);
    background: var(--card); border: var(--border) solid var(--line); border-radius: var(--radius); padding: .25rem .5rem;
    margin-bottom: .5rem;
  }
  #settings input#keys-search:focus { border-color: var(--accent); outline: none; }
  #settings-keyboard #keys-table { overflow-x: auto; }
  #cheats .close {
    margin-top: .9rem; font: inherit; font-size: calc(.8rem * var(--text-scale)); cursor: pointer;
    background: var(--panel); border: var(--border) solid var(--line); color: var(--muted);
    border-radius: var(--radius); padding: .1rem .5rem;
  }
  #cheats .close:hover { color: var(--accent); border-color: var(--accent); }

  /* AGS-14: mermaid placeholders → diagrams. The renderer picks its
     theme from body's computed background (light → mermaid `default`). */
  .md .mermaid {
    background: var(--panel); border: var(--border) solid var(--line); border-radius: var(--radius);
    padding: .6rem .8rem; margin: .5rem 0; overflow-x: auto;
  }
  .md .mermaid pre { margin: 0; padding: 0; background: none; border: 0; }
  .md .mermaid[data-state="rendering"] pre { color: var(--muted); }
  .md .mermaid[data-state="done"] svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .md .mermaid[data-state="error"] { border-color: var(--err-fg); }
  .md .mermaid .mermaid-error {
    color: var(--err-fg); margin: 0 0 .6rem; white-space: pre-wrap; font-size: calc(.85rem * var(--text-scale));
  }
  /* AGS-16: the ticket menu — manifest's menu idiom on the palette's
     tokens: a bordered, shadowed card at the cursor; items are real
     links/buttons whose hover and keyboard focus paint the same way. The
     status list opens inline under "Set status"; each row shows the
     status as its chip, the current one marked. FILTER-22: the tag menu
     (Filter · Add · Build a filter from) wears the same face. */
  #tmenu, #tagmenu {
    position: fixed; z-index: 1000; min-width: 230px; max-width: 360px;
    max-height: calc(100vh - 8px); overflow: auto; padding: 4px;
    background: var(--bg); color: var(--ink); border: var(--border) solid var(--line);
    border-radius: var(--radius-xl); box-shadow: 0 10px 30px var(--shadow);
    font: calc(12.5px * var(--text-scale))/1.5 var(--mono); user-select: none; outline: none;
  }
  #tmenu .h, #tagmenu .h {
    display: flex; align-items: baseline; gap: 6px; padding: 4px 10px 6px;
    border-bottom: var(--border) solid var(--line); margin-bottom: 4px; white-space: nowrap;
  }
  #tmenu .h .title, #tagmenu .h .title { overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  #tmenu .h .tag, #tagmenu .h .tag { flex: none; font-size: calc(10px * var(--text-scale)); padding: 0 5px; border-radius: var(--radius-lg); }
  #tmenu .item, #tagmenu .item {
    display: block; width: 100%; text-align: left; padding: 4px 10px;
    border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink);
    cursor: pointer; font: inherit; text-decoration: none; white-space: nowrap;
  }
  #tmenu .item:hover, #tmenu .item:focus, #tagmenu .item:hover, #tagmenu .item:focus {
    background: var(--hover); color: var(--accent); outline: none;
  }
  #tmenu .item .arrow { color: var(--muted); }
  #tmenu .sub { border-top: var(--border) solid var(--line); margin-top: 4px; padding-top: 4px; }
  #tmenu .sub .item { padding-left: 14px; }
  #tmenu .sub .mark { display: inline-block; width: 1.4em; color: var(--live); }
  #tmenu .sub .st { padding: 0 5px; border-radius: var(--radius-lg); font-size: calc(11px * var(--text-scale)); }
  /* ACT-10: a value chip's own chooser, flat and first — a submenu's items
     without its head or its indent. */
  #tmenu .flat .mark { display: inline-block; width: 1.4em; color: var(--live); }
  #tmenu .flat .st { padding: 0 5px; border-radius: var(--radius-lg); font-size: calc(11px * var(--text-scale)); }
  /* ACT-7: the Nav ▸ items' separators. */
  #tmenu .rule, #tagmenu .rule { border-top: var(--border) solid var(--line); margin: 4px 6px; }
  /* ACT-4: the one menu — Delete… in the error colour; a form (a ticket
     picker, Rename…, Link commits…, Add a label…) in the items' place. */
  #tmenu .item.danger { color: var(--err-fg); }
  #tmenu .item.back { color: var(--muted); }
  #tmenu .mform-row { display: flex; gap: 4px; padding: 2px 6px 4px; }
  #tmenu .mfield {
    flex: 1; min-width: 12rem; font: inherit; padding: 2px 6px; color: var(--ink); background: var(--bg);
    border: var(--border) solid var(--line); border-radius: var(--radius-md); outline: none; user-select: text;
  }
  #tmenu .mfield:focus { border-color: var(--accent); }
  #tmenu .mgo {
    font: inherit; padding: 0 8px; cursor: pointer; color: var(--ink); background: transparent;
    border: var(--border) solid var(--line); border-radius: var(--radius-md);
  }
  #tmenu .mgo:hover { color: var(--accent); border-color: var(--accent); }
  #tmenu .merr, #delete .merr { margin: 2px 10px 4px; color: var(--err-fg); white-space: normal; }
  #tmenu .pick { display: flex; gap: 6px; align-items: baseline; max-width: 22rem; }
  #tmenu .pick .tag { flex: none; font-size: calc(10px * var(--text-scale)); padding: 0 5px; border-radius: var(--radius-lg); }
  #tmenu .pick .ptitle { overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  /* CHAT-5: Chat — the reader's unread there (the field's chip) and its key
     at the end; disabled, the reason under it; Chat ▸'s chats each with
     theirs. */
  #tmenu .item.chat { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
  #tmenu .item.chat .ilabel { overflow: hidden; text-overflow: ellipsis; }
  #tmenu .item.chat .count {
    background: var(--accent); color: var(--bg); padding: 0 6px; border-radius: var(--radius-sm);
    font-weight: var(--weight-strong); font-size: calc(10.5px * var(--text-scale)); font-variant-numeric: tabular-nums;
  }
  #tmenu .item .mkey {
    margin-left: auto; font: inherit; font-size: calc(10.5px * var(--text-scale)); color: var(--muted);
    border: var(--border) solid var(--line); border-radius: var(--radius-sm); padding: 0 5px;
  }
  #tmenu .item.off { color: var(--muted); cursor: default; }
  #tmenu .item.off .why { flex-basis: 100%; white-space: normal; font-size: calc(11px * var(--text-scale)); }
  #tmenu .sub .item.chat .count { margin-left: auto; }
  /* ACT-4: Delete…'s confirmation — every ticket, and what moves. */
  #delete { width: 34rem; padding: .9rem 1.1rem 1rem; display: flex; flex-direction: column; gap: .6rem; }
  #delete h2 { font-size: calc(.95rem * var(--text-scale)); margin: 0; }
  #delete p { margin: 0; font-size: calc(.85rem * var(--text-scale)); }
  #delete .dlist { margin: 0; padding: 0; list-style: none; max-height: 40vh; overflow: auto; font-size: calc(.85rem * var(--text-scale)); }
  #delete .dlist li { display: flex; gap: .4rem; align-items: baseline; padding: 1px 0; }
  #delete .dlist .code { font-family: var(--mono); font-size: calc(11.5px * var(--text-scale)); color: var(--accent); flex: none; }
  #delete .dtitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #delete .dnote { flex: none; color: var(--muted); font-size: calc(.8rem * var(--text-scale)); }
  #delete .dchildren { border: var(--border) solid var(--line); border-radius: var(--radius-md); font-size: calc(.85rem * var(--text-scale)); display: flex; flex-direction: column; gap: .2rem; }
  #delete .sacts { display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; }
  #delete .sacts button {
    font: inherit; font-size: calc(.85rem * var(--text-scale)); padding: .25rem .8rem; cursor: pointer;
    background: none; color: var(--ink); border: var(--border) solid var(--line); border-radius: var(--radius);
  }
  #delete .sacts button:hover { border-color: var(--accent); color: var(--accent); }
  #delete .sacts button.danger { background: var(--err-fg); border-color: var(--err-fg); color: var(--bg); }
  #delete .sacts button:disabled { opacity: .5; cursor: default; }
  #delete .sacts button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* The copy confirmation. The manual fallback shows the id selected in
     a field; the banner idiom's left edge marks it as a notice. */
  #toast {
    position: fixed; right: 16px; bottom: 16px; z-index: 1001;
    display: flex; align-items: baseline; gap: .6rem;
    background: var(--panel); color: var(--ink); border: var(--border) solid var(--line);
    border-left: 4px solid var(--live); border-radius: var(--radius-lg);
    padding: .45rem .7rem; font-size: calc(.85rem * var(--text-scale)); box-shadow: 0 8px 24px var(--shadow);
  }
  #toast.manual { border-left-color: var(--err-fg); }
  #toast input.code { font-family: var(--mono); font-size: calc(.85rem * var(--text-scale)); width: 7em; outline: none; }
  #toast button {
    background: none; border: var(--border) solid var(--line); color: var(--muted);
    font: inherit; font-size: calc(.8rem * var(--text-scale)); border-radius: var(--radius); padding: 0 .5rem; cursor: pointer;
  }
  #toast button:hover { color: var(--accent); border-color: var(--accent); }
  /* FILTER-26: Make global's toast, with its Undo — the toast's look, one
     row higher so the two never cover each other. */
  #ftoast {
    position: fixed; right: 16px; bottom: 64px; z-index: 1001;
    display: flex; align-items: baseline; gap: .6rem; max-width: calc(100vw - 32px);
    background: var(--panel); color: var(--ink); border: var(--border) solid var(--line);
    border-left: 4px solid var(--live); border-radius: var(--radius-lg);
    padding: .45rem .7rem; font-size: calc(.85rem * var(--text-scale)); box-shadow: 0 8px 24px var(--shadow);
  }
  #ftoast .msg { min-width: 0; overflow-wrap: anywhere; }
  #ftoast button {
    background: none; border: var(--border) solid var(--line); color: var(--muted);
    font: inherit; font-size: calc(.8rem * var(--text-scale)); border-radius: var(--radius); padding: 0 .5rem; cursor: pointer;
  }
  #ftoast button:hover { color: var(--accent); border-color: var(--accent); }
  /* WAVE-5: the wave board — a column per wave (or per stage), cards in
     the house chip idiom. The board takes the content column's whole
     width; its columns scroll sideways when they outgrow it. Owner,
     2026-10-06: every column is the page's height and scrolls inside —
     the row's height is measured in waves.rs (what the viewport leaves
     below it); the fallback here only covers the first frame. */
  header .hlink { color: var(--muted); font-size: calc(.8rem * var(--text-scale)); text-decoration: none; }
  header .hlink:hover, header .hlink[aria-current] { color: var(--accent); }
  /* ORG-4: the organization every page reads within — shown only to a
     reader who holds roles in more than one. */
  header .org-switch {
    font: inherit; font-size: calc(.8rem * var(--text-scale)); color: var(--muted);
    background: transparent; border: var(--border) solid var(--line); border-radius: var(--radius); padding: 0 .25rem;
  }
  header .org-switch:hover, header .org-switch:focus-visible { color: var(--accent); }
  main:has(#waves) { max-width: none; }
  #waves .wbar {
    position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem;
    margin: 0 0 .9rem; font-size: calc(.85rem * var(--text-scale));
  }
  #waves .code, #waves-index .code, #waves .card .off {
    font-size: calc(10.5px * var(--text-scale)); font-weight: var(--weight-strong); letter-spacing: .02em; color: var(--chip-fg);
    background: var(--chip-bg); border: var(--border) solid var(--chip-line); border-radius: var(--radius-md);
    padding: 0 5px; white-space: nowrap; text-decoration: none;
  }
  #waves a.code:hover, #waves-index a.code:hover, #waves .card .off:hover { color: var(--accent); border-color: var(--accent); }
  #waves .layout { color: var(--muted); white-space: nowrap; }
  #waves button.seg {
    background: none; border: 0; padding: 0 .2rem; font: inherit; color: var(--muted); cursor: pointer;
  }
  #waves button.seg:hover { color: var(--accent); }
  #waves button.seg.on { color: var(--ink); font-weight: var(--weight-strong); text-decoration: underline; }
  #waves .tally { margin-left: auto; color: var(--muted); font-size: calc(.75rem * var(--text-scale)); }
  #waves .lanes {
    display: flex; align-items: stretch; gap: .75rem; overflow-x: auto; overflow-y: hidden;
    padding-bottom: .5rem; height: calc(100dvh - 8rem); box-sizing: border-box;
  }
  #waves .lane {
    flex: 0 0 16.5rem; min-width: 0; background: var(--panel);
    border: var(--border) solid var(--line); border-radius: var(--radius-xl); padding: .5rem;
    display: flex; flex-direction: column; min-height: 0; box-sizing: border-box;
  }
  #waves .lane > .lane-h { flex: none; }
  #waves .lane.collapsed { flex: 0 0 auto; }
  #waves .lane-h {
    display: flex; align-items: baseline; gap: .4rem; margin: 0 0 .45rem; padding: 0 .15rem;
    font-family: var(--sans); font-size: calc(11px * var(--text-scale)); font-weight: var(--weight-strong); letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted);
  }
  #waves .lane-h .n { margin-left: auto; font-family: var(--mono); font-weight: var(--weight-normal); letter-spacing: 0; }
  #waves button.lane-h { background: none; border: 0; cursor: pointer; width: 100%; margin: 0; white-space: nowrap; }
  #waves button.lane-h:hover { color: var(--accent); }
  #waves .lane:not(.collapsed) button.lane-h { margin-bottom: .45rem; }
  #waves ul.cards {
    list-style: none; margin: 0; padding: 0 2px 0 0; display: flex; flex-direction: column; gap: .4rem;
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  }
  #waves ul.cards > li { flex: none; }
  #waves .card {
    background: var(--card); border: var(--border) solid var(--line); border-radius: var(--radius-lg);
    padding: .35rem .5rem .4rem; font-size: calc(12px * var(--text-scale)); line-height: 1.45;
  }
  #waves .card { cursor: pointer; }
  #waves .card:hover { border-color: var(--accent); }
  /* MENGER-31: a ticket's boards — the heading, the ticket the menu was
     opened on, and a blocked_by cycle. */
  #waves .scope-h { font-size: calc(1rem * var(--text-scale)); margin: 0 0 .2rem; display: flex; gap: .4rem; align-items: baseline; flex-wrap: wrap; }
  #waves .scope-h .title { font-weight: var(--weight-normal); }
  #waves p.about { margin: 0 0 .5rem; font-size: calc(.8rem * var(--text-scale)); }
  #waves .card.at { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  #waves p.cycle { color: var(--err-fg); background: var(--err-bg); border: var(--border) solid var(--err-line); border-radius: var(--radius-lg); padding: .3rem .5rem; font-size: calc(.8rem * var(--text-scale)); }
  #waves p.cycle .ring { font-family: var(--mono); }
  #waves .card .top { display: flex; align-items: baseline; gap: .4rem; }
  #waves .card .kind { color: var(--muted); font-size: calc(10.5px * var(--text-scale)); }
  #waves .card[data-kind="scope"] .kind { color: var(--kind-scope); }
  #waves .card[data-kind="build"] .kind { color: var(--kind-build); }
  #waves .card[data-kind="execution"] .kind { color: var(--kind-execution); }
  #waves .card[data-kind="gap"] .kind { color: var(--kind-gap); }
  #waves .card[data-kind="spike"] .kind { color: var(--kind-spike); }
  #waves .card .sev { color: var(--muted); font-weight: var(--weight-bold); }
  #waves .card .sev[data-sev="Critical"], #waves .card .sev[data-sev="High"] { color: var(--err-fg); }
  #waves .card .blocked-mark { color: var(--err-fg); font-weight: var(--weight-bold); }
  #waves .card .badge {
    margin-left: auto; font-size: calc(10px * var(--text-scale)); color: var(--chip-fg); background: var(--chip-bg);
    border: var(--border) solid var(--chip-line); border-radius: var(--radius-lg); padding: 0 5px;
  }
  #waves .card a.title {
    display: block; margin: .15rem 0 .3rem; color: var(--ink); text-decoration: none;
    font-family: var(--sans); font-size: calc(13px * var(--text-scale)); overflow-wrap: anywhere;
  }
  #waves .card a.title:hover { color: var(--accent); }
  #waves .card .foot { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem; }
  #waves .card .foot .tag { font-size: calc(10px * var(--text-scale)); padding: 0 5px; border-radius: var(--radius-lg); border: 1px solid transparent; }
  #waves .card .off { font-weight: var(--weight-normal); }
  #waves-index h2 { font-size: calc(1rem * var(--text-scale)); margin: 0 0 .4rem; }
  #waves-index ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem; }
  /* COMP-6: #/components — a row per component (its tag, its owner or
     "orphan", what references it), its source folded on the line below. */
  #components { max-width: 64rem; }
  #components h2 { font-size: calc(1rem * var(--text-scale)); margin: 0 0 .4rem; font-family: var(--mono); }
  #components .crumbs a { color: var(--muted); text-decoration: none; font-size: calc(.85rem * var(--text-scale)); }
  #components .crumbs a:hover { color: var(--accent); }
  #components table.comps { margin-top: .75rem; }
  #components th.c-name { width: 16rem; }
  #components th.c-owner { width: 8rem; }
  #components tr.comp td { border-bottom: 0; padding-bottom: .1rem; vertical-align: baseline; }
  #components tr.src td { padding-top: 0; }
  #components a.tag { font-family: var(--mono); font-size: calc(13px * var(--text-scale)); color: var(--accent); text-decoration: none; }
  #components a.tag:hover { text-decoration: underline; }
  #components .code {
    font-family: var(--mono); font-size: calc(10.5px * var(--text-scale)); font-weight: var(--weight-strong); letter-spacing: .02em; color: var(--chip-fg);
    background: var(--chip-bg); border: var(--border) solid var(--chip-line); border-radius: var(--radius-md);
    padding: 0 5px; white-space: nowrap; text-decoration: none; margin-right: .25rem;
  }
  #components a.code:hover { color: var(--accent); border-color: var(--accent); }
  #components .orphan {
    font-size: calc(.75rem * var(--text-scale)); color: var(--muted); border: var(--border) dashed var(--line); border-radius: var(--radius-md); padding: 0 5px;
  }
  #components .count { color: var(--muted); font-size: calc(.8rem * var(--text-scale)); margin-right: .35rem; }
  /* COMP-9: each row's summary; the help page's docs card (a frame). */
  #components .c-summary { font-size: calc(.8rem * var(--text-scale)); color: var(--ink); margin-top: .1rem; }
  #components .c-summary.none { color: var(--muted); font-style: italic; }
  #components .help-card { margin: .5rem 0 1rem; }
  #components details summary { cursor: pointer; color: var(--muted); font-size: calc(.75rem * var(--text-scale)); }
  #components details pre {
    background: var(--panel); border: var(--border) solid var(--line); border-radius: var(--radius); margin: .35rem 0 .2rem;
    padding: .6rem .8rem; overflow-x: auto; font-family: var(--mono); font-size: calc(12px * var(--text-scale)); line-height: 1.5;
  }
  /* INPUT-6: the header's open-input count, beside `inputs` — once the app
     holds the inputs; quiet at 0. */
  header .hlink .hbadge {
    display: inline-block; margin-left: .3rem; padding: 0 5px; border-radius: var(--radius-xl);
    font-size: calc(10px * var(--text-scale)); font-weight: var(--weight-strong); line-height: 1.5; vertical-align: 1px;
    background: var(--accent); color: var(--bg);
  }
  header .hlink .hbadge.zero {
    background: var(--chip-bg); color: var(--chip-fg); font-weight: var(--weight-normal); border: var(--border) solid var(--chip-line);
  }
  /* INPUT-6: #/inputs — the filter bar, then a group per state (open,
     answered, closed; removed behind the toggle), a card per input. */
  #inputs { max-width: 64rem; }
  #inputs h2 { font-size: calc(1rem * var(--text-scale)); margin: 0 0 .4rem; }

  #inputs .ibar {

  #inputs .ist {

  }
  #inputs .ist[data-state="open"] { background: var(--sel); color: var(--accent); border-color: var(--accent); }
  #inputs .ist[data-state="answered"] { color: var(--live); border-color: var(--live); }
  #inputs .ist[data-state="closed"] { background: var(--chip-bg); color: var(--chip-fg); border-color: var(--chip-line); }
  #inputs .ist[data-state="removed"] { color: var(--muted); border-color: var(--line); text-decoration: line-through; }
  #inputs .igroup p.empty { margin: 0 0 .3rem; font-size: calc(.8rem * var(--text-scale)); }
  #inputs ul.irows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
  #inputs .irow {
    background: var(--card); border: var(--border) solid var(--line); border-radius: var(--radius-lg);
    padding: .5rem .7rem .55rem; font-size: calc(13px * var(--text-scale));
  }
  #inputs .irow[data-state="open"] { border-left: 3px solid var(--accent); }
  #inputs .irow[data-state="removed"] { opacity: .75; }
  #inputs .ihead { display: flex; flex-wrap: wrap; align-items: baseline; gap: .45rem; }
  #inputs .code {
    font-size: calc(10.5px * var(--text-scale)); font-weight: var(--weight-strong); letter-spacing: .02em; color: var(--chip-fg);
    background: var(--chip-bg); border: var(--border) solid var(--chip-line); border-radius: var(--radius-md);
    padding: 0 5px; white-space: nowrap; text-decoration: none;
  }
  #inputs a.code:hover { color: var(--accent); border-color: var(--accent); }
  #inputs .iid { color: var(--muted); font-size: calc(.8rem * var(--text-scale)); }
  #inputs .ikind { margin-left: auto; color: var(--muted); font-size: calc(.75rem * var(--text-scale)); }
  #inputs .iq { margin: .3rem 0 .35rem; font-family: var(--sans); font-size: calc(14px * var(--text-scale)); overflow-wrap: anywhere; }
  #inputs .iq.none { font-style: italic; color: var(--muted); }
  #inputs ul.iopts { list-style: none; margin: 0 0 .35rem; padding: 0; display: flex; flex-wrap: wrap; gap: .3rem; }
  #inputs div.iopts { margin: 0 0 .35rem; font-size: calc(.8rem * var(--text-scale)); font-style: italic; }
  #inputs .opt {
    font-size: calc(12px * var(--text-scale)); padding: 0 .45rem; border-radius: var(--radius-md);
    background: var(--panel); border: var(--border) solid var(--line); color: var(--ink);
  }
  #inputs .opt.recommended { border-color: var(--kind-scope); }
  #inputs .opt .rec { margin-left: .35rem; font-size: calc(10.5px * var(--text-scale)); color: var(--kind-scope); }
  #inputs .opt.chosen { background: var(--sel); border-color: var(--accent); color: var(--accent); font-weight: var(--weight-strong); }
  #inputs .irec, #inputs .ians { margin: .15rem 0; font-size: calc(12.5px * var(--text-scale)); overflow-wrap: anywhere; }
  #inputs .ians.none { font-size: calc(.8rem * var(--text-scale)); font-style: italic; }
  #inputs .irow .val { font-weight: var(--weight-strong); }
  #inputs .why { color: var(--ink); margin-left: .3rem; }
  #inputs .src {
    margin-left: .45rem; font-size: calc(10.5px * var(--text-scale)); color: var(--chip-fg); background: var(--chip-bg);
    border: var(--border) solid var(--chip-line); border-radius: var(--radius-md); padding: 0 4px;
  }
  #inputs time.at { margin-left: .4rem; color: var(--muted); font-size: calc(.75rem * var(--text-scale)); }
  #inputs details.ihist { margin-top: .3rem; }
  #inputs details.ihist summary { cursor: pointer; color: var(--muted); font-size: calc(.75rem * var(--text-scale)); }
  #inputs details.ihist ol { margin: .3rem 0 0; padding-left: 1.4rem; font-size: calc(12px * var(--text-scale)); }
  #inputs details.ihist .act { color: var(--muted); margin-right: .35rem; }
  /* WAVE-11: the board's annotation below it — read, or edited beside a
     live preview — and a wave reference in any body. */
  #waves .notes { margin-top: 1rem; border-top: var(--border) solid var(--line); padding-top: .6rem; }
  #waves .notes .nh { display: flex; align-items: baseline; gap: .75rem; }
  #waves .notes button.fold { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; color: var(--ink); }
  #waves .notes button.fold:hover .code { color: var(--accent); border-color: var(--accent); }
  #waves .notes button.edit, #waves .notes button.link, .editor button.reload {

  }
  #waves .notes .none, #waves .notes .loading { color: var(--muted); }
  .editor .panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .75rem; margin-top: .5rem; }
  .editor textarea.src {
    width: 100%; min-height: 18rem; resize: vertical; box-sizing: border-box; padding: .5rem;
    font-family: var(--mono); font-size: calc(12px * var(--text-scale)); line-height: 1.5;
    background: var(--card); color: var(--ink); border: var(--border) solid var(--line); border-radius: var(--radius);
  }
  .editor .preview { border: var(--border) dashed var(--line); border-radius: var(--radius); padding: 0 .75rem; overflow: auto; max-height: 40rem; }
  .editor .actions { display: flex; gap: .5rem; margin-top: .4rem; }
  .editor button.save, .editor button.cancel {
    font: inherit; font-size: calc(.8rem * var(--text-scale)); padding: 0 .6rem; cursor: pointer;
    background: var(--card); color: var(--ink); border: var(--border) solid var(--line); border-radius: var(--radius);
  }
  .editor button.save:hover, .editor button.cancel:hover { color: var(--accent); border-color: var(--accent); }
  .editor .notice { background: var(--sel); border: var(--border) solid var(--line); border-radius: var(--radius); padding: .25rem .5rem; }
  .editor .problem { color: var(--err-fg); background: var(--err-bg); border: var(--border) solid var(--err-line); border-radius: var(--radius); padding: .25rem .5rem; }
  /* COMP-4: a framed body — its HTML in a sandboxed frame (src/frame.rs),
     sized to its content by the frame's SDK, so it never scrolls inside. A
     re-render loads beside the frame on screen, invisible, and replaces it
     once drawn: an amended body never flashes. The frame's own background
     is transparent (its color-scheme follows the app's), so it sits on
     whatever surface hosts it. */
  .mframe { position: relative; max-width: 56rem; }
  .mframe > iframe { display: block; width: 100%; border: 0; }
  .mframe > iframe[data-state="pending"] { position: absolute; top: 0; left: 0; opacity: 0; pointer-events: none; }
  /* MENGER-15: the box a framed body sits in (src/present.rs) — a slim bar
     (full screen; a mockup's devices, scheme and motion) over the frame. A
     whole document is a page, not a flow: it gets a viewport of its own
     and scrolls inside it. Full screen is the same box, fixed over the app
     (and the browser's own full screen when a gesture allowed it). */
  .framed { position: relative; max-width: 56rem; }
  #ticket-page .framed { max-width: none; }
  .framed-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .5rem; justify-content: flex-end;
    font-size: calc(.78rem * var(--text-scale)); color: var(--muted); padding: 0 0 .3rem; }
  .framed-gap { flex: 1; }
  .framed-group { display: inline-flex; }
  .framed-group .framed-btn { border-radius: 0; margin-left: -1px; }
  .framed-group .framed-btn:first-child { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
  .framed-group .framed-btn:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
  .framed-btn { font: inherit; color: var(--ink); background: var(--panel); border: var(--border) solid var(--line);
    border-radius: var(--radius); padding: .12rem .5rem; cursor: pointer; }
  .framed-btn:hover { background: var(--hover); }
  .framed-btn[aria-pressed="true"] { background: var(--sel); border-color: var(--accent); }
  .framed-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .framed-id { font-family: var(--mono); color: var(--ink); }
  .framed-title { color: var(--ink); font-weight: var(--weight-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  .framed[data-view="inline"] .mframe, .framed[data-view="full"] .mframe { max-width: none; }
  .mframe:not(.mframe-fixed) > iframe[data-page] { height: 80vh; border: var(--border) solid var(--line); border-radius: var(--radius); }
  .framed.is-full { position: fixed; inset: 0; z-index: 950; max-width: none; margin: 0; display: flex; flex-direction: column;
    background: var(--bg); padding: .4rem .6rem .6rem; box-sizing: border-box; }
  .framed.is-full .framed-bar { padding-bottom: .4rem; border-bottom: var(--border) solid var(--line); margin-bottom: .4rem; }
  .framed.is-full .framed-stage { flex: 1; min-height: 0; overflow: auto; }
  .framed.is-full .mframe { max-width: none; }
  .framed.is-full .mframe:not(.mframe-fixed) > iframe[data-page] { height: calc(100vh - 3.5rem); border: 0; border-radius: 0; }
  .framed:fullscreen { background: var(--bg); }
  /* A mockup: each device a frame at its own viewport, scaled to fit. */
  .framed[data-view="mockup"] { max-width: none; }
  .framed[data-view="mockup"] .framed-stage { display: flex; flex-wrap: nowrap; gap: 24px; align-items: flex-start; padding: 4px; }
  .framed.is-full[data-view="mockup"] .framed-stage { justify-content: center; }
  /* APP-42: what a mockup shows, said above it — the app's type, outside
     every device; and the bar's quiet note when its page scrolls screens. */
  .framed-caption { max-width: 46rem; padding: 0 0 .45rem; color: var(--ink); font-size: calc(.9rem * var(--text-scale)); line-height: 1.45; }
  .framed-caption-title { margin: 0 0 .15rem; font-weight: var(--weight-strong); }
  .framed-caption-text > :first-child { margin-top: 0; }
  .framed-caption-text > :last-child { margin-bottom: 0; }
  .framed-caption-text p { margin: 0 0 .4rem; }
  .framed.is-full .framed-caption { max-width: none; padding-bottom: .3rem; }
  .framed-note { color: var(--muted); font-style: italic; }
  .device { margin: 0; flex: none; }
  .device.hidden { display: none; }
  .device-label { display: flex; gap: .5rem; font-size: calc(.72rem * var(--text-scale)); color: var(--muted); padding: 0 0 .3rem; }
  .device-label .code { font-family: var(--mono); }
  .device-scale { margin-left: auto; }
  .device-screen { position: relative; overflow: hidden; box-sizing: content-box; background: var(--card);
    border: 6px solid var(--ink); border-radius: var(--radius-device); box-shadow: 0 6px 18px var(--shadow); }
  .device[data-kind="phone"] .device-screen { border-width: 8px; border-radius: var(--radius-phone); }
  .device[data-kind="desktop"] .device-screen { border-width: 18px 2px 2px; border-color: var(--line); border-radius: var(--radius-xl) var(--radius-xl) var(--radius) var(--radius); }
  .device-inner { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  /* APP-33: a mockup at any size (src/mocksize.rs) — the Size menu of
     standard devices, the Custom field, a device's readout, Rotate, and the
     grips on its right edge and corner (the edge a focusable handle). At a
     phone's width the grips give way to the field. */
  .framed[data-view="mockup"] .framed-stage { padding-right: 18px; }
  .framed-sizes { position: relative; display: inline-flex; }
  .framed-menu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 20; min-width: 15rem; max-width: calc(100vw - 32px); display: flex; flex-direction: column;
    padding: 4px; background: var(--card); border: var(--border) solid var(--tree-line); border-radius: var(--radius-lg); box-shadow: 0 8px 24px var(--shadow); }
  .framed-menu[hidden] { display: none; }
  .framed-menu-item { font: inherit; display: flex; gap: 1rem; justify-content: space-between; align-items: baseline; text-align: left;
    color: var(--ink); background: none; border: 0; border-radius: var(--radius); padding: .3rem .5rem; cursor: pointer; }
  .framed-menu-item .code { font-family: var(--mono); color: var(--muted); }
  .framed-menu-item:hover, .framed-menu-item:focus-visible { background: var(--hover); outline: none; }
  .framed-menu-item.is-on { background: var(--sel); }
  .framed-menu-item:last-child { border-top: var(--border) solid var(--line); border-radius: 0 0 var(--radius) var(--radius); margin-top: 2px; }
  .framed-btn:disabled { color: var(--muted); cursor: default; background: var(--panel); }
  .framed-field { display: inline-flex; align-items: center; gap: .3rem; flex-wrap: wrap; }
  .framed-input { font: inherit; font-family: var(--mono); width: 9rem; color: var(--ink); background: var(--card);
    border: var(--border) solid var(--line); border-radius: var(--radius); padding: .12rem .4rem; }
  .framed-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .framed-input[aria-invalid="true"] { border-color: var(--err-line); }
  .framed-refused { padding: .1rem .45rem; color: var(--err-fg); background: var(--err-bg); border: var(--border) solid var(--err-line); border-radius: var(--radius); }
  .framed-refused[hidden] { display: none; }
  .device-label { align-items: baseline; }
  .device-size, .device-rotate { font: inherit; color: var(--muted); background: none; border: var(--border) solid transparent; border-radius: var(--radius); padding: 0 .25rem; cursor: pointer; }
  .device-size { font-family: var(--mono); }
  .device-size:hover, .device-rotate:hover { color: var(--ink); border-color: var(--line); }
  .device-size:focus-visible, .device-rotate:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .device-body { position: relative; width: fit-content; }
  .device-grip { position: absolute; touch-action: none; user-select: none; }
  .device-grip-e { top: 0; bottom: 18px; right: -14px; width: 10px; cursor: ew-resize; border-radius: var(--radius-pill); }
  .device-grip-e::after { content: ""; position: absolute; left: 3px; top: 50%; width: 4px; height: 40px; max-height: 60%; transform: translateY(-50%);
    background: var(--tree-line); border-radius: var(--radius-pill); }
  .device-grip-se { right: -14px; bottom: -6px; width: 14px; height: 14px; cursor: nwse-resize;
    border-right: 3px solid var(--tree-line); border-bottom: 3px solid var(--tree-line); border-radius: 0 0 var(--radius) 0; }
  .device-grip:hover::after, .device-grip-e:focus-visible::after, .device.is-dragging .device-grip-e::after { background: var(--accent); }
  .device-grip-se:hover, .device.is-dragging .device-grip-se { border-color: var(--accent); }
  .device-grip-e:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .device.is-dragging .device-screen { box-shadow: 0 0 0 2px var(--accent); }
  .device-readout { position: absolute; top: 8px; right: 8px; z-index: 3; pointer-events: none; padding: .15rem .45rem;
    font-size: calc(.78rem * var(--text-scale)); color: var(--bg); background: var(--ink); border-radius: var(--radius); }
  .device-readout[hidden] { display: none; }
  @media (max-width: 640px) {
    .device-grip { display: none; }
    .framed[data-view="mockup"] .framed-stage { padding-right: 4px; }
    .framed-menu { min-width: min(15rem, calc(100vw - 32px)); }
  }
  .mframe.mframe-fixed { width: 100%; height: 100%; max-width: none; }
  .mframe.mframe-fixed > iframe { width: 100%; height: 100%; border: 0; border-radius: 0; }
  /* COMP-14: a cite window (src/cite.rs) — laid by the host over an
     <m-cite> placeholder in a framed body, outside that frame: a header
     (the cited ticket's id, live status, title, and the section, linking
     to it there) over a view of the section, which is its own frame of the
     cited ticket's, at its natural height up to a cap, then scrolling. A
     window of a frame still loading stays hidden until that frame shows. */
  .mcite {
    position: absolute; z-index: 2; box-sizing: border-box; overflow: hidden;
    border: var(--border) solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--radius-lg); background: var(--bg);
  }
  .mcite[data-pending] { visibility: hidden; }
  .mcite-head {
    display: flex; gap: .5rem; align-items: baseline; padding: .2rem .6rem; min-width: 0;
    font-size: calc(12px * var(--text-scale)); line-height: 1.6; color: var(--muted); text-decoration: none; white-space: nowrap;
    background: var(--panel); border-bottom: var(--border) solid var(--line);
  }
  a.mcite-head:hover .mcite-title, a.mcite-head:focus-visible .mcite-title { text-decoration: underline; color: var(--ink); }
  .mcite-id, .mcite-sec { font-family: var(--mono); color: var(--ink); flex: none; }
  .mcite-head .st { padding: 0 5px; border-radius: var(--radius-lg); font-size: calc(11px * var(--text-scale)); flex: none; }
  .mcite-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .mcite-state { margin: 0; padding: .4rem .6rem; font-size: calc(13px * var(--text-scale)); color: var(--muted); }
  .mcite[data-state="failed"] .mcite-state { color: var(--err-fg); background: var(--err-bg); }
  .mcite-view { height: 0; overflow: auto; }
  .mcite-view > .mframe { max-width: none; padding: 0 .6rem; }
  /* APP-29: a mockup box (src/mockup.rs) — laid by the host over an
     <m-mockup> placeholder in a framed body, outside that frame: the same
     .framed box a `view: mockup` body gets (its bar, its devices side by
     side), its height told back to the placeholder. Full screen lifts it
     above the app as any .framed is. */
  .mmock { position: absolute; z-index: 2; box-sizing: border-box; background: var(--bg); }
  .mmock[data-pending] { visibility: hidden; }
  .mmock:has(.framed.is-full) { z-index: 950; }
  .mmock > .mmock-host > .framed { max-width: none; }
  .mmock-state { margin: 0; padding: .5rem .7rem; font-size: calc(13px * var(--text-scale)); color: var(--muted);
    border: var(--border) dashed var(--line); border-radius: var(--radius-lg); }
  .mmock[data-state="failed"] .mmock-state { color: var(--err-fg); background: var(--err-bg); border-style: solid; }
  /* APP-46: answering on the mock — a decision's option's look carries its
     name, its mark and *pick this* at the head of its bar; every mockup
     *comment*. The answer's box takes the pass border, as its card does. */
  .mpick { display: inline-flex; align-items: center; gap: .4rem; min-width: 0; }
  .mpick-name { color: var(--ink); font-weight: var(--weight-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 18rem; }
  .mpick-mark { font-family: var(--mono); font-size: calc(.72rem * var(--text-scale)); color: var(--live); border: var(--border) solid var(--live);
    border-radius: var(--radius); padding: 0 .35rem; }
  .mpick[data-mark="weighed"] .mpick-mark { color: var(--muted); border-color: var(--line); }
  .mpick-go:not(:disabled) { border-color: var(--accent); color: var(--accent); font-weight: var(--weight-strong); }
  .mpick-err { color: var(--err-fg); }
  .mmock:has(.mpick[data-mark="answer"]), .mmock:has(.mpick[data-mark="decided"]) {
    outline: 2px solid var(--live); outline-offset: 4px; border-radius: var(--radius-lg); }
  .mmock:has(.mpick[data-mark="weighed"]) .framed-stage { opacity: .62; }
  /* APP-44: the mockup compare (src/compare.rs) — a bar's Compare toggle;
     the page's pill at the bottom left (clear of the queue control at the
     bottom right and the dock at the right edge); and the full-window view,
     a column per mockup at one shared device, scrolling sideways inside
     itself past what fits. Columns sit in a fixed DOM order and move by
     `order`, so their frames never reload. */
  .cmp-pill { position: sticky; bottom: 14px; z-index: 30; width: fit-content; margin: 12px 0 0; display: flex; align-items: center; gap: 2px;
    padding: 3px 4px 3px 12px; font: calc(12px * var(--text-scale)) var(--mono); color: var(--bg); background: var(--ink);
    border-radius: var(--radius-pill); box-shadow: 0 8px 24px var(--shadow); }
  .cmp-pill[hidden] { display: none; }
  #ticket-page > .cmp-pill { order: 99; align-self: flex-start; }
  .cmp-pill .cmp-n { padding-right: 6px; }
  .cmp-pill button { font: inherit; color: inherit; background: none; border: 0; border-radius: var(--radius-pill); padding: 4px 10px; cursor: pointer; }
  .cmp-pill .cmp-open { background: var(--bg); color: var(--ink); font-weight: var(--weight-medium); }
  .cmp-pill button:hover { text-decoration: underline; }
  .cmp-pill button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (min-width: 821px) { #app:has(#qtray:not(.empty)) .cmp-pill { bottom: 62px; } }
  /* APP-50: at the phone shape's widths the column ends at the bar's top
     edge, so the pill sits clear of it; on a page without the bar, above
     the dock's pill. */

  @keyframes menger-cpost-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  section.convsec .chead { display: flex; flex-wrap: wrap; align-items: baseline; gap: .45rem; }
  section.convsec .cwho { font-weight: var(--weight-medium); }
  section.convsec .cwhen { color: var(--muted); font-size: calc(.75rem * var(--text-scale)); cursor: help; }
  section.convsec a.cpin { color: var(--accent); font-size: calc(.75rem * var(--text-scale)); text-decoration: none; }
  section.convsec a.cpin:hover { text-decoration: underline; }
  section.convsec .cstate { font: calc(11px * var(--text-scale))/1.5 var(--mono); border: var(--border) solid var(--live); color: var(--live); border-radius: var(--radius-lg); padding: 0 5px; }
  section.convsec .cflip, section.convsec .csend {
    font: inherit; font-size: calc(.75rem * var(--text-scale)); cursor: pointer; background: var(--panel); color: var(--ink);
    border: var(--border) solid var(--line); border-radius: var(--radius); padding: 0 .55rem;
  }
  section.convsec .cflip { margin-left: auto; }

  section.convsec .cnew { display: flex; flex-direction: column; gap: .35rem; }
  section.convsec textarea.cbox {

  }

  /* APP-27: an answer box grows with what is typed — from its resting height
     (each box's min-height: its rows) to half the viewport, then it scrolls.
     field-sizing where the engine has it; src/grow.rs fits it elsewhere. */

  section.convsec .cnewacts { display: flex; align-items: center; justify-content: flex-end; gap: .6rem; }
  section.convsec .csend { padding: .15rem .9rem; }

  /* MENGER-12: a ticket's labels — chips on its rows and its page;
     `needs-you` wears the accent (it puts the ticket under Needs you, on the nav). */
  .lchips { display: inline-flex; flex-wrap: nowrap; gap: .25rem; margin-left: .4rem; vertical-align: 1px; }

    padding: 0 6px; border-radius: var(--radius-xl); color: var(--chip-fg); background: var(--chip-bg); border: var(--border) solid var(--chip-line);
  }
  .lchip.needs { color: var(--accent); background: var(--sel); border-color: var(--accent); font-weight: var(--weight-strong); }
  #t-labels .lchips { flex-wrap: wrap; margin-left: 0; }
  #t-labels .lwrap { display: inline-flex; align-items: center; }

  }

  #t-labels .ladd { display: flex; gap: .3rem; margin-top: .35rem; }
  #t-labels .ladd input {
    flex: 1; min-width: 0; font: inherit; font-size: calc(12px * var(--text-scale)); padding: 1px 5px;
    background: var(--card); color: var(--ink); border: var(--border) solid var(--line); border-radius: var(--radius);
  }
  .lproblem { margin: .3rem 0 0; font-size: calc(.8rem * var(--text-scale)); color: var(--err-fg); overflow-wrap: anywhere; }
  /* MENGER-12: the header's `needs you` count — the accent while anything
     waits, quiet at 0 (the inputs badge's look). */

  /* DEPLOY-13: where work runs — a mark per environment on a board row and
     a wave card, the ticket page's Running, and #/deployments. */
  .envmarks { display: inline-flex; flex-wrap: nowrap; gap: .2rem; margin-left: .35rem; vertical-align: 1px; }
  .envmark {
    display: inline-block; font-family: var(--sans); font-size: calc(10px * var(--text-scale)); line-height: 1.5; white-space: nowrap;
    padding: 0 5px; border-radius: var(--radius-xl); color: var(--st-complete-fg); background: var(--st-complete-bg);
    border: var(--border) solid var(--chip-line); text-decoration: none;
  }
  a.envmark:hover, a.envmark:focus-visible { border-color: var(--accent); }
  .envmark.off { color: var(--muted); background: transparent; border-style: dashed; }
  /* DEPLOY-20: running an earlier version there — the review tint, a
     dashed edge and a down-step, apart from the current version's mark. */
  .envmark.behind { color: var(--st-in-review-fg); background: var(--st-in-review-bg); border-style: dashed; border-color: currentColor; }
  .envmark.behind::after { content: " \2193"; }
  .envmark.big { font-size: calc(12px * var(--text-scale)); padding: 1px 8px; font-weight: var(--weight-strong); }
  /* DEPLOY-21: a delivery stage is a mark of its own — ready for an
     environment the accent's outline and an arrow in (apart from running's
     fill and behind's dashed review tint), deploying the same breathing
     (ornament: calm and none stop it), failed the error tint. */
  .envmark.ready { color: var(--accent); background: transparent; border-color: var(--accent); }
  .envmark.ready::before { content: "\2192\00a0"; }
  .envmark.deploying { color: var(--accent); background: var(--chip-bg); border-color: var(--accent); border-style: dotted; animation: menger-deploying 1.6s ease-in-out infinite; }
  .envmark.deploying::before { content: "\21bb\00a0"; }

  .envmark.failed::before { content: "\00d7\00a0"; }
  @keyframes menger-deploying { 50% { opacity: .45; } }

  /* The filter menu's delivery rows: a count that holds work in the accent. */

  .wchip .wn { color: var(--muted); font-variant-numeric: tabular-nums; }
  /* #/deployments' lanes: one per promotion edge, the ready count arriving
     as a state change (none stops it; calm keeps it). */
  .dlanes { display: flex; flex-direction: column; gap: .6rem; margin: 0 0 .9rem; }
  .dlanes:empty { display: none; }
  .dlane {
    background: var(--card); border: var(--border) solid var(--tree-line); border-radius: var(--radius-lg);
    box-shadow: inset 2px 0 var(--accent); padding: 10px 14px 10px 16px; min-width: 0;

  .dlane .larrow { color: var(--muted); }
  .dlane .lready { font-family: var(--sans); font-size: calc(14px * var(--text-scale)); font-weight: var(--weight-strong); color: var(--ink); padding: 0; }
  .dlane .lready .lcount { display: inline-block; color: var(--accent); font-variant-numeric: tabular-nums; animation: menger-count-in .35s cubic-bezier(.2, .9, .25, 1.2) both; }

  .dlane .lstages .dlink { color: var(--muted); }

  @keyframes menger-count-in { from { transform: translateY(-40%); opacity: 0; } }

  .wave-board .card .foot .envmarks, #waves .card .foot .envmarks { margin-left: 0; }

  #deployments-page { max-width: 100%; }
  #deployments-page h2 { font-size: calc(1rem * var(--text-scale)); margin: 0 0 .4rem; }
  #deployments-page .dback { margin: 0 0 .5rem; font-size: calc(.8rem * var(--text-scale)); }
  #deployments-page .hint { color: var(--muted); font-size: calc(.8rem * var(--text-scale)); margin: .2rem 0 .5rem; overflow-wrap: anywhere; }
  #deployments-page .hint code, #deployments-page code.rev { font-family: var(--mono); font-size: calc(11px * var(--text-scale)); }
  #deployments-page .dnone { color: var(--muted); }
  #deployments-page .derr { color: var(--err-fg); font-size: calc(.8rem * var(--text-scale)); overflow-wrap: anywhere; }

  .dproject { margin: 0 0 1.5rem; }

  .dproject h3 a { color: var(--ink); text-decoration: none; }

  }

  .dlink {

    color: var(--accent); cursor: pointer;

  ul.drows li { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .45rem; font-size: calc(13px * var(--text-scale)); min-width: 0; }

  }

  .ddeploy { background: var(--card); border: var(--border) solid var(--line); border-radius: var(--radius-lg); padding: .3rem .5rem; font-size: calc(12px * var(--text-scale)); }
