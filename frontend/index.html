<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>menger — app</title>
<link data-trunk rel="rust" />
<!-- AGS-14: the vendored mermaid bundle rides into dist/vendor/ as a served
     file only. Deliberately NOT a <script> here: src/mermaid.rs injects one
     the first time a rendered body holds a mermaid fence. -->
<link data-trunk rel="copy-file" href="vendor/mermaid/mermaid-11.17.2.min.js" data-target-path="vendor" />
<style>
  /* Same visual family as web/index.html so the two shells read as one system. */
  :root {
    --bg: #101014; --panel: #17171d; --ink: #d8d8e0; --dim: #7a7a88;
    --line: #26262e; --live: #5dbb63; --dead: #c05555; --accent: #8ab4f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-monospace, "JetBrains Mono", Menlo, monospace;
  }
  header {
    display: flex; align-items: baseline; gap: 1rem;
    padding: .75rem 1.25rem; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  header .tag { color: var(--dim); font-size: .8rem; }
  #conn { color: var(--dim); font-size: .8rem; margin-left: auto; }
  #conn.live { color: var(--live); }
  #conn.reconnecting { color: var(--dead); }
  main { padding: 1rem 1.25rem; max-width: 72rem; margin: 0 auto; }
  #health { color: var(--dim); font-size: .8rem; margin-bottom: 1rem; }
  #error {
    display: flex; align-items: baseline; gap: 1rem;
    background: #2a1518; color: #e8a9a9; border: 1px solid #6b2f35;
    padding: .5rem .75rem; margin-bottom: 1rem; font-size: .85rem;
  }
  #error button {
    margin-left: auto; background: none; border: 1px solid #6b2f35;
    color: inherit; font: inherit; font-size: .8rem;
    padding: 0 .5rem; cursor: pointer;
  }
  select.status {
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px;
    font: inherit; font-size: .85rem; padding: .1rem .3rem;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: .8rem; }
  td.id { color: var(--accent); white-space: nowrap; }
  td.status { white-space: nowrap; }

  /* MFE-7: universal click-through + the ticket page. */
  header h1 a { color: inherit; text-decoration: none; }
  tbody#board tr { cursor: pointer; }
  tbody#board tr:hover td { background: #1a1a22; }
  td.id a { color: inherit; text-decoration: none; }
  td.id a:hover { text-decoration: underline; }
  #ticket-page .crumbs { margin: 0 0 .75rem; }
  #ticket-page .crumbs a { color: var(--dim); text-decoration: none; }
  #ticket-page .crumbs a:hover { color: var(--accent); }
  article.ticket h2 { font-size: 1.05rem; margin: .25rem 0 1rem; }
  article.ticket h2 .id { color: var(--accent); margin-right: .6rem; }
  dl.meta {
    display: flex; flex-wrap: wrap; gap: .35rem 1.75rem; margin: 0 0 1rem;
    padding: .6rem .8rem; background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px;
  }
  dl.meta div { display: flex; gap: .5rem; }
  dl.meta dt { color: var(--dim); }
  dl.meta dd { margin: 0; }
  section.dag h3, section.bodysec h3 {
    font-size: .8rem; color: var(--dim); font-weight: 500; margin: 1.1rem 0 .35rem;
  }
  #blockers, #unlocks { list-style: none; margin: 0; padding: 0; }
  #blockers li, #unlocks li { padding: .15rem 0; }
  #blockers a, #unlocks a { color: var(--accent); text-decoration: none; }
  #blockers a:hover, #unlocks a:hover { text-decoration: underline; }
  .bstatus {
    margin-left: .6rem; padding: 0 .4rem; font-size: .8rem;
    border: 1px solid var(--line); border-radius: 3px;
  }
  .btitle { margin-left: .6rem; color: var(--dim); }
  .dangling { color: var(--dead); }
  .none, .loading { color: var(--dim); }
  #notfound h2 { color: var(--dead); font-size: 1.05rem; }
  details.frontmatter { margin: 0 0 .75rem; }
  details.frontmatter summary { cursor: pointer; color: var(--dim); font-size: .8rem; }
  details.frontmatter pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: .6rem .8rem; overflow-x: auto; margin: .35rem 0 0;
  }
  .md { line-height: 1.6; max-width: 56rem; }
  .md h1 { font-size: 1.1rem; margin: 1.1rem 0 .4rem; }
  .md h2, .md h3, .md h4 { font-size: 1rem; margin: 1.1rem 0 .4rem; }
  .md code {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 3px; padding: 0 .25rem;
  }
  .md pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: .6rem .8rem; overflow-x: auto;
  }
  .md pre code { border: 0; padding: 0; background: none; }
  .md a { color: var(--accent); }
  .md blockquote {
    border-left: 3px solid var(--line); margin: .5rem 0;
    padding: 0 .8rem; color: var(--dim);
  }
  .md table { width: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: .25rem .5rem; }

  /* AGS-12: the persistent left nav — manifest's sidebar pattern in this
     palette. A full-height two-column grid: the nav column collapses
     (and the content reflows) when the nav is hidden. */
  #app { display: grid; grid-template-columns: 360px minmax(0, 1fr); height: 100vh; }
  #app.nonav { grid-template-columns: minmax(0, 1fr); }
  #app.nonav #nav { display: none; }
  #app .content { min-width: 0; height: 100vh; overflow: auto; }
  #nav {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  #nav .brand {
    display: flex; align-items: baseline; gap: .4rem;
    padding: 12px 14px; font-weight: 600; border-bottom: 1px solid var(--line);
  }
  #nav .brand .muted { color: var(--dim); font-weight: 400; }
  #nav .nav-hide, header .nav-reveal {
    background: none; border: 1px solid var(--line); color: var(--dim);
    font: inherit; font-size: 11px; line-height: 1.3; padding: 0 6px;
    border-radius: 4px; cursor: pointer;
  }
  #nav .nav-hide { margin-left: auto; }
  #nav .nav-hide:hover, header .nav-reveal:hover { color: var(--ink); border-color: var(--accent); }
  #nav .tree-scroll { flex: 1; overflow: auto; min-height: 0; }
  #nav .tree { padding: 6px 0; font-size: 12.5px; line-height: 1.55; white-space: nowrap; }
  #nav .row {
    display: flex; align-items: center; gap: 4px; padding: 0 10px;
    cursor: pointer; color: var(--ink); text-decoration: none;
  }
  #nav .row:hover { background: #1e1e26; }
  #nav .row.sel { background: #1f2a3d; box-shadow: inset 3px 0 0 var(--accent); border-radius: 2px; }
  #nav .row.sel .label { font-weight: 600; }
  #nav .row.sel .code { color: var(--accent); border-color: #3a4a66; }
  #nav .prefix { color: #3a3a46; white-space: pre; user-select: none; }
  #nav .toggle { width: 1ch; color: var(--dim); }
  #nav .toggle.clickable { cursor: pointer; }
  #nav .code {
    font-size: 10.5px; font-weight: 600; letter-spacing: .02em; color: #9aa4b8;
    background: #1e2029; border: 1px solid #2c2e3a; border-radius: 5px;
    padding: 0 5px; white-space: nowrap;
  }
  #nav .label { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #nav .tag {
    flex: none; font-size: 10px; padding: 0 5px; border-radius: 6px;
    border: 1px solid var(--line); color: var(--dim); background: var(--bg);
  }
  #nav .tag.roll { font-variant-numeric: tabular-nums; }
  #nav .tag.st-ready { color: var(--accent); border-color: #2f4a70; }
  #nav .tag.st-blocked { color: #e8a9a9; border-color: #6b2f35; }
  #nav .tag.st-complete { color: var(--live); border-color: #2f5a34; }
  #nav .tag.st-idea { color: #c9a6f0; border-color: #4a3560; }
  #nav .tag.st-epic { color: #e0b96a; border-color: #5d4a22; }
  #nav .tag.st-superseded { text-decoration: line-through; }
  #nav .group.collapsed .kids { display: none; }
  /* AGS-13: kinds. The board and the ticket page spell the word; the nav
     marks each leaf with its kind's glyph, tinted per kind. */
  td.kind, dd.kind { color: var(--dim); }
  #nav .toggle.kind { color: #9aa4b8; }
  #nav .leaf[data-kind="scope"] .toggle.kind { color: #e0b96a; }
  #nav .leaf[data-kind="build"] .toggle.kind { color: var(--accent); }
  #nav .leaf[data-kind="execution"] .toggle.kind { color: var(--live); }
  #nav .leaf[data-kind="gap"] .toggle.kind { color: #e8a9a9; }
  #nav .leaf[data-kind="spike"] .toggle.kind { color: #c9a6f0; }
  /* AGS-14: mermaid placeholders → diagrams. Palette tokens only. */
  .md .mermaid {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: .6rem .8rem; margin: .5rem 0; overflow-x: auto;
  }
  .md .mermaid pre { margin: 0; padding: 0; background: none; border: 0; }
  .md .mermaid[data-state="rendering"] pre { color: var(--dim); }
  .md .mermaid[data-state="done"] svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .md .mermaid[data-state="error"] { border-color: var(--dead); }
  .md .mermaid .mermaid-error {
    color: var(--dead); margin: 0 0 .6rem; white-space: pre-wrap; font-size: .85rem;
  }
</style>
</head>
<body></body>
</html>
