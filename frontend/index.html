  /* ── DESIGN-38: the shell in the grammar (DESIGN-34's first screen, the
     landing page's family): a bar with the carpet wordmark and the live
     mark, mono uppercase small labels, the board a ruled table whose
     statuses are cells, rows that invert to ink under the cursor, the nav's
     carpet pip, a faint 48px grid under the content column. Everything
     paints through the contract's tokens (or a color-mix of them), so light,
     dark and every theme follow; these rules restyle, the markup and its
     ids stay. ── */
  /* The carpet (src/carpet.rs): each cell a status of the lifecycle, in
     order, the accent last — the landing page's `.mark`. */
  .carpet { display: block; flex: none; overflow: visible; }
  .carpet .c1 { fill: var(--st-epic-fg); }
  .carpet .c2 { fill: var(--st-pending-fg); }
  .carpet .c3 { fill: var(--st-ready-fg); }
  .carpet .c4 { fill: var(--st-coding-fg); }
  .carpet .c6 { fill: var(--st-in-review-fg); }
  .carpet .c7 { fill: var(--st-complete-fg); }
  .carpet .c8 { fill: var(--st-ready-fg); }
  .carpet .c9 { fill: var(--accent); }
  /* The bar: the panel's ground, one line of 48px, everything centred. */
  header {
    align-items: center; gap: .35rem .9rem; min-height: 48px; padding: .4rem 1rem;
    background: var(--panel);
  }
  header h1 { font-family: var(--font-display); font-size: calc(16px * var(--text-scale)); letter-spacing: -.02em; line-height: 1; }
  header h1 a.wordmark { display: inline-flex; align-items: center; gap: 9px; }
  header .carpet.mark { width: 16px; height: 16px; }
  header .hlink {
    font-family: var(--mono); font-size: calc(11px * var(--text-scale)); line-height: 1.6; white-space: nowrap;
    text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
  }
  header .hlink[aria-current] { color: var(--ink); }
  header .hlink:hover { color: var(--accent); }
  /* A count is a filled chip (the inputs' and Needs you's alike). */
  header .hlink .hbadge {
    margin-left: .45rem; padding: 0 6px; border-radius: var(--radius-sm); letter-spacing: 0;
    font-family: var(--mono); font-size: calc(10.5px * var(--text-scale)); font-variant-numeric: tabular-nums; vertical-align: 0;
  }
  /* The health line is the page's crumb: the version and the count, then
     the page's name in the accent. */
  #health { font-family: var(--mono); font-size: calc(11.5px * var(--text-scale)); font-variant-numeric: tabular-nums; }
  #health .tag { color: var(--accent); }
  #health .tag::before { content: "·"; color: var(--muted); margin: 0 .6em; }  header #who, header .theme, header .hbtn, header .nav-reveal, header button.fbtn {
    font-family: var(--mono); font-size: calc(11px * var(--text-scale));
  }
  /* The right of the bar: the global filter, then who, the live mark and
     the buttons, each group pushed right — so when the column is too narrow
     for one line (the app's bar holds more than the mock's), the second
     line is the right-hand group, flush right. */
  header button.fbtn { margin-left: auto; }
  header #conn, header #who { margin-left: auto; }
  header #who + #conn { margin-left: .2rem; }
  header .hbtn, header .theme, header .nav-reveal { border-radius: var(--radius-sm); padding: 1px 7px; text-transform: lowercase; background: var(--card); }
  /* The live mark: a cell in the connection's colour, pulsing while live. */
  #conn {
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    font-family: var(--mono); font-size: calc(11.5px * var(--text-scale));
  }
  #conn .cell { flex: none; width: 8px; height: 8px; border-radius: var(--radius-xs); background: currentColor; }
  #conn.live .cell { animation: menger-pulse 2.4s ease-in-out infinite; }
  @keyframes menger-pulse { 50% { opacity: .4; } }
  /* The grid: faint 48px rules under the content column, in the ink. */
  #app .content {
    background-image:
      linear-gradient(color-mix(in srgb, var(--ink) 5%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--ink) 5%, transparent) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  /* The board: a ruled table on the card's ground — heads mono uppercase on
     the panel, a hairline under every row, ids in the accent, kinds in their
     colours, the status a cell of one width, tabular numbers throughout. One
     line per row still (MFE-12): the cell's height is pinned. */
  table.board {
    background: var(--card); border: var(--border) solid color-mix(in srgb, var(--muted) 40%, var(--line));
    font-size: calc(12.5px * var(--text-scale)); font-variant-numeric: tabular-nums;
  }
  table.board th {
    font-family: var(--mono); font-size: calc(10.5px * var(--text-scale)); font-weight: var(--weight-medium);
    letter-spacing: .12em; text-transform: uppercase; color: var(--muted); background: var(--panel);
    padding: 8px 12px; border-bottom: var(--border) solid color-mix(in srgb, var(--muted) 40%, var(--line));
  }
  tbody#board td { padding: 8px 12px; transition: background-color var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease); }
  tbody#board tr[data-ticket-id] td:nth-child(2) { font-family: var(--sans); font-size: calc(13.5px * var(--text-scale)); }
  tbody#board td.id { font-weight: var(--weight-medium); }

  tbody#board select.status, tbody#board span.status.chip {

  /* The nav: its head as tall as the bar, in the bar's small mono voice; the

  #nav .brand {

  #nav .code { background: transparent; border-color: transparent; padding: 0; color: var(--accent); font-weight: var(--weight-medium); letter-spacing: 0; }
  #nav .row { transition: background-color var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease); }
  #nav .row:not(.sel):not(.pending):hover { background: var(--ink); color: var(--bg); }

  /* ── LOOK-2: the shell as ARCHIVE-5's mockup draws it (figures 1–3 and 6)

     rows, the status as a sentence-case cell, menus and dialogs as cards on
     the stronger hairline, the toast and the selection bar in ink. The
     mockup's `--line-2` is the contract's `--tree-line`, its `--accent-ink`
     is `--bg`; everything here is a token or a color-mix of tokens. These
     rules restyle; no id, route or behaviour moves. ── */
  /* The bar: the words lower case, quiet, 18px apart; the page's own word in ink. */
  header { gap: .35rem 18px; }
  header .hlink {
    font-size: calc(12px * var(--text-scale)); text-transform: none; letter-spacing: 0; line-height: 1.5;
  }
  header .hlink:hover { color: var(--ink); }

  /* A count: a filled cell in the accent, square-cornered; quiet at 0. */
  header .hlink .hbadge {
    margin-left: 6px; padding: 0 6px; border-radius: var(--radius-sm); line-height: 1.5;
    font-size: calc(11px * var(--text-scale)); font-weight: var(--weight-strong); vertical-align: 0;
    background: var(--accent); color: var(--bg); border: 0;
  }
  header .hlink .hbadge.zero { background: transparent; color: var(--muted); font-weight: var(--weight-normal); box-shadow: inset 0 0 0 var(--border) var(--line); }
  /* The right of the bar: the live mark, then plain words for annotate and

  header .hbtn, header .theme {
    background: transparent; border: var(--border) solid transparent; color: var(--muted);
    font-size: calc(11.5px * var(--text-scale)); line-height: 1.5; padding: 1px 6px; border-radius: var(--radius-sm); text-transform: lowercase;
  }
  header .hbtn:hover, header .theme:hover { color: var(--ink); border-color: var(--tree-line); }
  header .hbtn.on { color: var(--accent); border-color: var(--accent); background: var(--sel); }
  header .nav-reveal { background: var(--card); border-color: var(--tree-line); color: var(--ink); }
  /* The tools: every Filter and Saved button, the mockup's `.tool` — 11px
     words in a card-faced box on the stronger hairline; open, the accent's. */
  button.fbtn, header button.fbtn {
    font-size: calc(11px * var(--text-scale)); line-height: 1.5; padding: 2px 8px; gap: 5px;
    background: var(--card); color: var(--ink); border: var(--border) solid var(--tree-line); border-radius: var(--radius);
    text-transform: lowercase;
  }
  button.fbtn svg { width: 11px; height: 11px; }
  button.fbtn:hover { border-color: var(--accent); color: var(--accent); }
  button.fbtn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); background: var(--sel); }
  button.fbtn .fbadge { border-radius: var(--radius-sm); }
  .fbar .pill, .bempty .pill { font-size: calc(11px * var(--text-scale)); line-height: 1.6; border-color: var(--tree-line); border-radius: var(--radius); }
  .fbar .pill > *, .bempty .pill > * { border-left-color: var(--line); }
  /* The page's crumb and its gutters: 16px over 28px, the content's whole width. */
  main { padding: calc(16px * var(--space)) calc(28px * var(--space)) calc(40px * var(--space)); }
  #health { margin-bottom: 14px; }
  .bbar { margin-bottom: 14px; }
  /* The nav: its head the bar's quiet small words, its rows 24px. */
  #nav .brand {
    font-size: calc(11.5px * var(--text-scale)); text-transform: lowercase; letter-spacing: 0;
    font-weight: var(--weight-medium); color: var(--ink);
  }
  #nav .nview { border-color: var(--tree-line); border-radius: var(--radius); }
  #nav .nview-b { background: var(--card); font-size: calc(11px * var(--text-scale)); line-height: 1.5; padding: 1px 7px; }
  #nav .nview-b + .nview-b { border-left-color: var(--tree-line); }
  #nav .nview-b[aria-pressed="true"] { background: var(--sel); color: var(--accent); font-weight: var(--weight-normal); }
  #nav .nav-hide { background: var(--card); border-color: var(--tree-line); line-height: 1.5; }
  #nav .nbar { padding: 0 12px 12px; border-bottom: var(--border) solid var(--line); }
  #nav .tree { padding: 6px 0; font-size: calc(12px * var(--text-scale)); line-height: 1.5; }
  #nav .row { height: 24px; gap: 6px; padding: 0 10px 0 8px; }
  #nav .row.sel { box-shadow: inset 2px 0 0 var(--accent); border-radius: 0; }
  #nav .row.sel .label { font-weight: var(--weight-normal); }
  #nav .row:focus { border-radius: 0; }
  /* The status cell: one width, sentence case — the word as the server says it. */
  #nav .tag, tbody#board select.status, tbody#board span.status.chip, #palette-list li .tag {
    width: calc(86px * var(--text-scale)); text-transform: none; letter-spacing: .04em;
    font-size: calc(10.5px * var(--text-scale)); border-radius: var(--radius-sm);
  }
  #nav .tag { line-height: 1.6; padding: 0 4px; }
  /* A roll-up is a count in a ruled box, as wide as its digits. */
  #nav .tag.roll {
    width: auto; min-width: 2.6em; padding: 0 5px; font-size: calc(11px * var(--text-scale));
    color: var(--muted); background: transparent; border-color: var(--line); letter-spacing: 0;
  }
  /* The board: the table on the stronger hairline, rows on the light one. */
  table.board { border-color: var(--tree-line); border-radius: var(--radius); }
  table.board th { border-bottom-color: var(--tree-line); }
  tbody#board td { padding: 7px 12px; }
  tbody#board td.id { font-weight: var(--weight-medium); }
  tbody#board tr.picked td { background: var(--sel); }

  tbody#board tr[data-ticket-id] td:nth-child(5):empty::before { content: "—"; color: var(--muted); }
  .chip.blk, #ticket-page .chip.blk {

  /* The selection: the mockup's bar — ink, its count bold, clear with its key. */
  #nav .nsel {
    background: var(--ink); color: var(--bg); border-top: 0; padding: 7px 8px 7px 14px;

  #nav .nsel-clear { color: var(--bg); opacity: .6; text-decoration: none; margin-left: auto; }
  #nav .nsel-clear::after {

    border: var(--border) solid currentColor; border-bottom-width: 2px; border-radius: var(--radius-sm); display: inline-block;
  }
  #nav .nsel-clear:hover { color: var(--bg); opacity: 1; }
  /* Menus: a card on the stronger hairline, 6px corners, a deep soft shadow;
     items 5px 9px; the one under the cursor or the keys tinted with the bar. */
  #tmenu, #tagmenu, .fmenu {
    background: var(--card); border: var(--border) solid var(--tree-line); border-radius: var(--radius-lg);
    box-shadow: 0 18px 50px var(--shadow); font-size: calc(12px * var(--text-scale));
  }
  #tmenu, #tagmenu { padding: 5px; }
  #tmenu .item, #tagmenu .item, .fmenu .frow { padding: 5px 9px; border-radius: var(--radius); }
  #tmenu .item:hover, #tmenu .item:focus, #tagmenu .item:hover, #tagmenu .item:focus,
  .fmenu .frow.hi, .fmenu.smenu .srow:hover, .fmenu.smenu .srow:focus-within {
    background: var(--row-sel); color: var(--ink); box-shadow: inset 2px 0 var(--accent);
  }
  .fmenu .frow.cat.open { background: var(--sel); }
  #tmenu .h, #tagmenu .h { padding: 5px 9px 7px; border-bottom-color: var(--line); }
  #tmenu .rule, #tagmenu .rule { margin: 4px 2px; }
  #tmenu .sub { border-top-color: var(--line); }
  .fmenu .fhead {
    font-family: var(--mono); font-size: calc(10px * var(--text-scale)); font-weight: var(--weight-medium);
    letter-spacing: .12em; padding: 5px 9px 3px;
  }
  .fmenu .fpane { padding: 5px; }
  .fmenu .fmain { background: var(--panel); }
  .fmenu .fsub { border-left-color: var(--line); }
  .fmenu input.fsearch { background: var(--card); }
  .fmenu .box { border-color: var(--tree-line); background: var(--card); }
  .fmenu .box[data-state="on"], .fmenu .box[data-state="mixed"] { background: var(--accent); border-color: var(--accent); }
  .fmenu .frow .tag, #tmenu .sub .st, #tmenu .flat .st, #tmenu .h .tag, #tagmenu .h .tag, #tmenu .pick .tag { border-radius: var(--radius-sm); }
  /* Dialogs: the overlay's scrim, then a card — 8px corners, the deep
     shadow; the title in the display face; the buttons on a panel foot. */
  .overlay { background: var(--scrim); }
  .dialog { background: var(--card); border-color: var(--tree-line); box-shadow: 0 18px 50px var(--shadow); }
  #delete, #save-as, #leave { padding: 22px 26px 0; gap: 10px; font-family: var(--sans); }
  #delete h2, #save-as h2, #leave h2 {
    font-family: var(--font-display); font-size: calc(21px * var(--text-scale)); font-weight: var(--weight-strong);
    letter-spacing: -.015em; line-height: 1.25;
  }
  #delete p, #save-as p, #leave p { color: var(--muted); font-size: calc(13.5px * var(--text-scale)); }
  #delete .sacts, #save-as .sacts, #leave .sacts {
    justify-content: flex-start; margin: 8px -26px 0; padding: 12px 26px;
    border-top: var(--border) solid var(--line); background: var(--panel);
  }
  /* The button: mono, upper case, an ink hairline; the one that acts filled. */
  #delete .sacts button, #save-as .sacts button, #leave .sacts button, #toast button, #ftoast button {
    font-family: var(--mono); font-size: calc(11px * var(--text-scale)); letter-spacing: .08em; text-transform: uppercase;
    padding: 6px 12px; background: transparent; color: var(--ink); border: var(--border) solid var(--ink); border-radius: var(--radius);
    transition: transform var(--motion-fast) var(--ease);
  }
  #delete .sacts button:hover, #save-as .sacts button:hover, #leave .sacts button:hover { transform: translateY(-1px); color: var(--ink); border-color: var(--ink); }
  #save-as .sacts button.primary, #leave .sacts button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  #save-as .sacts button.primary:hover, #leave .sacts button.primary:hover { color: var(--bg); border-color: var(--accent); }
  #delete .sacts button.danger, #delete .sacts button.danger:hover { background: var(--err-fg); border-color: var(--err-fg); color: var(--bg); }
  #save-as .sname input, #save-as .sname input:focus { background: var(--bg); border-color: var(--tree-line); border-radius: var(--radius-md); }
  #save-as .sname input:focus { border-color: var(--accent); }
  #save-as .sname { font-family: var(--mono); font-size: calc(10px * var(--text-scale)); letter-spacing: .12em; text-transform: uppercase; }
  #save-as .sname input { text-transform: none; letter-spacing: 0; font-family: var(--sans); font-size: calc(13.5px * var(--text-scale)); }
  /* Toasts: ink, the page's colour for their words, its buttons ruled in it. */
  #toast, #ftoast {
    background: var(--ink); color: var(--bg); border: 0; border-radius: var(--radius-lg);
    box-shadow: 0 18px 50px var(--shadow); padding: 12px 10px 12px 16px; align-items: center; gap: 12px;
    font-family: var(--sans); font-size: calc(14px * var(--text-scale));
  }
  #toast.manual { box-shadow: inset 4px 0 var(--err-fg), 0 18px 50px var(--shadow); }
  #toast .code, #ftoast .code { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
  #toast button, #ftoast button {
    color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); padding: 5px 10px; font-weight: var(--weight-strong);
  }
  #toast button:hover, #ftoast button:hover { background: var(--bg); color: var(--ink); border-color: var(--bg); }
  @keyframes menger-toast-in { from { transform: translateY(140%); opacity: 0; } }
  #toast, #ftoast { animation: menger-toast-in .5s cubic-bezier(.2, .9, .25, 1.15) both; }
  /* The board in a narrow column: the id, the title and the status — the
     kind, severity and blockers are the ticket's page's (and the nav's

  @container (max-width: 60rem) {
    table.board :is(th.c-kind, th.c-sev, th.c-blk) { display: none; }
    tbody#board tr[data-ticket-id] td:is(:nth-child(3), :nth-child(5), :nth-child(6)) { display: none; }
    table.board th.c-id { width: 7.5rem; }
    table.board th.c-status { width: calc(86px * var(--text-scale) + 24px); }
    tbody#board td, table.board th { padding-left: 10px; padding-right: 10px; }
  }
  /* (At a phone's width the shell is APP-50's — the bar along the bottom
     edge, below; LOOK-2's nav band over the page is gone.) */
  /* ── LOOK-3: the ticket page as ARCHIVE-5's figure 4 draws it — the crumb
     in the bar's small mono voice, the head (the id a cell, the title in the
     display face at 26px), the fields a grid of small upper-case labels over
     their values, the body a card on the stronger hairline, every section's
     head the mockup's `.lbl` (mono, tracked, a rule after it), references
     as ruled chips (struck through and dashed for what is gone, ready for
     ARCHIVE-3), a banner with a hatched edge, children and relations as a
     ruled list, the Conversation with an avatar per author. Then APP-30's
     section dock (APP-31's mockup): a column at ≥ 1760 (LOOK-7: 1920 less 10em), a rail of ticks to
     640, a pill and a sheet below. Tokens only (THEME-2; the mockup's
     `--line-2` is `--tree-line`, its `--accent-ink` is `--bg`). ── */
  /* The crumb: mono, quiet, the ids in the accent. */
  #ticket-page .crumbs { font-family: var(--mono); font-size: calc(11.5px * var(--text-scale)); color: var(--muted); margin: 0 0 14px; }
  #ticket-page .crumbs .crumb { font-size: calc(11.5px * var(--text-scale)); color: var(--accent); }
  #ticket-page .crumbs .sep { padding: 0 2px; }
  /* The head. */
  #ticket-page article.ticket > h2 {
    font-family: var(--font-display); font-size: calc(26px * var(--text-scale)); font-weight: var(--weight-strong);

  }
  #ticket-page article.ticket > h2 .code {
    font-size: calc(11px * var(--text-scale)); font-weight: var(--weight-medium); padding: 2px 8px; letter-spacing: 0;

  }
  /* The fields: the mockup's `.props` — labels over values, a grid that wraps. */
  #ticket-page aside.props { gap: 10px 28px; padding: 0 0 18px; margin-bottom: 22px; border-bottom-color: var(--tree-line); font-size: calc(12.5px * var(--text-scale)); }
  #ticket-page aside.props dl.meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, max-content)); gap: 12px 28px; flex: 1 1 100%; }
  #ticket-page aside.props dl.meta div { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  #ticket-page aside.props dl.meta dt {
    font-family: var(--mono); font-size: calc(10px * var(--text-scale)); font-weight: var(--weight-medium);
    letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  #ticket-page aside.props dl.meta dd { font-size: calc(12.5px * var(--text-scale)); }
  #ticket-page aside.props dl.meta div:has(> #t-labels) { grid-column: span 2; }
  #ticket-page aside.props dl.meta dd.status { border-radius: var(--radius-sm); font-family: var(--mono); font-size: calc(11px * var(--text-scale)); letter-spacing: .04em; padding: 1px 8px; }
  #ticket-page dd#t-commits .commit, #ticket-page dd#t-comments a { font-size: calc(11.5px * var(--text-scale)); }
  #ticket-page aside.props .stamps { font-family: var(--mono); font-size: calc(10.5px * var(--text-scale)); flex: 1 1 100%; }
  /* A reference: the mockup's `.chip`; gone (ARCHIVE-3's archived, a
     tombstone) struck through on a dashed edge, still a link. */
  #ticket-page .code {
    font-size: calc(10.5px * var(--text-scale)); font-weight: var(--weight-medium); line-height: 1.5; color: var(--accent);
    background: transparent; border: var(--border) solid var(--tree-line); border-radius: var(--radius-sm); padding: 0 6px; white-space: nowrap;
  }
  #ticket-page a.code:hover { background: var(--sel); }
  #ticket-page :is(.code, .chip).gone, .chip.gone {

  }
  /* A banner: the mockup's archived banner — a ruled card on the panel, a
     hatched edge, the lane's word in mono; the global filter's notice is
     one, over the head. */
  #ticket-page .tbanner, #ticket-page .tout {
    position: relative; overflow: hidden; order: 0; margin: 0 0 16px; padding: 12px 14px 12px 22px;
    background: var(--panel); border: var(--border) solid var(--tree-line); border-radius: var(--radius-lg);
    font-size: calc(13px * var(--text-scale)); color: var(--muted);
  }
  #ticket-page :is(.tbanner, .tout)::before {

    background: repeating-linear-gradient(-45deg, var(--muted) 0 3px, transparent 3px 6px);

  /* The body: a card on the stronger hairline. Its ground is the page's:

  #ticket-page article.ticket > .mscope-frame {

  }
  /* Every section's head: the mockup's `.lbl`, a rule running after it. */
  #ticket-page section.kidsec h3, #ticket-page section.histsec h3, #ticket-page section.convsec h3, #ticket-page aside.props section.dag h3 {
    display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: calc(10.5px * var(--text-scale));

  }

  #ticket-page :is(section.kidsec, section.histsec, section.convsec) { border-top: 0; margin-top: 26px; padding-top: 0; }
  #ticket-page section.kidsec .roll { border-radius: var(--radius-sm); font-size: calc(10.5px * var(--text-scale)); letter-spacing: 0; }

  #ticket-page ul#children, #ticket-page ul#blockers, #ticket-page ul#unlocks {
    border: var(--border) solid var(--line); border-radius: var(--radius-md); overflow: hidden; background: var(--card);

  #ticket-page :is(ul#children, ul#blockers, ul#unlocks) li:hover { background: var(--hover); }
  #ticket-page .bstatus { width: calc(86px * var(--text-scale)); border-radius: var(--radius-sm); font-size: calc(10.5px * var(--text-scale)); letter-spacing: .04em; }
  #ticket-page aside.props section.dag { border-top: 0; padding-top: 0; column-gap: 28px; }
  #ticket-page aside.props section.dag h3 { margin-top: 10px; }
  #ticket-page aside.props section.dag .none { font-size: calc(12.5px * var(--text-scale)); }
  /* The Conversation: the mockup's `.msg` — an avatar, who and when in mono, the words. */

  #ticket-page section.convsec li.cpost[data-state="resolved"] .cav { border-color: var(--live); color: var(--live); }
  #ticket-page section.convsec .chead { font-family: var(--mono); font-size: calc(11px * var(--text-scale)); color: var(--muted); gap: 6px; margin-bottom: 2px; }
  #ticket-page section.convsec .cwho { font-weight: var(--weight-medium); color: var(--muted); }
  #ticket-page section.convsec .cwho::after { content: " ·"; }
  #ticket-page section.convsec .cwhen { font-size: calc(11px * var(--text-scale)); }
  #ticket-page section.convsec :is(.cflip, .csend) {

  }
  #ticket-page section.convsec .csend { border-color: var(--ink); padding: 5px 12px; }
  #ticket-page section.convsec textarea.cbox { border-color: var(--tree-line); border-radius: var(--radius-md); font-size: calc(13.5px * var(--text-scale)); }
  #ticket-page section.convsec.dock-flash, #conversation.dock-flash { animation: menger-dock-flash var(--motion-flash) var(--ease); }
  @keyframes menger-dock-flash { 0%, 35% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
  /* A narrow column: the relations one under the other. */
  @container (max-width: 44rem) {

  /* ── The section dock (APP-30, APP-31). ── */
  #tdock {
    display: flex; flex-direction: column; background: var(--card); border: var(--border) solid var(--tree-line);
    border-radius: var(--radius-2xl); box-shadow: 0 10px 30px var(--shadow); font-family: var(--mono);
    font-size: calc(12px * var(--text-scale)); overflow: hidden; z-index: 6;
  }
  #tdock button { font: inherit; color: inherit; background: none; border: 0; text-align: left; cursor: pointer; }
  #tdock kbd, #tdock-pill kbd {
    font: var(--weight-medium) calc(10px * var(--text-scale))/14px var(--mono); color: var(--muted); background: var(--card);
    border: var(--border) solid var(--tree-line); border-bottom-width: 2px; border-radius: var(--radius-sm); padding: 0 4px;
  }
  #tdock .dhead { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; border-bottom: var(--border) solid var(--line); }
  #tdock .dhead h2 { margin: 0; font: var(--weight-medium) calc(10px * var(--text-scale))/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  #tdock .dhead .pos { margin-left: auto; font-size: calc(10.5px * var(--text-scale)); color: var(--muted); font-variant-numeric: tabular-nums; }
  #tdock button.waiting {
    display: flex; align-items: center; gap: 8px; margin: 8px 8px 2px; padding: 7px 10px; border-radius: var(--radius-lg);
    background: var(--ask-bg); color: var(--ask); border: var(--border) solid var(--ask-line); font-weight: var(--weight-strong); font-size: calc(11.5px * var(--text-scale));
  }
  #tdock button.waiting kbd { margin-left: auto; }
  #tdock ol.dlist { list-style: none; margin: 0; padding: 6px 0 8px; overflow-y: auto; min-height: 0; flex: 1; }
  #tdock ol.dlist li button {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 12px 4px 14px; color: var(--muted);
    border-left: 2px solid transparent; line-height: 1.35;
    transition: color var(--motion-fast) var(--ease), background-color var(--motion-fast) var(--ease);
  }
  #tdock ol.dlist li button:hover, #tdock ol.dlist li button:focus-visible { color: var(--ink); background: var(--hover); }
  #tdock ol.dlist .n { font-size: calc(10px * var(--text-scale)); color: var(--tree-line); width: 16px; flex: none; }
  #tdock ol.dlist .l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tdock ol.dlist .mini { margin-left: auto; font-size: calc(10px * var(--text-scale)); flex: none; }
  #tdock ol.dlist li.s.on > button { color: var(--ink); border-left-color: var(--accent); background: var(--sel); font-weight: var(--weight-medium); }
  #tdock ol.dlist li.s:is(.on, .seen) .n { color: var(--accent); }
  #tdock ol.dlist li.s .mini { color: var(--ask); }
  /* An input: a row of its own under its section — amber while it waits, an
     amber ring once answered, green once decided. */
  #tdock ol.dlist li.i button { padding-left: 38px; font-size: calc(11.5px * var(--text-scale)); }
  #tdock .dot, #tdock-sheet .dot { width: 8px; height: 8px; border-radius: var(--radius-pill); flex: none; }
  #tdock ol.dlist li.i.open button { color: var(--ask); font-weight: var(--weight-strong); }
  #tdock ol.dlist li.i.open .dot { background: var(--ask); box-shadow: 0 0 0 3px var(--ask-bg); animation: menger-ask-ping 2s ease-in-out infinite; }
  #tdock ol.dlist li.i.answered button { color: var(--ask); }
  #tdock ol.dlist li.i.answered .dot { border: 2px solid var(--ask); }
  #tdock ol.dlist li.i.decided .dot { background: var(--live); }
  #tdock ol.dlist li.i.decided .mini { color: var(--live); }
  @keyframes menger-ask-ping { 50% { box-shadow: 0 0 0 5px transparent; } }
  #tdock .dfoot { border-top: var(--border) solid var(--line); padding: 7px 12px; display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: calc(10.5px * var(--text-scale)); }
  #tdock .rail { display: none; }
  #tdock-pill, #tdock-sheet, #tdock-scrim { display: none; }
  /* ≥ 1760 (LOOK-7: 1920 less 10em): a column of its own at the right, sticky, never over the body. */
  @media (min-width: 1760px) {
    #ticket-page:has(> #tdock) { display: grid; grid-template-columns: minmax(0, 1fr) calc(248px * var(--text-scale)); column-gap: 24px; align-items: start; }
    #ticket-page:has(> #tdock) > :not(#tdock), #ticket-page:has(> #tdock) article.ticket > * { grid-column: 1; }
    #ticket-page > #tdock { grid-column: 2; grid-row: 1 / span 40; position: sticky; top: 16px; max-height: calc(100vh - 32px); }
  }
  /* 820–1760: a rail of ticks at the right edge; hover, focus or a tap
     opens the dock over the body. */
  @media (min-width: 821px) and (max-width: 1759.98px) {
    #ticket-page:has(> #tdock) { padding-right: 44px; }
    #ticket-page > #tdock {
      position: fixed; top: 96px; right: 10px; width: 34px; padding: 8px 0; align-items: center;
      transition: width .2s var(--ease);
    }
    #ticket-page > #tdock > :not(.rail) { display: none; }
    #tdock .rail { display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; }
    #tdock .rail i { display: block; width: 12px; height: 3px; border-radius: var(--radius-xs); background: var(--tree-line); }
    #tdock .rail i.tick.on { width: 18px; background: var(--accent); }
    #tdock .rail i.ask { width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--ask); }
    #tdock .rail i.ask.answered { background: transparent; border: 2px solid var(--ask); }
    #tdock .rail i.dec { width: 6px; height: 6px; border-radius: var(--radius-pill); background: var(--live); }
    #ticket-page > #tdock:is(:hover, :focus-within, .open) { width: calc(260px * var(--text-scale)); align-items: stretch; padding: 0; max-height: calc(100vh - 140px); }
    #ticket-page > #tdock:is(:hover, :focus-within, .open) > .rail { display: none; }
    #ticket-page > #tdock:is(:hover, :focus-within, .open) > :is(.dhead, .dfoot, button.waiting) { display: flex; }
    #ticket-page > #tdock:is(:hover, :focus-within, .open) > ol.dlist { display: block; }
  }
  /* ≤ 820 (APP-50's phone shape): no dock — the phone bar's sections place
     (a pill above the tray on a page without the bar), and a sheet when it
     is tapped. */
  @media (max-width: 820px) {
    #ticket-page > #tdock { display: none; }
    #ticket-page article.ticket > .mscope-frame { padding: 4px 16px 20px; }
    #ticket-page article.ticket > h2 { font-size: calc(20px * var(--text-scale)); gap: 8px; }
    #ticket-page aside.props dl.meta { grid-template-columns: repeat(auto-fill, minmax(130px, max-content)); gap: 8px 18px; }
    #ticket-page:has(> #tdock) { padding-bottom: 64px; }
    #tdock-pill {
      display: inline-flex; position: fixed; right: 12px; bottom: 46px; z-index: 25; align-items: center; gap: 8px;
      height: 40px; padding: 0 6px 0 14px; max-width: calc(100vw - 24px); border-radius: var(--radius-pill);
      background: var(--ink); color: var(--bg); border: 0; box-shadow: 0 10px 30px var(--shadow);
      font: calc(12px * var(--text-scale)) var(--mono); cursor: pointer;
      transition: transform .25s var(--ease), opacity .25s var(--ease);
    }
    #tdock-pill .pos { opacity: .6; font-size: calc(11px * var(--text-scale)); flex: none; }
    #tdock-pill .l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; font-weight: var(--weight-medium); }
    #tdock-pill .ask {
      display: inline-flex; align-items: center; gap: 5px; background: var(--ask); color: var(--bg); font-weight: var(--weight-strong);
      font-size: calc(11px * var(--text-scale)); height: 28px; padding: 0 10px; border-radius: var(--radius-pill); flex: none;
    }
    #tdock-pill .ask i { width: 6px; height: 6px; border-radius: var(--radius-pill); background: var(--bg); }
    #tdock-pill.away { transform: translateY(90px); opacity: 0; pointer-events: none; }
    #tdock-scrim { display: block; position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); }
    #tdock-scrim.on { opacity: 1; pointer-events: auto; }
    #tdock-sheet {
      display: flex; flex-direction: column; position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 72vh;
      background: var(--card); border-radius: var(--radius-device) var(--radius-device) 0 0; box-shadow: 0 10px 30px var(--shadow);
      transform: translateY(105%); transition: transform .28s cubic-bezier(.2, .9, .3, 1); font-family: var(--sans);
    }
    #tdock-sheet.on { transform: none; }
    #tdock-sheet button { font: inherit; color: inherit; background: none; border: 0; text-align: left; cursor: pointer; }
    #tdock-sheet .grab { width: 36px; height: 4px; border-radius: var(--radius-xs); background: var(--tree-line); margin: 8px auto 4px; }
    #tdock-sheet .shead { display: flex; align-items: baseline; gap: 8px; padding: 4px 16px 10px; border-bottom: var(--border) solid var(--line); }
    #tdock-sheet .shead h2 { margin: 0; font: var(--weight-strong) calc(15px * var(--text-scale)) var(--sans); }
    #tdock-sheet .shead .id { color: var(--accent); font: calc(12px * var(--text-scale)) var(--mono); }
    #tdock-sheet .shead button { margin-left: auto; color: var(--muted); font: calc(12px * var(--text-scale)) var(--mono); padding: 4px; }
    #tdock-sheet .sscroll { overflow-y: auto; padding: 4px 0 24px; }
    #tdock-sheet h3 { margin: 14px 16px 6px; font: var(--weight-medium) calc(10px * var(--text-scale)) var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

      border-radius: var(--radius-xl); border: var(--border) solid var(--line); font-size: calc(13.5px * var(--text-scale));
    }
    #tdock-sheet .ins button.in.open { background: var(--ask-bg); border-color: var(--ask-line); color: var(--ask); font-weight: var(--weight-strong); }
    #tdock-sheet .ins button.in.open .dot { background: var(--ask); }

    #tdock-sheet .ins button.in.answered .dot { border: 2px solid var(--ask); }

    #tdock-sheet .ins .q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #tdock-sheet ol.slist .n { font: calc(11px * var(--text-scale)) var(--mono); color: var(--muted); width: 18px; }
    #tdock-sheet ol.slist .mini { margin-left: auto; font: var(--weight-strong) calc(11px * var(--text-scale)) var(--mono); color: var(--ask); }
    #tdock-sheet ol.slist li.on button { border-left-color: var(--accent); background: var(--sel); font-weight: var(--weight-strong); }
    #tdock-sheet ol.slist li.on .n { color: var(--accent); }

  /* ── DESIGN-39: the chrome in motion (DESIGN-35's moves, as DESIGN-34's
     first screen plays them; src/motion.rs). How much moves is the Motion
     setting, stamped on <html> as data-motion="full|calm|none" (absent:
     full) — the contract the house components key on too. ── */
  /* The boot: a sheet over the app as the socket connects — the carpet's
     cells light in the lifecycle's colours while the count runs up, then the
     sheet wipes upward and is removed. Never in the way of a click. */
  #boot {
    position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center;
    background: var(--bg); pointer-events: none;
  }
  #boot .boot-in { display: grid; justify-items: center; gap: 18px; }
  #boot .carpet.boot-mark { width: 54px; height: 54px; }
  #boot .boot-mark rect { transition: fill .18s var(--ease); }
  #boot .boot-mark rect:not(.on) { fill: var(--line); }
  #boot .boot-count {
    margin: 0; font-family: var(--mono); font-size: calc(12px * var(--text-scale));
    letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  #boot .boot-count b { color: var(--ink); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }
  #boot.done { animation: menger-wipe .6s cubic-bezier(.7, 0, .2, 1) forwards; }
  @keyframes menger-wipe { to { clip-path: inset(0 0 100% 0); } }
  /* Counters keep their width while they run. */
  .count-up { font-variant-numeric: tabular-nums; }
  /* A change: the status cell sweeps (a translucent bar of its own colour
     across it), the row flashes from the selection tint back to its own. */
  #nav .tag.swap { position: relative; overflow: hidden; }
  #nav .tag.swap::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: currentColor; opacity: .3; transform: translateX(-100%);
    animation: menger-sweep .6s ease-out;
  }
  @keyframes menger-sweep { to { transform: translateX(100%); } }
  /* The board's cell is a <select>, which draws no ::after: the same bar
     is a background layer swept across it. */
  tbody#board .status.swap {
    background-image: linear-gradient(90deg, transparent, color-mix(in srgb, currentColor 32%, transparent) 35% 65%, transparent);
    background-size: 60% 100%; background-repeat: no-repeat;
    animation: menger-sweep-bg .6s ease-out;
  }
  @keyframes menger-sweep-bg { from { background-position: -150% 0; } to { background-position: 250% 0; } }
  tbody#board tr.flash td, #nav .row.flash { animation: menger-flash 1.6s ease-out; }
  @keyframes menger-flash { from { background-color: var(--row-sel); } }
  /* A header count that moves ticks. */
  header .hlink .hbadge.tick { display: inline-block; animation: menger-tick .5s cubic-bezier(.2, .8, .2, 1); }
  @keyframes menger-tick { 30% { transform: translateY(-4px) scale(1.15); } }
  /* A ticket opening: the id comes from its row (a FLIP, inline from
     motion.rs), the title rises out of its line, the body develops. */
  #ticket-page article.ticket.opening > h2 .t { animation: menger-rise .5s cubic-bezier(.2, .8, .2, 1) backwards; }
  @keyframes menger-rise { from { transform: translateY(110%); clip-path: inset(0 0 100% 0); } to { transform: none; clip-path: inset(0 0 0 0); } }
  #ticket-page article.ticket.opening > .mscope-frame { animation: menger-develop .5s ease-out .08s backwards; }
  @keyframes menger-develop { from { filter: blur(8px); opacity: 0; } to { filter: none; opacity: 1; } }
  /* APP-34: the ticket menu opens with a motion — it grows out of the
     corner nearest where it was opened (transform-origin set by
     src/menu/mod.rs's place), a submenu the same, smaller and shorter, from
     its parent row. Closing is instant: the menu is removed, focus returns.
     Calm keeps it (a state change); none (below) stops it. */
  #tmenu { animation: menger-menu-in .14s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes menger-menu-in { from { opacity: 0; transform: scale(.96); } }
  #tmenu .sub { transform-origin: left top; animation: menger-sub-in .1s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes menger-sub-in { from { opacity: 0; transform: scale(.98) translateY(-2px); } }
  html[data-motion="none"] :is(#tmenu, #tmenu .sub) { animation: none; }
  /* The pip: its cells the lifecycle's mix among what the nav shows. */
  #nav .carpet.pip rect { transition: fill .6s var(--ease); }
  .carpet rect.s-pending { fill: var(--st-pending-fg); }
  .carpet rect.s-ready { fill: var(--st-ready-fg); }
  .carpet rect.s-coding { fill: var(--st-coding-fg); }
  .carpet rect.s-in-review { fill: var(--st-in-review-fg); }
  .carpet rect.s-complete { fill: var(--st-complete-fg); }
  /* Settings → Motion: one choice a line, its name then what it does. */
  #settings-motion .motion-choices { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  #settings-motion label.radio { display: flex; align-items: baseline; gap: 8px; width: auto; font-weight: normal; }
  #settings-motion label.radio b { min-width: 4.5em; font-family: var(--mono); font-weight: var(--weight-medium); }
  /* DESIGN-43: Typed text, under Motion's choices, ruled off from them. */
  #settings-motion .typing { margin-top: 14px; padding-top: 12px; border-top: var(--border) solid var(--line); }
  /* ── APP-38 (APP-36's direction A): the tray — the owner's queue as one
     control on the main column's bottom edge, at the right (one ticket: its
     tab; more: the count and the loudest urgency), and a sheet it slides in
     from the bottom, the queue grouped by urgency and answered row by row
     (src/queue.rs). A grid item over the content's cell, so it spans the
     main column whether or not the nav shows; only the control and the
     sheet take the pointer. ── */
  #qtray {
    grid-column: -2 / -1; grid-row: 1; align-self: end; z-index: 900; min-width: 0;
    display: flex; flex-direction: column; align-items: flex-end; margin-right: 14px; position: relative;
    padding: 0 calc(20px * var(--space)); pointer-events: none;
  }
  #qtray.empty { display: none; }
  #app .content { grid-row: 1; grid-column: -2 / -1; }
  #app:has(#qtray:not(.empty)) .content { padding-bottom: 56px; }
  /* An urgency's pair: --u its ink, --ub its ground (APP-17: whenever the
     doc pair, today Coding's, now and blocking the contract's urgent red). */
  #qtray .u-whenever { --u: var(--st-doc-fg); --ub: var(--st-doc-bg); }
  #qtray .u-today { --u: var(--st-coding-fg); --ub: var(--st-coding-bg); }

  /* Motion: none — nothing the app animates moves; calm — the state

  html[data-motion="none"] *, html[data-motion="none"] *::before, html[data-motion="none"] *::after {

  /* Before the script has stamped the setting, the system's preference. */

    html:not([data-motion]) :is(tbody#board td, #nav .row) { transition: none; }

    html:not([data-motion]) #qtray .qc.has-new { outline: 2px solid var(--flash); outline-offset: -2px; }
    html:not([data-motion]) #qtray :is(.qedge, .qarrived) { display: none; }
    html:not([data-motion]) #qtray .qcard { animation: none; }
    html:not([data-motion]) :is(#tmenu, #tmenu .sub) { animation: none; }
  }
  /* ── LOOK-4: every other view in ARCHIVE-5's hand — the pages the mockup
     does not draw (comments, inputs, deployments, the waves, components,

  :is(#comments, #inputs) .lede, #components > h2 + p {

  }
  #comments .lede kbd {
    font: var(--weight-medium) calc(10px * var(--text-scale))/15px var(--mono); color: var(--muted); background: var(--card);
    border: var(--border) solid var(--tree-line); border-bottom-width: 2px; border-radius: var(--radius-sm); padding: 0 5px;

  /* A reference to a ticket: the mockup's `.chip` — mono, a ruled box, the accent. */

    line-height: 1.5; color: var(--accent); background: transparent; border: var(--border) solid var(--tree-line);
    border-radius: var(--radius-sm); padding: 0 6px; white-space: nowrap; text-decoration: none;
  }
  :is(#comments, #inputs, #deployments-page, #components, #waves, #waves-index) a.code:hover,
  #waves .card .off:hover { color: var(--accent); border-color: var(--accent); background: var(--sel); }
  /* A small action: the mockup's `.btn.sm.ghost` — mono upper case, a hairline. */

  #settings button.primary:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  /* A field: the mockup's `.flab` over its `.field`. */
  #comments .cfield {

  #comments .cfield input, #comments .cfield select, #settings input#ws-url, #settings input#test-url, #settings input#keys-search, #settings select {

  #palette.dialog {

  /* At a phone's width: the head a size down, the gutters the shell's. */

  /* ── LOOK-8: motion everywhere, each move under the Motion setting
     (DESIGN-39's contract: html[data-motion="full|calm|none"]). The house
     hand, APP-34's: short — ≤ 200 ms for chrome — ease-out in, faster out,
     from where the thing comes from, never delaying focus or the next key.
     A move is a state change (calm keeps it) unless it says ornament (calm
     stops it, below); none stops every one (the global rule above). What
     the script plays (src/motion.rs) checks the setting itself. ── */
  /* The nav tree. A node opened: its caret turns and its children drop in
     beneath it (motion::node_toggled); closed: the caret turns back and the
     children go at once (an unmount — nothing waits on it). */
  #nav .node > .kids.opening { animation: menger-kids-open .18s cubic-bezier(.2, .8, .2, 1); }
  @keyframes menger-kids-open { from { opacity: 0; transform: translateY(-4px); clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  #nav .toggle.clickable.turn-open { animation: menger-caret-open .16s cubic-bezier(.2, .8, .2, 1); }
  #nav .toggle.clickable.turn-shut { animation: menger-caret-shut .12s cubic-bezier(.2, .8, .2, 1); }
  @keyframes menger-caret-open { from { transform: rotate(-90deg); } }
  @keyframes menger-caret-shut { from { transform: rotate(90deg); } }
  /* The selection moving: the open ticket's edge is drawn in and its ground
     comes up as the last row's fades (the row's own transition). */
  #nav .row { transition: background-color var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease), box-shadow var(--motion-fast) var(--ease); }
  #nav .row.sel { animation: menger-sel-in .18s cubic-bezier(.2, .8, .2, 1); }
  @keyframes menger-sel-in { from { box-shadow: inset 0 0 0 var(--accent); background-color: transparent; } }
  /* A row a watch change brought (a birth, a move, a filter's entered)
     arrives; rows drawn just after the filter changed settle in; a row that
     leaves leaves a ghost behind that fades as the tree closes up
     (motion::row_mounted, motion::ghost). */
  #nav .row.arrive, #nav .row.sel.arrive { animation: menger-row-arrive .2s cubic-bezier(.2, .8, .2, 1); }
  @keyframes menger-row-arrive { from { opacity: 0; transform: translateX(-8px); background-color: var(--row-sel); } }
  #nav .row.settle, #nav .row.sel.settle { animation: menger-row-settle .16s ease-out; }
  @keyframes menger-row-settle { from { opacity: 0; transform: translateY(-3px); } }
  #nav .row.ghost { animation: menger-row-leave .14s ease-in forwards; }
  @keyframes menger-row-leave { to { opacity: 0; transform: translateX(-8px); } }
  /* DESIGN-39's flash keeps its place on a selected row. */
  #nav .row.sel.flash { animation: menger-flash 1.6s ease-out; }
  /* The nav's view switched, its selection foot appearing, the nav shown
     again after hiding (‹ and the header's ›). */
  #nav .tree > .flat, #nav .nsel { animation: menger-fade-up .16s ease-out; }
  #nav { animation: menger-nav-in .18s cubic-bezier(.2, .8, .2, 1); }
  @keyframes menger-nav-in { from { opacity: 0; transform: translateX(-12px); } }
  header .nav-reveal { animation: menger-fade-in .16s ease-out; }
  #nav .nview-b { transition: color var(--motion-fast) var(--ease), background-color var(--motion-fast) var(--ease); }

  /* The section dock (LOOK-3, LOOK-7). The lit section moving: its edge is
     drawn in from the side the reading came from (data-dir), the last one's
     ground fades. */
  #tdock ol.dlist li.s > button { position: relative; }
  #tdock ol.dlist li.s.on > button { border-left-color: transparent; }
  #tdock ol.dlist li.s > button::before {
    content: ""; position: absolute; left: -2px; top: 0; bottom: 0; width: 2px; background: var(--accent);
    transform: scaleY(0); transform-origin: top; transition: transform .1s ease-in;
  }
  #tdock ol.dlist[data-dir="up"] li.s > button::before { transform-origin: bottom; }
  #tdock ol.dlist li.s.on > button::before { transform: scaleY(1); transition: transform .18s cubic-bezier(.2, .8, .2, 1); }
  #tdock .rail i.tick { transition: width .18s cubic-bezier(.2, .8, .2, 1), background-color .18s ease-out; }
  #tdock-sheet ol.slist button { transition: background-color var(--motion-fast) var(--ease), border-left-color .18s ease-out; }
  /* An input's row changing state (open → answered → decided), or coming
     in: its dot pops in its new colour and the row's ground flashes once. */
  :is(#tdock ol.dlist li.i, #tdock-sheet .ins button.in).turned .dot,
  #tdock .rail i.turned { animation: menger-dot-turn .2s cubic-bezier(.2, .8, .2, 1.4); }
  #tdock ol.dlist li.i.open.turned .dot { animation: menger-dot-turn .2s cubic-bezier(.2, .8, .2, 1.4), menger-ask-ping 2s ease-in-out .2s infinite; }
  @keyframes menger-dot-turn { from { transform: scale(1.9); opacity: .3; } }
  #tdock ol.dlist li.i.turned > button, #tdock-sheet .ins button.in.turned { animation: menger-ask-turn .2s ease-out; }
  @keyframes menger-ask-turn { from { background-color: var(--ask-bg); } }
  #tdock button.waiting { animation: menger-fade-in .16s ease-out; }
  /* The column, appearing as the window widens past 1760. */
  @media (min-width: 1760px) {
    #ticket-page > #tdock { animation: menger-dock-col .2s cubic-bezier(.2, .8, .2, 1); }
  }
  @keyframes menger-dock-col { from { opacity: 0; transform: translateX(16px); } }
  /* The rail: it arrives from the edge; opened over the body it widens
     and its list slides in (.18 s), closed it narrows faster (.12 s) and
     its ticks come back. */
  @media (min-width: 641px) and (max-width: 1759.98px) {
    #ticket-page > #tdock { animation: menger-dock-rail .18s cubic-bezier(.2, .8, .2, 1); transition: width .12s cubic-bezier(.4, 0, 1, 1); }
    #ticket-page > #tdock:is(:hover, :focus-within, .open) { transition: width .18s cubic-bezier(.2, .8, .2, 1); }
    #ticket-page > #tdock:is(:hover, :focus-within, .open) > :not(.rail) { animation: menger-dock-open .18s cubic-bezier(.2, .8, .2, 1); }
    #ticket-page > #tdock > .rail { animation: menger-fade-in .12s ease-out; }
  }
  @keyframes menger-dock-rail { from { opacity: 0; transform: translateX(12px); } }
  @keyframes menger-dock-open { from { opacity: 0; transform: translateX(10px); } }
  /* The pill and its sheet (≤ 640): the pill rises in, hides faster than it
     returns; the sheet rises from the bottom edge over the scrim in .2 s and
     drops in .14 s. */
  @media (max-width: 640px) {
    #tdock-pill { animation: menger-pill-in .2s cubic-bezier(.2, .8, .2, 1); transition: transform .2s cubic-bezier(.2, .8, .2, 1), opacity .2s ease-out; }
    #tdock-pill.away { transition: transform .14s cubic-bezier(.4, 0, 1, 1), opacity .14s ease-in; }
    #tdock-scrim { transition: opacity .12s ease-in; }
    #tdock-scrim.on { transition: opacity .2s ease-out; }
    #tdock-sheet { transition: transform .14s cubic-bezier(.4, 0, 1, 1); }
    #tdock-sheet.on { transition: transform .2s cubic-bezier(.2, .9, .3, 1); }
  }
  @keyframes menger-pill-in { from { opacity: 0; transform: translateY(16px) scale(.96); } }

  /* ── CHAT-4: chats inside their ticket (CHAT-1's Figs 1–4, its 390
     sheet; src/chat_pane.rs). The field: the mockup's `.chatbtn`. The
     pane: a column of the app's grid beside the content, the whole height
     of the window; under 760px a sheet over the ticket, its handle dragged
     down to dismiss it. Tokens only (THEME-2: the mockup's --line-2 is
     --tree-line, its --accent-ink --bg, its --agent the Epic chip's
     pair). ── */
  #ticket-page .chatbtn {
    display: inline-flex; gap: 8px; align-items: center; cursor: pointer;
    border: var(--border) solid var(--accent); color: var(--accent); background: var(--card);
    border-radius: var(--radius); padding: 1px 10px; font: inherit; font-family: var(--mono); font-size: calc(11.5px * var(--text-scale));
  }
  #ticket-page .chatbtn[aria-pressed="true"] { background: var(--sel); }
  #ticket-page .chatbtn .count, #chatpane .count {
    background: var(--accent); color: var(--bg); padding: 0 6px; border-radius: var(--radius-sm);
    font-weight: var(--weight-strong); font-size: calc(10.5px * var(--text-scale)); font-variant-numeric: tabular-nums;
  }
  @media (min-width: 821px) {
    #app.chatting { grid-template-columns: 360px minmax(0, 1fr) clamp(300px, 30vw, 420px); }
    #app.chatting.nonav { grid-template-columns: minmax(0, 1fr) clamp(300px, 30vw, 420px); }
    #app.chatting .content, #app.chatting #qtray { grid-column: -3 / -2; }
    #chatpane { grid-column: -2 / -1; grid-row: 1; height: 100vh; border-left: var(--border) solid var(--line); }
    #chatpane .pgrab { display: none; }
    /* The section dock's rail stays clear of the pane. */
    #app.chatting #ticket-page > #tdock { right: calc(clamp(300px, 30vw, 420px) + 10px); }
  }
  #chatpane {
    display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); color: var(--ink);
    font-family: var(--mono); font-size: calc(12px * var(--text-scale)); line-height: 1.5; z-index: 5;
  }
  #chatpane button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  #chatpane .ptabs {
    display: flex; align-items: flex-end; gap: 4px; padding: 8px 10px 0; min-height: 48px; flex: none;
    border-bottom: var(--border) solid var(--line); font-size: calc(11.5px * var(--text-scale)); overflow: hidden;
  }
  #chatpane .ptab {
    padding: 6px 10px; border: var(--border) solid transparent; border-bottom: 0; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    color: var(--muted); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; flex: 0 1 auto; min-width: 4em; max-width: 190px;
  }
  #chatpane .ptabs > :is(.pnew, .pclosed, .px) { flex: none; }
  #chatpane .ptab .pl { overflow: hidden; text-overflow: ellipsis; }
  #chatpane .ptab:hover { color: var(--ink); }
  #chatpane .ptab.on { background: var(--card); border-color: var(--line); color: var(--ink); margin-bottom: -1px; }
  #chatpane .pnew { margin-left: auto; color: var(--accent); padding: 6px 4px; white-space: nowrap; }
  #chatpane :is(.pnew, .pclosed).on { text-decoration: underline; text-underline-offset: 3px; }
  #chatpane .pclosed { color: var(--muted); padding: 6px 4px; white-space: nowrap; }
  #chatpane .px { color: var(--muted); padding: 6px 4px; font-size: calc(14px * var(--text-scale)); line-height: 1; }
  #chatpane .px:hover, #chatpane .pclosed:hover { color: var(--ink); }
  /* Who is in it: a dot each — green while one waits for a message,
     pulsing (calm and none hold it still). */
  #chatpane .pwho {
    display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 10px 14px; flex: none;
    background: var(--card); border-bottom: var(--border) solid var(--line); font-size: calc(11.5px * var(--text-scale));
  }
  #chatpane .pp { display: inline-flex; align-items: center; gap: 6px; }
  #chatpane .pmore { margin-left: auto; display: inline-flex; gap: 10px; color: var(--muted); }
  #chatpane .pmore button:hover { color: var(--accent); }
  #chatpane .dot { width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--tree-line); display: inline-block; flex: none; }
  #chatpane .dot.wait {
    background: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 25%, transparent);
    animation: menger-chat-ping 1.6s ease-in-out infinite;
  }
  @keyframes menger-chat-ping { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--live) 0%, transparent); } }
  #chatpane .ag {
    font-size: calc(9.5px * var(--text-scale)); letter-spacing: .08em; text-transform: uppercase;
    color: var(--st-epic-fg); background: var(--st-epic-bg); padding: 0 5px; border-radius: var(--radius-sm);
  }
  /* The messages: the mockup's `.msg` — an avatar, who and when in mono,
     the words in the text face; one arriving slides in. */
  #chatpane .pmsgs {
    flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; background: var(--card);
  }
  #chatpane .pmsg { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
  #chatpane .pmsg.fresh { animation: menger-chat-arrive .32s ease-out; }
  @keyframes menger-chat-arrive { from { opacity: 0; transform: translateY(6px); } }
  #chatpane .pav {
    width: 28px; height: 28px; border-radius: var(--radius-lg); display: grid; place-items: center;
    font-weight: var(--weight-strong); font-size: calc(11px * var(--text-scale)); background: var(--sel); color: var(--accent);
  }
  #chatpane .pav.agent { background: var(--st-epic-bg); color: var(--st-epic-fg); border-radius: var(--radius-pill); }
  #chatpane .pmh { font-size: calc(11.5px * var(--text-scale)); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  #chatpane .pmh b { font-weight: var(--weight-strong); }
  #chatpane :is(.pmh .t, .pmh .via, .pclosedrow .t) { color: var(--muted); font-size: calc(10.5px * var(--text-scale)); }
  #chatpane .pmb { font-family: var(--sans); font-size: calc(14px * var(--text-scale)); line-height: 1.5; margin-top: 2px; overflow-wrap: anywhere; }
  #chatpane .pmb > :first-child { margin-top: 0; }
  #chatpane .pmb > :last-child { margin-bottom: 0; }
  #chatpane .pmb code { font-family: var(--mono); font-size: calc(12px * var(--text-scale)); background: var(--panel); padding: 0 4px; border-radius: var(--radius-sm); }
  #chatpane .pnewline {
    display: flex; align-items: center; gap: 10px; color: var(--accent);
    font-size: calc(10.5px * var(--text-scale)); letter-spacing: .1em; text-transform: uppercase;
  }
  #chatpane .pnewline::before, #chatpane .pnewline::after { content: ""; flex: 1; height: var(--border); background: var(--accent); opacity: .4; }
  #chatpane .pnote { font-size: calc(11.5px * var(--text-scale)); padding: 8px 12px; border-radius: var(--radius-lg); display: flex; gap: 8px; align-items: center; }
  #chatpane .pnote.listen { background: color-mix(in srgb, var(--live) 10%, var(--card)); color: var(--live); }
  #chatpane .pempty { color: var(--muted); margin: 14px; font-size: calc(12px * var(--text-scale)); }
  #chatpane .pmsgs .pempty { margin: 0; }
  #chatpane .perr { color: var(--err-fg); font-size: calc(11px * var(--text-scale)); }
  /* The composer. */
  #chatpane .pcompose { border-top: var(--border) solid var(--line); padding: 10px 12px 12px; background: var(--panel); flex: none; }
  #chatpane textarea.pbox {
    width: 100%; box-sizing: border-box; resize: none; min-height: 54px; border: var(--border) solid var(--tree-line); background: var(--card);
    color: var(--ink); border-radius: var(--radius-lg); padding: 8px 10px; font-family: var(--sans); font-size: calc(14px * var(--text-scale));
  }
  #chatpane textarea.pbox:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #chatpane .prow { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: calc(11px * var(--text-scale)); color: var(--muted); }
  #chatpane .psend { margin-left: auto; background: var(--accent); color: var(--bg); border-radius: var(--radius); padding: 4px 12px; font-size: calc(11.5px * var(--text-scale)); }
  #chatpane .psend[disabled] { background: var(--tree-line); color: var(--muted); cursor: default; }
  #chatpane .pshut { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: var(--border) solid var(--line); color: var(--muted); flex: none; }
  #chatpane :is(.preopen, .popen, .pcancel) { color: var(--accent); }
  #chatpane .pshut .preopen { margin-left: auto; }
  /* The picker: the mockup's Fig 2. */
  #chatpane .ppicker { background: var(--card); padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; min-height: 0; }
  #chatpane .ppicker:not(.adding) { flex: 1; }
  #chatpane .ppicker.adding { border-bottom: var(--border) solid var(--line); max-height: 55%; flex: none; }
  #chatpane .ppicker h4 { margin: 0; font-family: var(--font-display); font-size: calc(15px * var(--text-scale)); font-weight: var(--weight-strong); }
  #chatpane .pq { border: var(--border) solid var(--accent); border-radius: var(--radius-lg); padding: 6px 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #chatpane .pqi { flex: 1; min-width: 6em; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; }
  #chatpane .ptok { background: var(--sel); color: var(--accent); border-radius: var(--radius-sm); padding: 0 6px; font-size: calc(11.5px * var(--text-scale)); }
  #chatpane .ptok.agent { background: var(--st-epic-bg); color: var(--st-epic-fg); }
  #chatpane ul.pcands, #chatpane ul.pclosedlist { list-style: none; margin: 0; padding: 0; border: var(--border) solid var(--line); border-radius: var(--radius-lg); }
  #chatpane li.pcand { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 10px; font-size: calc(12px * var(--text-scale)); cursor: pointer; }
  #chatpane li.pcand + li.pcand, #chatpane li.pclosedrow + li.pclosedrow { border-top: var(--border) solid var(--line); }
  #chatpane li.pcand:hover { background: var(--hover); }
  #chatpane li.pcand.hi { background: var(--sel); }
  #chatpane li.pcand.no { color: var(--muted); cursor: not-allowed; }
  #chatpane li.pcand small { display: block; color: var(--muted); font-size: calc(10.5px * var(--text-scale)); }
  #chatpane li.pcand small.refuse { color: var(--err-fg); }
  #chatpane li.pclosedrow { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; }
  #chatpane li.pclosedrow .popen { text-align: left; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chatpane .pclosedlist { margin: 14px; }
  /* Up to 820px (APP-50's phone shape): a sheet over the ticket — fixed
     while the page scrolls under it, its handle dragged down to dismiss it,
     above the phone bar. */
  @media (max-width: 820px) {
    #chatpane {
      position: fixed; left: 0; right: 0; bottom: 0; height: min(470px, 72vh); z-index: 950;
      border-top: var(--border) solid var(--tree-line); border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
      box-shadow: 0 -10px 30px var(--shadow); overflow: hidden;
    }
    #chatpane .pgrab {
      flex: none; width: 36px; height: 4px; padding: 8px 40% 6px; margin: 0 auto; background: var(--tree-line);
      background-clip: content-box; border-radius: var(--radius-xs); cursor: grab; touch-action: none; user-select: none;
    }
    #chatpane .ptabs { padding-top: 0; min-height: 0; }
    #app.chatting .content { padding-bottom: min(470px, 72vh); }
  }
  /* Everywhere else (LOOK-8's walk, a child doc of the ticket). A page
     arriving on a route change; a ticket's own opening stays DESIGN-39's. */
  main > :is(.bbar, table.board, #ticket-page, #waves, #waves-index, #components, #inputs, #settings, #members, #comments, #deployments-page, #checking, #no-access) {
    animation: menger-fade-in .16s ease-out;
  }
  #error, #link-notice { animation: menger-drop-in .18s cubic-bezier(.2, .8, .2, 1); }
  #checking-detail, .loading { animation: menger-fade-in .2s ease-out; }
  /* Overlays: the scrim fades in, the palette and the key help drop in from
     above; the dialogs (save as, leaving for a link, delete) grow in. */
  .overlay { animation: menger-fade-in .14s ease-out; }
  .overlay > :is(#palette, #cheats) { animation: menger-drop-in .16s cubic-bezier(.2, .8, .2, 1); }
  :is(#save-as, #leave, #delete) { animation: menger-menu-in .16s cubic-bezier(.2, .8, .2, 1); }
  #palette-list li { transition: background-color .1s ease-out, box-shadow .1s ease-out; }
  /* Menus: the tag menu as the ticket menu (APP-34; its origin is placed
     by menu::place); the filter and saved-filter menus drop from their bar;
     a query folded open; m-mockup's size menu. */
  #tagmenu { animation: menger-menu-in .14s cubic-bezier(.2, .8, .2, 1); }
  :is(.fmenu, .framed-menu:not([hidden])) { animation: menger-drop-in .14s cubic-bezier(.2, .8, .2, 1); }
  .qbar .qtree, .fbar .ftext, .fbadge, .qnote, .fclash { animation: menger-fade-in .14s ease-out; }
  /* The header: the connection's colour moves, a badge appears. */
  #conn { transition: color .2s ease-out; }
  header .hlink .hbadge { animation: menger-pop-in .16s cubic-bezier(.2, .8, .2, 1.3); }
  header .hlink .hbadge.tick { animation: menger-tick .5s cubic-bezier(.2, .8, .2, 1); }
  /* The ticket page: a label's chip, the label form and its problem; the
     history, children and a details opened anywhere in the chrome. */
  #t-labels :is(.lwrap, .ladd, .lproblem) { animation: menger-pop-in .16s cubic-bezier(.2, .8, .2, 1); }
  :is(#t-history, #children, #kids-more, #kids-hidden) { animation: menger-fade-in .16s ease-out; }
  main details[open] > :not(summary) { animation: menger-drop-in .16s cubic-bezier(.2, .8, .2, 1); }
  /* Inputs, waves, settings, members: a chosen option, a layout segment, a
     lane opened, a probe's verdict, a note. */
  #inputs .opt { transition: background-color var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease); }
  #inputs :is(.irefused, .none.empty) { animation: menger-fade-in .16s ease-out; }
  #waves .seg { transition: background-color var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease); }
  #waves .lane:not(.collapsed) ul.cards { animation: menger-drop-in .16s cubic-bezier(.2, .8, .2, 1); }
  #settings :is(#ws-status, #test-status) > *, #members #members-note { animation: menger-fade-in .16s ease-out; }
  /* The house's moves, shared. */
  @keyframes menger-fade-in { from { opacity: 0; } }
  @keyframes menger-fade-up { from { opacity: 0; transform: translateY(4px); } }
  @keyframes menger-drop-in { from { opacity: 0; transform: translateY(-4px); } }
  @keyframes menger-pop-in { from { opacity: 0; transform: scale(.9); } }
  /* Calm drops the ornament: the open input's ping, as the pip's breathe
     and the live mark's pulse. */
  html[data-motion="calm"] #tdock ol.dlist li.i.open .dot { animation: none; }
  html[data-motion="calm"] #tdock ol.dlist li.i.open.turned .dot { animation: menger-dot-turn .2s cubic-bezier(.2, .8, .2, 1.4); }
  /* CHAT-4: and a participant's waiting dot — held still, its ring kept. */
  html[data-motion="calm"] #chatpane .dot.wait { animation: none; }
  /* ── APP-50 (APP-37's direction A): the phone nav as a bar along the
     bottom edge (src/phonebar.rs). Up to 820px — phones, and a tablet held
     upright — the shell takes the phone shape: no nav column and no header
     at the top, one 44px line saying where you are, and the bar: 62px (58px
     from 641, each label beside its icon), fixed, safe-area aware, four
     places a thumb reaches — the tree, the filter (on a ticket page the
     sections), find, the queue. Each raises its sheet above the bar, which
     stays put; one at a time. The tree's sheet is the nav, the filter's the
     header and the global lens bar (the menu inside it is FILTER-11's,
     FILTER-38's to redraw), find's the palette, the sections' the dock's
     sheet (LOOK-3), the queue's the tray's (APP-38). The page's column ends
     at the bar's top edge, so whatever floats in it (APP-44's compare pill)
