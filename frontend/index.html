<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>menger — app</title>
<!-- MFE-9: the app's data plane is the Plexus WebSocket, not the REST
     bridge, and a page served from disk cannot know which port that is.
     menger's shell substitutes the placeholder when it serves this file
     (src/shell.rs), the same way it always has for web/index.html; served
     by anything else, the app falls back to menger's default WS port. -->
<meta name="menger-ws-port" content="{{WS_PORT}}">
<link data-trunk rel="rust" />
<!-- AGS-14: the vendored mermaid bundle rides into dist/vendor/ as a served
     file only. Deliberately NOT a <script> here: src/mermaid.rs injects one
     the first time a rendered body holds a mermaid fence. -->
<link data-trunk rel="copy-file" href="vendor/mermaid/mermaid-11.17.2.min.js" data-target-path="vendor" />
<!-- AGS-17: stamp a stored theme choice before first paint, so a reload
     never flashes the system theme; src/theme.rs owns the key and
     re-applies it once mounted (a native test pins the two agree). -->
<script>try{var t=localStorage.getItem("menger.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
  /* AGS-15: manifest's color system (../manifest/app/src/styles.css :root,
     status.ts). Every color the app paints is named exactly once, in the
     two blocks that follow — the token block and the status table. The
     component rules below reference tokens only (criterion 4 greps for
     it); AGS-10 rebinds this layer to its theme tokens without touching
     a component rule. The vanilla page (web/index.html) keeps its own
     dark palette; it is legacy and shares nothing here. */
  :root {
    /* AGS-17: native controls and scrollbars follow the theme; the dark
       blocks below say `dark`. Not a color — the literal guard ignores it. */
    color-scheme: light;
    /* surfaces + text */
    --bg: #fbfbf9;        /* page */
    --panel: #f4f3ee;     /* nav column, meta card, code blocks, frames */
    --card: #fff;         /* neutral tag / control face */
    --ink: #1f2328;       /* body text */
    --muted: #8a8f98;     /* labels, hints, secondary text */
    --line: #e3e1d8;      /* hairlines */
    /* interaction */
    --accent: #0066cc;    /* links, ids, the selected row's bar */
    --hover: #ecebe4;     /* row hover (nav + board) */
    --row-sel: #cfe2f7;   /* the selected nav row */
    --sel: #e7eef7;       /* manifest's list-"on" tint; reserved for AGS-10 */
    /* the code chip (nav shortcode / ticket id) and the done/total rollup */
    --chip-bg: #eef2f6; --chip-fg: #5b6b7b; --chip-line: #dde3ea;
    /* the tree's connector glyphs */
    --tree-line: #c4c2b6;
    /* liveness + failure (the error banner, dangling refs, not-found,
       a mermaid frame in its error state) — manifest's done / blocked
       families */
    --live: #256b1a;
    --err-bg: #fdecec; --err-fg: #a23; --err-line: #f3c5c5;
    /* AGS-18: the keyboard layer's two surfaces — the dimmed page behind
       an overlay, and the lift under a dialog. (The focus ring itself is
       --accent; it needs no token of its own.) */
    --scrim: rgba(31, 35, 40, .34);
    --shadow: rgba(31, 35, 40, .22);
    /* AGS-13 kind glyphs keep their per-kind tint (scope gold · build
       blue · execution green · gap red · spike purple), re-expressed as
       the light palette's inks so each reads on --panel. */
    --kind-scope: #7a5d00; --kind-build: #0066cc; --kind-execution: #256b1a;
    --kind-gap: #a23; --kind-spike: #5b3a8c;
    /* AGS-16: the drop shadow under floating chrome (the ticket menu, the
       copy toast) — manifest's menu shadow, 20% black. */
    --shadow: #0003;
    /* type */
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  /* The status table (pinned, AGS-15): a chip wears its status as color.
     One row per status in the closed vocabulary — bg / fg, plus weight
     (Blocked is bold) and decoration (Superseded is struck through). The
     single paint rule after it is what every host applies wherever a
     status appears (nav tag, board control, ticket page, blockers pills);
     the word stays in the chip. The extra selectors in the paint rule
     only out-rank the hosts' own base rules (`#nav .tag`,
     `select.status { font: inherit }`); they name no color. SDLC-7 adds
     the two worker states, each in a hue the table had not used, each
     pair over 4.5:1 in both themes (Coding 5.78 light / 7.80 dark, In
     Review 6.29 / 7.79). `In Review` is the one status with a space; its
     row is `st-in-review` (st_class in src/main.rs hyphenates). */
  .st-pending    { --st-bg: #f3e8c8; --st-fg: #7a5d00; }
  .st-ready      { --st-bg: #e3ecf7; --st-fg: #2b5b8c; }
  .st-coding     { --st-bg: #fde0c5; --st-fg: #8f3f00; }
  .st-in-review  { --st-bg: #cdeef4; --st-fg: #0b5b6b; }
  .st-blocked    { --st-bg: #fdecec; --st-fg: #a23;    --st-weight: 600; }
  .st-complete   { --st-bg: #cfe9c9; --st-fg: #256b1a; }
  .st-idea       { --st-bg: #efe9e0; --st-fg: #72644c; } /* fg darkened from manifest's parked #8a7a5c (3.47:1) to clear AA */
  .st-epic       { --st-bg: #e6dcf5; --st-fg: #5b3a8c; }
  .st-superseded { --st-bg: #f3d9d9; --st-fg: #aa2222; --st-deco: line-through; }
  .st, #nav .tag.st, select.status.st {
    background: var(--st-bg); color: var(--st-fg); border-color: transparent;
    font-weight: var(--st-weight, inherit); text-decoration: var(--st-deco, none);
  }
  /* AGS-17: dark — the same token names, the second value set; nothing
     below the theme layers changes. Three states: no `data-theme` on the
     root follows the system (`prefers-color-scheme`); an explicit
     `data-theme="light"` / `"dark"` — stamped by src/theme.rs, cycled by
     the header toggle, persisted — wins in either direction. So the dark
     values are stated twice: under the media query, guarded so a stored
     "light" opts out, and under the attribute. A native test holds the
     two copies identical and their token set equal to the light block's
     (a color defined in one theme only is a bug). The palette is the
     house dark set — the day-one vanilla page's bg / panel / ink / muted
     / line / accent / live / err — with the rest derived from it; the
     dark status table is dark tinted bg + light fg (weight and
     decoration stay the light table's: they are not colors), and every
     chip pair and ink on bg/panel clears 4.5:1 (AGS-17 result). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #101014; --panel: #17171d; --card: #1e1e26;
      --ink: #d8d8e0; --muted: #7a7a88; --line: #26262e;
      --accent: #8ab4f8; --hover: #1f1f28; --row-sel: #1f2d44; --sel: #1b2431;
      --chip-bg: #1e2430; --chip-fg: #aab7c8; --chip-line: #2c3442;
      --tree-line: #3a3a46;
      --live: #5dbb63;
      --err-bg: #2b1517; --err-fg: #e89393; --err-line: #5a2626;
      --kind-scope: #e3c56a; --kind-build: #8ab4f8; --kind-execution: #5dbb63;
      --kind-gap: #e89393; --kind-spike: #c7abf2;
      --shadow: #0008;
    --scrim: rgba(0, 0, 0, .55);
    }
    :root:not([data-theme="light"]) .st-pending    { --st-bg: #3a3115; --st-fg: #e8cf7a; }
    :root:not([data-theme="light"]) .st-ready      { --st-bg: #1b2e46; --st-fg: #a3c6ee; }
    :root:not([data-theme="light"]) .st-coding     { --st-bg: #3d2614; --st-fg: #f4b37c; }
    :root:not([data-theme="light"]) .st-in-review  { --st-bg: #10343b; --st-fg: #85d2df; }
    :root:not([data-theme="light"]) .st-blocked    { --st-bg: #3d1a1c; --st-fg: #f09a9a; }
    :root:not([data-theme="light"]) .st-complete   { --st-bg: #16341f; --st-fg: #8fd39a; }
    :root:not([data-theme="light"]) .st-idea       { --st-bg: #2b2721; --st-fg: #c9b99a; }
    :root:not([data-theme="light"]) .st-epic       { --st-bg: #2e2143; --st-fg: #cdb4f2; }
    :root:not([data-theme="light"]) .st-superseded { --st-bg: #3b2224; --st-fg: #dea3a3; }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #101014; --panel: #17171d; --card: #1e1e26;
    --ink: #d8d8e0; --muted: #7a7a88; --line: #26262e;
    --accent: #8ab4f8; --hover: #1f1f28; --row-sel: #1f2d44; --sel: #1b2431;
    --chip-bg: #1e2430; --chip-fg: #aab7c8; --chip-line: #2c3442;
    --tree-line: #3a3a46;
    --live: #5dbb63;
    --err-bg: #2b1517; --err-fg: #e89393; --err-line: #5a2626;
    --kind-scope: #e3c56a; --kind-build: #8ab4f8; --kind-execution: #5dbb63;
    --kind-gap: #e89393; --kind-spike: #c7abf2;
    --shadow: #0008;
    --scrim: rgba(0, 0, 0, .55);
  }
  :root[data-theme="dark"] .st-pending    { --st-bg: #3a3115; --st-fg: #e8cf7a; }
  :root[data-theme="dark"] .st-ready      { --st-bg: #1b2e46; --st-fg: #a3c6ee; }
  :root[data-theme="dark"] .st-coding     { --st-bg: #3d2614; --st-fg: #f4b37c; }
  :root[data-theme="dark"] .st-in-review  { --st-bg: #10343b; --st-fg: #85d2df; }
  :root[data-theme="dark"] .st-blocked    { --st-bg: #3d1a1c; --st-fg: #f09a9a; }
  :root[data-theme="dark"] .st-complete   { --st-bg: #16341f; --st-fg: #8fd39a; }
  :root[data-theme="dark"] .st-idea       { --st-bg: #2b2721; --st-fg: #c9b99a; }
  :root[data-theme="dark"] .st-epic       { --st-bg: #2e2143; --st-fg: #cdb4f2; }
  :root[data-theme="dark"] .st-superseded { --st-bg: #3b2224; --st-fg: #dea3a3; }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--mono);
  }
  header {
    display: flex; align-items: baseline; gap: 1rem;
    padding: .75rem 1.25rem; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  header .tag { color: var(--muted); font-size: .8rem; }
  #conn { color: var(--muted); font-size: .8rem; margin-left: auto; }
  #conn.live { color: var(--live); }
  #conn.reconnecting { color: var(--err-fg); }
  /* AGS-17: the theme toggle — a header control in the nav-reveal's
     idiom; its text names the current choice (system / light / dark). */
  header .theme {
    background: var(--bg); border: 1px solid var(--line); color: var(--muted);
    font: inherit; font-size: 11px; line-height: 1.3; padding: 0 6px;
    border-radius: 4px; cursor: pointer; white-space: nowrap;
  }
  header .theme:hover { color: var(--accent); border-color: var(--accent); }
  main { padding: 1rem 1.25rem; max-width: 72rem; margin: 0 auto; }
  #health { color: var(--muted); font-size: .8rem; margin-bottom: 1rem; }
  #error {
    display: flex; align-items: baseline; gap: 1rem;
    background: var(--err-bg); color: var(--err-fg); border: 1px solid var(--err-line);
    border-left-width: 4px; border-radius: 6px;
    padding: .5rem .75rem; margin-bottom: 1rem; font-size: .85rem;
  }
  #error button {
    margin-left: auto; background: none; border: 1px solid var(--err-line);
    color: inherit; font: inherit; font-size: .8rem; border-radius: 4px;
    padding: 0 .5rem; cursor: pointer;
  }
  /* The board's status control is the chip: it wears the row's status
     (class st-<status>, kept in step with the ticket) and lists the
     vocabulary in each option's own colors. */
  select.status {
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
    font: inherit; font-size: .85rem; padding: .1rem .3rem;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: .8rem; }
  td.id { color: var(--accent); white-space: nowrap; }
  /* MFE-12: the board mounts a window of rows between two spacers sized
     at the row pitch, so every row is exactly one line: fixed columns, and
     a cell that does not fit ends in an ellipsis (the title and blocked-by
     cells carry their whole text as a tooltip). Fixed columns also keep
     the widths still as the window slides — under auto layout they would
     follow whichever rows happen to be mounted. */
  table.board { table-layout: fixed; }
  table.board th.c-id { width: 11rem; }
  table.board th.c-kind { width: 6.5rem; }
  table.board th.c-status { width: 9rem; }
  table.board th.c-sev { width: 6.5rem; }
  table.board th.c-blk { width: 10rem; }
  tbody#board td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tbody#board tr.spacer td { padding: 0; border: 0; }
  tbody#board.scaled { overflow-anchor: none; }
  /* The status control is the tallest thing in a row, and its natural
     height follows the face it is set in — Blocked's bold one is 4px
     taller — so its box is pinned: every row the same pitch. */
  tbody#board select.status { height: 1.5rem; }
  /* AGS-20: a board row that decomposes says so (no parent column). */
  td.id .haskids {
    margin-left: .35rem; font-size: 10.5px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  td.status { white-space: nowrap; }

  /* MFE-7: universal click-through + the ticket page. */
  header h1 a { color: inherit; text-decoration: none; }
  tbody#board tr[data-ticket-id] { cursor: pointer; }
  tbody#board tr[data-ticket-id]:hover td { background: var(--hover); }
  td.id a { color: inherit; text-decoration: none; }
  td.id a:hover { text-decoration: underline; }
  #ticket-page .crumbs { margin: 0 0 .75rem; }
  #ticket-page .crumbs a { color: var(--muted); text-decoration: none; }
  #ticket-page .crumbs a:hover { color: var(--accent); }
  /* AGS-20: the ancestor chain, root first, after the board crumb. */
  #ticket-page .crumbs .sep { color: var(--muted); }
  #ticket-page .crumbs .crumb, dd#t-parent .crumb { font-family: var(--mono); font-size: 12.5px; }
  dd#t-parent .crumb { color: var(--accent); text-decoration: none; }
  dd#t-parent .crumb:hover { text-decoration: underline; }
  article.ticket h2 { font-size: 1.05rem; margin: .25rem 0 1rem; }
  article.ticket h2 .id { color: var(--accent); margin-right: .6rem; }
  dl.meta {
    display: flex; flex-wrap: wrap; gap: .35rem 1.75rem; margin: 0 0 1rem;
    padding: .6rem .8rem; background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px;
  }
  dl.meta div { display: flex; gap: .5rem; }
  dl.meta dt { color: var(--muted); }
  dl.meta dd { margin: 0; }
  dd.status { padding: 0 .4rem; border: 1px solid var(--line); border-radius: 6px; }
  section.dag h3, section.bodysec h3 {
    font-size: .8rem; color: var(--muted); font-weight: 500; margin: 1.1rem 0 .35rem;
  }
  #blockers, #unlocks, #children { list-style: none; margin: 0; padding: 0; }
  #blockers li, #unlocks li, #children li { padding: .15rem 0; }
  #blockers a, #unlocks a, #children a { color: var(--accent); text-decoration: none; }
  #blockers a:hover, #unlocks a:hover, #children a:hover { text-decoration: underline; }
  .bstatus {
    margin-left: .6rem; padding: 0 .4rem; font-size: .8rem;
    border: 1px solid var(--line); border-radius: 6px;
  }
  .btitle { margin-left: .6rem; color: var(--muted); }
  .dangling { color: var(--err-fg); }
  .none, .loading { color: var(--muted); }
  #notfound h2 { color: var(--err-fg); font-size: 1.05rem; }
  details.frontmatter { margin: 0 0 .75rem; }
  details.frontmatter summary { cursor: pointer; color: var(--muted); font-size: .8rem; }
  details.frontmatter pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: .6rem .8rem; overflow-x: auto; margin: .35rem 0 0;
  }
  /* Prose is sans, code stays mono — manifest's split. */
  .md { line-height: 1.6; max-width: 56rem; font-family: var(--sans); }
  .md h1 { font-size: 1.1rem; margin: 1.1rem 0 .4rem; }
  .md h2, .md h3, .md h4 { font-size: 1rem; margin: 1.1rem 0 .4rem; }
  .md code {
    font-family: var(--mono); font-size: .92em;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 3px; padding: 0 .25rem;
  }
  .md pre {
    font-family: var(--mono);
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: .6rem .8rem; overflow-x: auto;
  }
  .md pre code { border: 0; padding: 0; background: none; font-size: inherit; }
  .md a { color: var(--accent); }
  .md blockquote {
    border-left: 3px solid var(--line); margin: .5rem 0;
    padding: 0 .8rem; color: var(--muted);
  }
  .md table { width: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: .25rem .5rem; }

  /* AGS-12: the persistent left nav — manifest's sidebar pattern. A
     full-height two-column grid: the nav column collapses (and the
     content reflows) when the nav is hidden. */
  #app { display: grid; grid-template-columns: 360px minmax(0, 1fr); height: 100vh; }
  #app.nonav { grid-template-columns: minmax(0, 1fr); }
  #app.nonav #nav { display: none; }
  #app .content { min-width: 0; height: 100vh; overflow: auto; }
  #nav {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  #nav .brand {
    display: flex; align-items: baseline; gap: .4rem;
    padding: 12px 14px; font-weight: 600; border-bottom: 1px solid var(--line);
  }
  #nav .brand .muted { color: var(--muted); font-weight: 400; }
  #nav .nav-hide, header .nav-reveal {
    background: var(--bg); border: 1px solid var(--line); color: var(--muted);
    font: inherit; font-size: 11px; line-height: 1.3; padding: 0 6px;
    border-radius: 4px; cursor: pointer;
  }
  #nav .nav-hide { margin-left: auto; }
  #nav .nav-hide:hover, header .nav-reveal:hover { color: var(--accent); border-color: var(--accent); }
  #nav .tree-scroll { flex: 1; overflow: auto; min-height: 0; }
  #nav .tree { padding: 6px 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; white-space: nowrap; }
  #nav .row {
    display: flex; align-items: center; gap: 4px; padding: 0 10px;
    cursor: pointer; color: var(--ink); text-decoration: none;
  }
  #nav .row:hover { background: var(--hover); }
  #nav .row.sel { background: var(--row-sel); box-shadow: inset 3px 0 0 var(--accent); border-radius: 2px; }
  #nav .row.sel .label { font-weight: 600; }
  #nav .row.sel .code { color: var(--accent); }
  #nav .prefix { color: var(--tree-line); white-space: pre; user-select: none; }
  #nav .toggle { width: 1ch; color: var(--muted); }
  #nav .toggle.clickable { cursor: pointer; }
  #nav .code, #tmenu .code, #toast .code {
    font-size: 10.5px; font-weight: 600; letter-spacing: .02em; color: var(--chip-fg);
    background: var(--chip-bg); border: 1px solid var(--chip-line); border-radius: 5px;
    padding: 0 5px; white-space: nowrap;
  }
  #nav .label { flex: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* Chips sit in their own right-hand column: the label absorbs the
     slack, and a fixed chip width keeps every chip's left edge aligned. */
  #nav .tag {
    flex: none; margin-left: auto; width: 6.5em; text-align: center; box-sizing: border-box;
    font-size: 10px; padding: 0 5px; border-radius: 6px;
    border: 1px solid var(--line); color: var(--muted); background: var(--card);
  }
  #nav .tag.roll { font-variant-numeric: tabular-nums; color: var(--chip-fg); background: var(--chip-bg); }
  /* AGS-20: the tree nests. MFE-12: a collapsed node's kids container is
     mounted empty (its children mount when it opens — src/nav.rs); this
     keeps the empty box out of the layout. */
  #nav .node.collapsed > .kids { display: none; }
  /* AGS-13: kinds. The board and the ticket page spell the word; the nav
     marks each leaf with its kind's glyph, tinted per kind. */
  td.kind, dd.kind { color: var(--muted); }
  #nav .toggle.kind { color: var(--muted); }
  #nav .leaf[data-kind="scope"] .toggle.kind { color: var(--kind-scope); }
  #nav .leaf[data-kind="build"] .toggle.kind { color: var(--kind-build); }
  #nav .leaf[data-kind="execution"] .toggle.kind { color: var(--kind-execution); }
  #nav .leaf[data-kind="gap"] .toggle.kind { color: var(--kind-gap); }
  #nav .leaf[data-kind="spike"] .toggle.kind { color: var(--kind-spike); }
  /* AGS-18: the keyboard layer. Focus is visible wherever it can land —
     a 2px accent ring, deliberately unlike the selected row (which is a
     --row-sel tint with an inset accent bar), so "where I am" and "what
     is open" never read as the same thing. */
  #nav .row:focus, tbody#board tr:focus, #palette-input:focus, #cheats .close:focus {
    outline: 2px solid var(--accent); outline-offset: -2px;
  }
  #nav .row:focus { border-radius: 2px; }
  /* The two overlays (jump palette, cheat sheet). */
  .overlay {
    position: fixed; inset: 0; z-index: 40; background: var(--scrim);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 12vh 1rem 1rem;
  }
  .dialog {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 12px 40px var(--shadow); max-width: 100%; overflow: hidden;
  }
  #palette { width: 44rem; display: flex; flex-direction: column; max-height: 68vh; }
  #palette-input {
    font: inherit; font-size: .9rem; padding: .55rem .8rem;
    background: var(--bg); color: var(--ink);
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  }
  #palette-list { list-style: none; margin: 0; padding: .25rem 0; overflow: auto; flex: 1; min-height: 0; }
  #palette-list li {
    display: flex; align-items: center; gap: 6px; padding: .1rem .8rem;
    font-size: 12.5px; line-height: 1.55; white-space: nowrap; cursor: pointer;
  }
  #palette-list li:hover { background: var(--hover); }
  #palette-list li.hi { background: var(--row-sel); box-shadow: inset 3px 0 0 var(--accent); }
  #palette-list li .code {
    font-size: 10.5px; font-weight: 600; letter-spacing: .02em; color: var(--chip-fg);
    background: var(--chip-bg); border: 1px solid var(--chip-line); border-radius: 5px;
    padding: 0 5px;
  }
  /* Layout only — the status chip's face comes from the status table. */
  #palette-list li .tag {
    flex: none; margin-left: auto; width: 6.5em; text-align: center; box-sizing: border-box;
    font-size: 10px; padding: 0 5px; border-radius: 6px;
  }
  #palette-list li .label { flex: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #palette-list li.empty, #palette .hint { color: var(--muted); font-size: .75rem; }
  #palette-list li.empty { padding: .3rem .8rem; cursor: default; }
  #palette .hint { padding: .35rem .8rem; border-top: 1px solid var(--line); }
  #cheats { width: 32rem; padding: .9rem 1.1rem 1rem; }
  #cheats h2 { font-size: .95rem; margin: 0 0 .7rem; }
  #cheats dl {
    margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: .3rem .9rem;
    font-size: .85rem;
  }
  #cheats dt, #cheats dd { margin: 0; }
  #cheats dd { color: var(--muted); }
  #cheats kbd {
    font-family: var(--mono); font-size: 11px; color: var(--chip-fg);
    background: var(--chip-bg); border: 1px solid var(--chip-line);
    border-radius: 5px; padding: 0 5px;
  }
  #cheats .close {
    margin-top: .9rem; font: inherit; font-size: .8rem; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
    border-radius: 4px; padding: .1rem .5rem;
  }
  #cheats .close:hover { color: var(--accent); border-color: var(--accent); }

  /* AGS-14: mermaid placeholders → diagrams. The renderer picks its
     theme from body's computed background (light → mermaid `default`). */
  .md .mermaid {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: .6rem .8rem; margin: .5rem 0; overflow-x: auto;
  }
  .md .mermaid pre { margin: 0; padding: 0; background: none; border: 0; }
  .md .mermaid[data-state="rendering"] pre { color: var(--muted); }
  .md .mermaid[data-state="done"] svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .md .mermaid[data-state="error"] { border-color: var(--err-fg); }
  .md .mermaid .mermaid-error {
    color: var(--err-fg); margin: 0 0 .6rem; white-space: pre-wrap; font-size: .85rem;
  }
  /* AGS-16: the ticket menu — manifest's menu idiom on the palette's
     tokens: a bordered, shadowed card at the cursor; items are real
     links/buttons whose hover and keyboard focus paint the same way. The
     status list opens inline under "Set status"; each row shows the
     status as its chip, the current one marked. */
  #tmenu {
    position: fixed; z-index: 1000; min-width: 230px; max-width: 360px;
    max-height: calc(100vh - 8px); overflow: auto; padding: 4px;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 10px 30px var(--shadow);
    font: 12.5px/1.5 var(--mono); user-select: none; outline: none;
  }
  #tmenu .h {
    display: flex; align-items: baseline; gap: 6px; padding: 4px 10px 6px;
    border-bottom: 1px solid var(--line); margin-bottom: 4px; white-space: nowrap;
  }
  #tmenu .h .title { overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  #tmenu .h .tag { flex: none; font-size: 10px; padding: 0 5px; border-radius: 6px; }
  #tmenu .item {
    display: block; width: 100%; text-align: left; padding: 4px 10px;
    border: 0; border-radius: 5px; background: transparent; color: var(--ink);
    cursor: pointer; font: inherit; text-decoration: none; white-space: nowrap;
  }
  #tmenu .item:hover, #tmenu .item:focus { background: var(--hover); color: var(--accent); outline: none; }
  #tmenu .item .arrow { color: var(--muted); }
  #tmenu .sub { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
  #tmenu .sub .item { padding-left: 14px; }
  #tmenu .sub .mark { display: inline-block; width: 1.4em; color: var(--live); }
  #tmenu .sub .st { padding: 0 5px; border-radius: 6px; font-size: 11px; }
  /* The copy confirmation. The manual fallback shows the id selected in
     a field; the banner idiom's left edge marks it as a notice. */
  #toast {
    position: fixed; right: 16px; bottom: 16px; z-index: 1001;
    display: flex; align-items: baseline; gap: .6rem;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-left: 4px solid var(--live); border-radius: 6px;
    padding: .45rem .7rem; font-size: .85rem; box-shadow: 0 8px 24px var(--shadow);
  }
  #toast.manual { border-left-color: var(--err-fg); }
  #toast input.code { font-family: var(--mono); font-size: .85rem; width: 7em; outline: none; }
  #toast button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    font: inherit; font-size: .8rem; border-radius: 4px; padding: 0 .5rem; cursor: pointer;
  }
  #toast button:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
