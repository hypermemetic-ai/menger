# MFE-2: the Leptos CSR app. Deliberately its OWN cargo unit — the empty
# [workspace] table below detaches it from any enclosing workspace lookup,
# and nothing in the server package references it, so `cargo build` /
# `cargo test` of menger never need the wasm toolchain. Built with trunk
# (see README "Frontend"); the server serves frontend/dist at /app/.

[package]
name = "menger-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "menger's Leptos CSR frontend — on the streamed Plexus RPC client over one WebSocket"

[workspace]

[dependencies]
# Owner-pinned: Leptos, CSR only — no ssr/hydrate/server-fn/router features.
leptos = { version = "0.8", features = ["csr"] }

# MFE-9: the app's data plane. `menger-tickets-api` is menger's OWN
# declaration of the ticket vocabulary and of the `tickets` activation —
# the same crate the server depends on — so a row is the server's
# `TicketSummary`, not a mirror of its JSON, and a renamed field fails this
# build. the crate emits `TicketsClient<T>` from the activation's own impl; `plexus-client`'s `ws-web`
# is the browser WebSocket backend (MACRO-6). Neither drags plexus-core,
# tokio or jsonrpsee into the wasm — that is what the crate split buys.
menger-tickets-api = { path = "../tickets-api", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std"] }

# AGS-14 only: the config object handed to the vendored mermaid renderer
# across the JS boundary (src/mermaid.rs). No wire data is a `Value` any
# more — the client's typed events replaced all of it.
serde_json = "1"

# MFE-7: ticket bodies as markdown. Sanitization is done in the event
# stream (src/md.rs) — raw HTML downgraded to text, unsafe link/image
# schemes dropped — so no HTML-parser crate rides into the wasm.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# AGS-14: the one piece of HTML md.rs builds by hand (the mermaid
# placeholder) escapes its text with pulldown-cmark's own escaper —
# already in the tree, so this adds no weight.
pulldown-cmark-escape = "0.11"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# MFE-9: net.rs's fetch + ReadableStream surface (Headers, Request,
# RequestInit, Response, ReadableStream, ReadableStreamDefaultReader) is
# gone with net.rs — the WebSocket bindings the data plane needs are
# plexus-client's own, declared there.
# Only what the board's status control, the hash router / click-through (MFE-7:
# Location for the hash, Element for closest()), and the left nav
# (AGS-12: Storage for persisted collapse/hide, Document + the
# ScrollIntoView pair to reveal the selected row) touch.
# Location for the hash, Element for closest()), and the mermaid mounter
# (AGS-14: Document/Node/NodeList to inject the script and walk
# placeholders, HtmlElement for onload/onerror, CssStyleDeclaration to
# read the palette's background) touch. AGS-16's ticket menu adds the
# events it listens for, DomRect to clamp itself into the viewport,
# Navigator for the clipboard (reached via Reflect — web-sys's Clipboard
# binding is unstable-gated), and the two form elements its copy
# fallbacks use. AGS-17's theme adds MediaQueryList (the
# prefers-color-scheme query and its change event).
# read the palette's background) touch. AGS-18 adds the keyboard layer's
# KeyboardEvent plus the two elements it focuses (the palette's input,
# the cheat sheet's close button).
web-sys = { version = "0.3", features = [
  "Window",
  "HtmlSelectElement",
  # MFE-9: the WS port menger's shell stamps into the app's index.html.
  "HtmlMetaElement",
  "Location",
  "Element",
  "Document",
  "Storage",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "Node",
  "NodeList",
  "HtmlElement",
  "HtmlDivElement",
  "HtmlHeadElement",
  "CssStyleDeclaration",
  "MouseEvent",
  # AGS-25: `detail` — which click of a double-click this is.
  "UiEvent",
  "KeyboardEvent",
  "DomRect",
  "Navigator",
  "HtmlTextAreaElement",
  "HtmlInputElement",
  "MediaQueryList",
  "HtmlButtonElement",
  # SCALE-24: the nav gives focus back to a row its window's keyed <For>
  # moved in the DOM (a moved element loses focus), from a MutationObserver
  # — without scrolling (FocusOptions).
  "MutationObserver",
  "MutationObserverInit",
  "MutationRecord",
  "FocusOptions",
  "FocusEvent",
  # WAVE-12: the wave board's filter rewrites the route's query in place
  # (history.replaceState — no history entry, no hashchange).
  "History",
  # COMP-4: a framed body is a sandboxed <iframe srcdoc> (src/frame.rs), and
  # its SDK shell talks to the app over postMessage.
  "HtmlIFrameElement",
  "MessageEvent",
] }

console_error_panic_hook = "0.1"

# The WebSocket backend is picked by target, and `WsTransport` is one type
# either way (MACRO-6). wasm32 is the app; the host build exists so
# `cargo test` can compile and run the crate's native tests (the AGS-15/17
# stylesheet guards, md.rs, nav.rs, keys.rs) — `ws-web` is a
# `compile_error!` off wasm32, on purpose.
[target.'cfg(target_arch = "wasm32")'.dependencies]
plexus-client = { path = "../../plexus-macros/plexus-client", features = [
  "ws-web",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
plexus-client = { path = "../../plexus-macros/plexus-client", features = [
  "ws-native",
] }

[profile.release]
# WASM payload matters (MFE-2 records it for MFE-6); favor size.
opt-level = "z"
lto = true
codegen-units = 1
