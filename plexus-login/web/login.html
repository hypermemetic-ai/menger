<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="same-origin">
<title>Sign in · {{TITLE}}</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- THEME-7: the app's site theme (its tokens as the app last painted them,
     kept under {{APP}}.themes.site) is worn here too, and followed live when
     another tab of the app changes it. -->
<!-- IDENTITY-19: plexus-login's page. Self-contained (no app, no fonts, no
     scripts but the one below), so it can be handed to an IdP as its hosted
     login page later. The shell fills the {{…}} placeholders, escaped. -->
<script>try{var t=localStorage.getItem("{{APP}}.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}try{var s=localStorage.getItem("{{APP}}.themes.site");if(s)document.documentElement.style.cssText=s;addEventListener("storage",function(e){if(e.key==="{{APP}}.themes.site")document.documentElement.style.cssText=e.newValue||""})}catch(e){}</script>
<style>
  /* Layout: one sheet in two panes — the instance on a tinted column (as
     the app's nav column), the way in beside it on the page; stacked on a
     phone. The palette it was born with (the first app's :root), no web fonts:
     this page must stand alone. */
  :root {
    color-scheme: light;
    --bg: #fbfbf9; --panel: #f4f3ee; --card: #fff; --ink: #1f2328; --muted: #8a8f98;
    --line: #e3e1d8; --accent: #0066cc; --accent-ink: #fff; --hover: #ecebe4; --row-sel: #cfe2f7;
    --chip-bg: #eef2f6; --chip-fg: #5b6b7b; --chip-line: #dde3ea;
    --role-editor: #0066cc; --role-admin: #7a5d00; --live: #256b1a;
    --err-bg: #fdecec; --err-fg: #a23; --err-line: #f3c5c5; --shadow: rgba(31, 35, 40, .07);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #101014; --panel: #17171d; --card: #1e1e26; --ink: #d8d8e0; --muted: #7a7a88;
      --line: #26262e; --accent: #8ab4f8; --accent-ink: #101014; --hover: #1f1f28; --row-sel: #1f2d44;
      --chip-bg: #1e2430; --chip-fg: #aab7c8; --chip-line: #2c3442;
      --role-editor: #8ab4f8; --role-admin: #e3c56a; --live: #5dbb63;
      --err-bg: #2b1517; --err-fg: #e89393; --err-line: #5a2626; --shadow: rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #101014; --panel: #17171d; --card: #1e1e26; --ink: #d8d8e0; --muted: #7a7a88;
    --line: #26262e; --accent: #8ab4f8; --accent-ink: #101014; --hover: #1f1f28; --row-sel: #1f2d44;
    --chip-bg: #1e2430; --chip-fg: #aab7c8; --chip-line: #2c3442;
    --role-editor: #8ab4f8; --role-admin: #e3c56a; --live: #5dbb63;
    --err-bg: #2b1517; --err-fg: #e89393; --err-line: #5a2626; --shadow: rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%; display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans);
    padding: 24px 16px;
  }
  /* Centred while it fits; a tall sheet scrolls from its top. */
  .sheet {
    margin: auto; width: 100%; max-width: 820px;
    display: grid; grid-template-columns: 280px 1fr;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 1px 2px var(--shadow), 0 12px 32px var(--shadow); overflow: hidden;
  }
  .side {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 28px 24px; display: flex; flex-direction: column; gap: 22px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font: 600 17px var(--mono); }
  .brand .mark {
    width: 28px; height: 28px; border-radius: 6px; background: var(--ink); color: var(--bg);
    display: grid; place-items: center; font: 700 16px var(--mono);
  }
  .motto { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; text-wrap: balance; }
  .facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font: 12px var(--mono); }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .side .foot { margin-top: auto; color: var(--muted); font-size: 12px; }
  .dev-toggle {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 9px; align-items: center; cursor: pointer;
    padding: 10px 12px; border: 1px dashed var(--chip-line); border-radius: 8px; background: var(--bg);
    font-size: 13px; font-weight: 600;
  }
  .dev-toggle input { margin: 0; accent-color: var(--accent); }
  .dev-toggle small { grid-column: 2; color: var(--muted); font-weight: 400; font-size: 12px; }
  .dev-toggle:has(input:checked) { border-style: solid; border-color: var(--accent); }

  .main { padding: 30px 32px 26px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: -12px 0 4px; font-size: 13px; }
  h2 {
    margin: 6px 0 -6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  }
  .error {
    background: var(--err-bg); color: var(--err-fg); border: 1px solid var(--err-line);
    border-radius: 6px; padding: 9px 12px; font-size: 13px; margin: 0;
  }
  form { margin: 0; display: grid; gap: 6px; }
  label { font-size: 12.5px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .row a { font-size: 12.5px; font-weight: 400; }
  input[type=text], input[type=password], input[type=email], select {
    width: 100%; height: 36px; font: inherit; padding: 0 10px; color: var(--ink); min-width: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: 6px; outline: none;
  }
  input + label, input + .row { margin-top: 6px; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button {
    font: inherit; font-weight: 600; padding: 9px 12px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
  }
  button:focus-visible, summary:focus-visible, .dev-toggle:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); margin-top: 6px; }
  button.primary:hover { filter: brightness(1.06); }
  button.link { background: none; border: 0; color: var(--accent); font-size: 13px; font-weight: 500; padding: 4px 0 0; }
  button.link:hover { text-decoration: underline; }
  button.alt { background: var(--card); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  button.alt:hover { background: var(--hover); }
  button:disabled { opacity: .55; cursor: default; }
  .or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
  .or::before, .or::after { content: ""; height: 1px; background: var(--line); flex: 1; }
  .caption { color: var(--muted); font-size: 12.5px; margin: 0; }
  .alts { display: grid; gap: 8px; }
  .alts:empty { display: none; }
  .alts svg { width: 17px; height: 17px; flex: none; }
  .sso { display: none; }
  .sso.open { display: grid; }
  .note { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
  /* AUTH-22: the self-hosted WorkOS steps — a code, a QR code, a factor list. */
  input.code { font: 600 20px var(--mono); letter-spacing: .3em; text-align: center; height: 44px; }
  .qr { display: grid; place-items: center; padding: 10px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .qr img { width: 180px; height: 180px; image-rendering: pixelated; }
  .secret { font: 13px var(--mono); overflow-wrap: anywhere; user-select: all; }
  .factors { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .factors li { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  a.alt { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 9px 12px; border-radius: 6px; background: var(--card); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  a.alt:hover { background: var(--hover); text-decoration: none; }
  a.alt svg { width: 17px; height: 17px; flex: none; }

  /* IDENTITY-35: the roster, drawn as the app's nav rows. */
  .roster { border: 1px solid var(--line); border-radius: 8px; background: var(--card); overflow: hidden; }
  .roster form + form { border-top: 1px solid var(--line); }
  button.who {
    display: grid; grid-template-columns: minmax(0, 9.5rem) 1fr auto; gap: 12px; align-items: center;
    background: none; border: 0; border-radius: 0; padding: 9px 12px; text-align: left; font-weight: 400; color: var(--ink);
    box-shadow: inset 3px 0 0 transparent;
  }
  button.who:hover { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
  .who .uname { font: 600 13px var(--mono); overflow-wrap: anywhere; }
  .who .grants { display: flex; flex-wrap: wrap; gap: 4px; }
  .who .go { color: var(--muted); font-size: 13px; }
  button.who:hover .go { color: var(--accent); }
  .grant {
    display: inline-flex; align-items: baseline; gap: 5px; padding: 1px 7px; border-radius: 4px;
    background: var(--chip-bg); color: var(--chip-fg); border: 1px solid var(--chip-line); font-size: 11.5px; white-space: nowrap;
  }
  .grant b { font-weight: 600; }
  .grant code { font: 11px var(--mono); }
  .grant.editor b { color: var(--role-editor); }
  .grant.admin b { color: var(--role-admin); }
  .grant.none { background: none; border-style: dashed; }
  .anyone { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) auto; align-items: end; gap: 6px 8px; }
  .anyone > div { display: grid; gap: 6px; }
  .anyone button { width: auto; height: 36px; margin: 0; padding-inline: 16px; }
  details { border-top: 1px solid var(--line); padding-top: 12px; }
  summary { cursor: pointer; color: var(--accent); font-size: 13px; list-style-position: inside; }
  details[open] summary { margin-bottom: 10px; }

  @media (max-width: 720px) {
    body { padding: 12px 16px; }
    .sheet { grid-template-columns: 1fr; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 20px; gap: 14px; }
    .side .foot { display: none; }
    .main { padding: 22px 20px; }
    .anyone { grid-template-columns: 1fr 1fr; }
    .anyone > div:first-of-type, .anyone button { grid-column: 1 / -1; width: 100%; }
    button.who { grid-template-columns: minmax(0, 1fr) auto; }
    .who .grants { grid-column: 1; }
    .who .go { grid-row: 1 / span 2; grid-column: 2; }
  }
  @media (prefers-reduced-motion: no-preference) {
    button.who, .grant, input { transition: background-color .12s, box-shadow .12s, border-color .12s; }
  }
</style>
</head>
<body>
  <div class="sheet">
    <aside class="side">
      <div class="brand"><span class="mark">{{MARK}}</span>{{TITLE}}</div>
      {{MOTTO}}
      <dl class="facts">{{FACTS}}</dl>
      {{DEV}}
      <p class="foot">Don't have access? Sign in, then send an admin the id you are shown.</p>
    </aside>
    <main class="main">
      {{HEADING}}
      {{ERROR}}
      {{PASSWORD}}
      {{OR}}
      <div class="alts">{{BUTTONS}}{{NOSTR}}</div>
    </main>
  </div>
  <script>
    // IDENTITY-35: the dev sign-in's checkbox — this browser's sign-in to
    // plexus-idp, or back to the ordinary page.
    const dev = document.getElementById("dev-login");
    if (dev) dev.addEventListener("change", () => {
      document.cookie = "{{DEV_COOKIE}}=" + (dev.checked ? "1; Max-Age=2592000" : "; Max-Age=0") + "; Path=/; SameSite=Lax";
      location.reload();
    });
    // SSO asks for a work email first; nostr signs one NIP-98 event with the
    // browser's NIP-07 extension. Everything else is a plain form or link.
    for (const b of document.querySelectorAll("[data-sso]")) {
      b.addEventListener("click", () => {
        const f = document.getElementById(b.dataset.sso);
        f.classList.add("open");
        f.querySelector("input[type=email]").focus();
      });
    }
    const n = document.getElementById("nostr");
    if (n) {
      // IDENTITY-30: say what is happening — an extension may take its time
      // (a hardware wallet asks its owner), and a refusal says why.
      const say = (text, bad) => {
        let p = document.getElementById("nostr-status");
        if (!p) { p = document.createElement("p"); p.id = "nostr-status"; p.setAttribute("role", "status"); n.after(p); }
        p.className = bad ? "error" : "note";
        p.textContent = text;
      };
      // Each step to the server's log too: what the extension did never
      // reaches /login/nostr otherwise.
      const trace = (stage, detail) => {
        try {
          const ext = window.nostr ? Object.keys(window.nostr).sort().join(",") : "none";
          fetch("/login/nostr/trace", { method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ stage, detail: (detail || "") + " · window.nostr: " + ext + " · " + navigator.userAgent.slice(-60) }) });
        } catch (e) {}
      };
      if (!window.nostr) n.title = "needs a nostr extension (NIP-07) in this browser";
      n.addEventListener("click", async () => {
        if (!window.nostr) { say("No nostr extension (NIP-07) answers in this browser.", true); trace("no extension"); return; }
        const url = location.origin + "/login/nostr";
        n.disabled = true;
        say("Waiting for your nostr extension to sign…");
        trace("asked the extension to sign");
        const t0 = Date.now();
        const slow = setTimeout(() => { say("Still waiting for your nostr extension. Approve the request there (and on your signing device, if it uses one); a signature has to arrive within a minute."); trace("still waiting", "15 s"); }, 15000);
        let ev;
        try {
          ev = await window.nostr.signEvent({ kind: 27235, created_at: Math.floor(Date.now() / 1000),
            content: "", tags: [["u", url], ["method", "POST"]] });
        } catch (e) {
          clearTimeout(slow); n.disabled = false;
          say("Your nostr extension did not sign" + (e && e.message ? ": " + e.message : "."), true);
          trace("the extension refused", (e && e.message) || String(e));
          return;
        }
        clearTimeout(slow);
        if (!ev || !ev.sig) { n.disabled = false; say("Your nostr extension answered without a signature.", true); trace("answered without a signature", typeof ev + " " + JSON.stringify(ev).slice(0, 120)); return; }
        trace("the extension signed", Math.round((Date.now() - t0) / 1000) + " s");
        say("Signed. Signing in…");
        try {
          const r = await fetch(url + "?next=" + encodeURIComponent(n.dataset.next), {
            method: "POST", headers: { authorization: "Nostr " + btoa(JSON.stringify(ev)), accept: "application/json" } });
          const body = await r.json().catch(() => ({}));
          if (r.ok && body.next) { location.href = body.next; return; }
          n.disabled = false;
          say(body.error || "{{APP}} did not accept the signature (" + r.status + ").", true);
        } catch (e) {
          n.disabled = false;
          say("{{APP}} could not be reached: " + (e && e.message ? e.message : e), true);
        }
      });
    }
  </script>
</body>
</html>
