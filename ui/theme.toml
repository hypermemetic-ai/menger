# FRAME-30: menger's tokens — compiled by plexus-ui build to the bundle's
# theme.css, which ui/index.html loads first; every component's <style>
# paints with these, never a literal (SURFACE-10: `scripts/plexus-ui build`
# refuses one, --strict-colours). [light, dark, what it paints]; a colour is
# #rrggbb or #rrggbbaa, each token once.
#
# Whole (SURFACE-10), from APP-114's sheet (the designer's) — a pair for every
# status, a mark for every kind and severity, the focus ring, the skeleton,
# the disabled ink, the diff pair — the three statuses APP-114 left out and
# Epic and Doc from v1's tokens.toml (tickets-api/src/tokens.toml at v0.0.1).
# Every state the tokens paint is drawn at #/sheet (sheet-page), both schemes.

[colour.paper]
"--bg"       = ['#f8fafd', '#121417', 'the page']
"--panel"    = ['#ffffff', '#191b1e', 'the nav, the top bar, a panel head']
"--card"     = ['#ffffff', '#1f2124', 'a control face, a menu, the palette']
"--hover"    = ['#eceff3', '#222529', 'a row or control under the pointer']
"--sel"      = ['#eef1fc', '#1d2235', 'a flash, a pressed toggle']
"--row-sel"  = ['#e2e8fb', '#232b45', 'the selected row']
"--skeleton" = ['#e6e9ec', '#26292d', 'a row still loading']
"--shadow"   = ['#191b1f24', '#00000080', 'the lift under a menu or the palette']

[colour.ink]
"--ink"      = ['#191b1f', '#eaecef', 'text']
"--muted"    = ['#62676d', '#9399a0', 'labels, counts, hints']
"--disabled" = ['#989da2', '#64696f', 'a control that will not act']

[colour.line]
"--line"      = ['#dfe1e5', '#2a2d31', 'hairlines']
"--tree-line" = ['#ccd0d4', '#36393e', "the tree's connectors"]

[colour.accent]
"--accent" = ['#3b5bdb', '#8ea6ff', 'ids, links, the selected bar']
"--focus"  = ['#3b5bdb', '#8ea6ff', 'the keyboard ring (the accent, until a theme splits them)']

[colour.signal]
"--warn" = ['#b3261e', '#ff8a80', 'offline, a refusal, a filter that matches nothing, an unknown word']
"--live" = ['#2f7a2a', '#6cc66a', 'done in a roll-up, a write that landed']
"--err-fg" = ['#b3261e', '#ff8a80', "COMPS-5: v1's name for --warn, which v1's components (element/1) paint errors with"]

[colour.chip]
"--chip-bg"    = ['#eef0f4', '#23252b', 'a ticket chip, a count']
"--chip-fg"    = ['#55606e', '#aab4c2', "the chip's text"]
"--chip-line"  = ['#dde1e8', '#30333b', "the chip's edge"]
"--chip-hover" = ['#dfe3ea', '#2d3038', 'a chip under the pointer: a step from --chip-bg']

[colour.status]   # one pair per status, each over 4.5:1 in both modes
"--st-draft-bg"      = ['#e5eaf2', '#23282f', 'Draft']
"--st-draft-fg"      = ['#596575', '#b0bed0', 'Draft']
"--st-pending-bg"    = ['#f3e8c8', '#3a3115', 'Pending']
"--st-pending-fg"    = ['#7a5d00', '#e8cf7a', 'Pending']
"--st-ready-bg"      = ['#e3ecf7', '#1b2e46', 'Ready']
"--st-ready-fg"      = ['#2b5b8c', '#a3c6ee', 'Ready']
"--st-coding-bg"     = ['#fde0c5', '#3d2614', 'Coding']
"--st-coding-fg"     = ['#8f3f00', '#f4b37c', 'Coding']
"--st-in-review-bg"  = ['#cdeef4', '#10343b', 'In Review']
"--st-in-review-fg"  = ['#0b5b6b', '#85d2df', 'In Review']
"--st-complete-bg"   = ['#cfe9c9', '#16341f', 'Complete']
"--st-complete-fg"   = ['#256b1a', '#8fd39a', 'Complete']
"--st-blocked-bg"    = ['#fdecec', '#3d1a1c', 'Blocked']
"--st-blocked-fg"    = ['#aa2233', '#f09a9a', 'Blocked']
"--st-superseded-bg" = ['#f3d9d9', '#3b2224', 'Superseded']
"--st-superseded-fg" = ['#aa2222', '#dea3a3', 'Superseded']
"--st-canceled-bg"   = ['#e9ebee', '#292b2e', 'Canceled']
"--st-canceled-fg"   = ['#5a5d62', '#b3b7bb', 'Canceled']
"--st-epic-bg"       = ['#e6dcf5', '#2e2143', 'Epic']
"--st-epic-fg"       = ['#5b3a8c', '#cdb4f2', 'Epic']
"--st-doc-bg"        = ['#e8e8ec', '#26262c', 'Doc']
"--st-doc-fg"        = ['#4a4a55', '#b8b8c4', 'Doc']

[colour.kind]   # the kind mark's fill; its shape says the kind too
"--kind-scope"     = ['#7a5d00', '#e3c56a', 'scope: a diamond']
"--kind-build"     = ['#3b5bdb', '#8ea6ff', 'build: a dot']
"--kind-execution" = ['#2f7a2a', '#6cc66a', 'execution: a square']
"--kind-gap"       = ['#b3261e', '#ff8a80', 'gap: a triangle']
"--kind-spike"     = ['#6b3fa0', '#c7abf2', 'spike: a ring']
"--kind-doc"       = ['#62676d', '#9399a0', "doc: a page's outline"]

[colour.severity]   # the three bars
"--sev-critical" = ['#b3261e', '#ff8a80', 'critical: three bars']
"--sev-high"     = ['#c4561b', '#ffab70', 'high: three bars']
"--sev-medium"   = ['#9a6b00', '#e6c065', 'medium: two bars']
"--sev-low"      = ['#62676d', '#9399a0', 'low: one bar']

[colour.code]   # EDITOR-9: code painted by its language (@lezer/highlight's classes), on --panel; One Light / One Dark's hues
"--code-keyword"  = ['#a626a4', '#c678dd', 'a keyword, an atom, a boolean']
"--code-string"   = ['#3f8a3e', '#98c379', 'a string, a literal, a URL']
"--code-number"   = ['#986801', '#d19a66', 'a number']
"--code-comment"  = ['#7d7e85', '#7f848e', 'a comment (italic)']
"--code-type"     = ['#a36a00', '#e5c07b', 'a type, a class, a namespace']
"--code-def"      = ['#2f63d9', '#61afef', 'a definition: the name a function or a binding is given']
"--code-property" = ['#0176a5', '#56b6c2', 'a property name']
"--code-meta"     = ['#c8402f', '#e06c75', 'a macro, an attribute, a preprocessor line']

[colour.diff]   # a revision's diff: a line added, a line removed (SURFACE-4's mockup)
"--diff-add-bg" = ['#e1f2dc', '#15301b', 'an added line']
"--diff-add-fg" = ['#256b1a', '#8fd39a', "an added line's text, the +N"]
"--diff-del-bg" = ['#fbe7e7', '#3a1b1d', 'a removed line']
"--diff-del-fg" = ['#a3262f', '#f09a9a', "a removed line's text, the −N"]

[colour.chart]   # V2-70: a chart's series, in this fixed order (never cycled; a fourth folds or facets) — the dataviz skill's
                 # categorical slots 1–3 (blue, orange, aqua), slot 1 light on menger's accent, validated by its
                 # validate_palette.js against --panel: light #ffffff all checks pass (aqua 2.8:1 — relief: the legend,
                 # the tooltip and the table view), dark #191b1e all pass; adjacent and all-pairs alike
"--chart-1" = ['#3b5bdb', '#3987e5', "a chart's first series (files kept; fetched)"]
"--chart-2" = ['#eb6834', '#d95926', "a chart's second series (tickets; served)"]
"--chart-3" = ['#1baf7a', '#199e70', "a chart's third series (documents)"]

[type]
"--font-text"     = ['"Geist Mono", ui-monospace, monospace', '"Geist Mono", ui-monospace, monospace', 'the app']
"--font-display"  = ['"Geist", system-ui, sans-serif', '"Geist", system-ui, sans-serif', "a ticket's title"]
"--sans"          = ['"Geist", system-ui, sans-serif', '"Geist", system-ui, sans-serif', 'a body']
"--text-size"     = ['13px', '13px', 'the body size']
"--weight-medium" = ['500', '500', 'a code, a head']
"--weight-strong" = ['600', '600', 'a title']
"--weight-bold"   = ['700', '700', 'a count']
"--mono"          = ['"Geist Mono", ui-monospace, monospace', '"Geist Mono", ui-monospace, monospace', "COMPS-5: v1's name for --font-text, which v1's components (element/1) set code in"]
"--text-scale"    = ['1', '1', "COMPS-5: v1's text scale, which v1's components (element/1) size their type by (calc(13px * var(--text-scale)))"]

[space]
"--pitch"  = ['28px', '28px', 'a row']
"--border" = ['1px', '1px', 'every hairline']
"--ind"    = ['0', '0', 'EDITOR-12: the indent of a code line in columns, set on the line; wrapped, its rows hang past it']

[shape]
"--radius-xs"   = ['2px', '2px', 'a mark']
"--radius-sm"   = ['3px', '3px', 'a key, a skeleton bar']
"--radius"      = ['4px', '4px', 'a control']
"--radius-md"   = ['5px', '5px', 'a status chip']
"--radius-lg"   = ['6px', '6px', 'a menu']
"--radius-xl"   = ['8px', '8px', 'the palette']
"--radius-pill" = ['999px', '999px', 'a ticket chip, a count']

[motion]   # reduced motion: none of them run
"--motion-fast"  = ['.12s', '.12s', 'a hover, a menu opening']
"--motion-flash" = ['1.8s', '1.8s', 'a new row flashing --sel']
"--motion-pulse" = ['1.2s', '1.2s', 'a skeleton breathing, the spinner']
"--ease"         = ['ease-out', 'ease-out', 'all of them']
