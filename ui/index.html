<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<!-- UI-6: the shell stamps the socket's port and the version this page is
     served for; the engine's files are that version's, immutable. -->
<meta name="menger-ws-port" content="{{WS_PORT}}">
<meta name="menger-ui-version" content="{{UI_VERSION}}">
<!-- FRAME-16: what the boot needs, asked with the HTML; host.js's start
     makes the socket and reads the manifest and the components while the
     wasm downloads and instantiates, then hands them over. -->
<link rel="modulepreload" href="/app/{{UI_VERSION}}/host.js">
<link rel="modulepreload" href="/app/{{UI_VERSION}}/engine.js">
<link rel="preload" as="fetch" crossorigin href="/app/{{UI_VERSION}}/engine.wasm">
<link rel="preload" as="fetch" crossorigin href="/app/{{UI_VERSION}}/manifest.json">
<link rel="preload" as="fetch" crossorigin href="/app/{{UI_VERSION}}/components.json">
<script type="module">
const version = document.querySelector('meta[name="menger-ui-version"]').content;
const { start } = await import(`/app/${version}/host.js`);
start(version);
</script>
<style>
/* UI-8: the first pages' looks — tokens on :root, light and dark. */
:root { --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6860; --line: #e4e1d9; --accent: #3b5bdb; --hover: #f1efe9; --warn: #b3261e; --pitch: 28px; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141412; --panel: #1c1b19; --ink: #ecebe6; --muted: #9b988f; --line: #2e2d29; --accent: #8ea6ff; --hover: #26251f; --warn: #ff8a80; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #141412; --panel: #1c1b19; --ink: #ecebe6; --muted: #9b988f; --line: #2e2d29; --accent: #8ea6ff; --hover: #26251f; --warn: #ff8a80; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
board-layout, ticket-page, board-layout-sv, ticket-page-sv { display: block; }
.board-layout { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.topbar { display: flex; align-items: flex-start; gap: 12px; padding: 10px max(16px, env(safe-area-inset-left)); border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-weight: 650; letter-spacing: .02em; padding-top: 6px; }
.hint { margin-left: auto; color: var(--muted); font-size: 12px; padding-top: 8px; white-space: nowrap; }
filter-line, .topbar > .filter-line { flex: 1; min-width: 0; }
.filter-input { width: 100%; max-width: 640px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.filter-refused { margin: 4px 0 0; color: var(--warn); font-size: 12px; }
.board-body { flex: 1; min-height: 0; display: flex; }
.board-body > [data-slot=nav] { width: 260px; flex: none; border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
.board-body > [data-slot=main] { flex: 1; min-width: 0; display: flex; }
board-rows, board-rows-sv { display: flex; flex: 1; min-width: 0; }
.board { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.board-head { padding: 8px 16px; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: baseline; }
.board-count { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.board-status { margin-left: auto; font-size: 12px; }
.board-scroll { flex: 1; min-height: 0; overflow: auto; position: relative; }
.board-space { position: relative; }
.board-window { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.board-row { height: var(--pitch); display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.board-row:hover, .nav-row:hover, .palette-hit:hover { background: var(--hover); }
.row-id { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6.5em; }
.row-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row-kind { color: var(--muted); font-size: 12px; }
.row-status, .tag { font-size: 12px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 10px; }
.nav-tree { padding: 8px 0; }
.nav-modes { display: flex; gap: 4px; padding: 0 12px 8px; }
.nav-mode { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 2px 10px; cursor: pointer; }
.nav-mode[aria-pressed=true] { background: var(--hover); font-weight: 600; }
.nav-groups, .nav-children, .nav-flat, .palette-hits, .ticket-children ul { list-style: none; margin: 0; padding: 0; }
.nav-group-row { display: flex; align-items: center; gap: 6px; padding: 2px 12px 2px 6px; }
.nav-toggle { border: 0; background: none; cursor: pointer; width: 22px; color: var(--muted); }
.nav-code { font-weight: 600; flex: 1; }
.nav-rollup { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; display: flex; gap: 3px; }
.nav-held { font-size: 12px; color: var(--accent); }
.nav-children { padding-left: 28px; }
.nav-row { display: flex; gap: 6px; padding: 2px 12px; white-space: nowrap; overflow: hidden; }
.nav-row .row-id { min-width: 0; }
.jump-palette .palette-sheet { position: fixed; z-index: 10; top: 12vh; left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.25); padding: 10px; }
.palette-input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.palette-hit { display: flex; gap: 8px; padding: 4px 8px; border-radius: 6px; }
.palette-label { margin: 8px 8px 2px; color: var(--muted); font-size: 12px; }
.ticket-page { max-width: 860px; margin: 0 auto; padding: 16px; }
.crumbs { margin-bottom: 12px; color: var(--muted); }
.ticket-code { margin: 0; color: var(--muted); }
.ticket-title { margin: 4px 0 10px; font-size: 24px; line-height: 1.25; }
.ticket-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.status-menu { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chip { display: inline-flex; gap: 6px; align-items: baseline; border: 1px solid var(--line); border-radius: 14px; padding: 2px 10px; max-width: 100%; }
.chip-kind { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.chip-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 28ch; }
.ticket-body { border-top: 1px solid var(--line); padding-top: 8px; overflow-wrap: anywhere; }
.ticket-body a { color: var(--accent); text-decoration: underline; }
.ticket-body pre { overflow: auto; background: var(--hover); padding: 8px; border-radius: 6px; }
.ticket-children h2 { font-size: 15px; margin: 20px 0 6px; }
.ticket-children a { display: flex; gap: 8px; padding: 3px 0; align-items: baseline; }
.empty { color: var(--muted); }
@media (max-width: 720px) {
  .board-body > [data-slot=nav] { display: none; }
  .hint { display: none; }
  .row-kind { display: none; }
}
</style>
</head>
<body></body>
</html>
