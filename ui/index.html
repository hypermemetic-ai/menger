<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<!-- UI-6: the shell stamps the socket's port and the version this page is
     served for; the engine's files are that version's, immutable. -->
<meta name="menger-ws-port" content="{{WS_PORT}}">
<meta name="menger-ui-version" content="{{UI_VERSION}}">
<!-- EDITOR-14, APP-110: the test app's origin a body's live view frames (`--live-origin`), empty when none. -->
<meta name="menger-live-origin" content="{{LIVE_ORIGIN}}">
<!-- FRAME-16: what the boot needs, asked with the HTML; host.js's start
     makes the socket and reads the manifest and the components while the
     wasm downloads and instantiates, then hands them over. -->
<!-- FRAME-30: the theme's tokens, light and dark, before anything is drawn. -->
<link rel="stylesheet" href="/app/{{UI_VERSION}}/theme.css">
<link rel="modulepreload" href="/app/{{UI_VERSION}}/host.js">
<link rel="modulepreload" href="/app/{{UI_VERSION}}/engine.js">
<link rel="preload" as="fetch" crossorigin href="/app/{{UI_VERSION}}/engine.wasm">
<link rel="preload" as="fetch" crossorigin href="/app/{{UI_VERSION}}/manifest.json">
<link rel="preload" as="fetch" crossorigin href="/app/{{UI_VERSION}}/components.json">
<!-- FRAME-26: the bundle's one svelte/1 runtime, which every Svelte module
     imports (./svelte-runtime.js) — asked with the HTML, not after a module. -->
<link rel="modulepreload" href="/app/{{UI_VERSION}}/components/svelte-runtime.js">
<script type="module">
const version = document.querySelector('meta[name="menger-ui-version"]').content;
const { start } = await import(`/app/${version}/host.js`);
start(version);
</script>
<style>
/* FRAME-30: the page's frame alone. The tokens are the bundle's theme.css
   (ui/theme.toml), loaded above; every component carries its own sheet. */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: var(--text-size)/1.45 var(--font-text); }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
</style>
</head>
<body></body>
</html>
